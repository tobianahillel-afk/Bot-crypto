[project]
name = "crypto-quant-bot"
version = "0.32.0"
description = "Crypto Quant Bot V3.2-Ops — Lot 32 validated offline instrument normalization"
requires-python = "==3.11.*"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit==1.8.0",
  "diff-cover==9.2.0",
  "hypothesis==6.161.0",
  "mypy==1.18.1",
  "mutmut==3.5.0",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "radon==6.0.1",
  "ruff==0.12.0",
]

[tool.pytest.ini_options]
addopts = [
  "--tb=short",
  "-p", "no:ddtrace",
  "-p", "no:pytest_jsonreport",
  "-p", "no:metadata",
  "-p", "no:asyncio",
  "-p", "no:anyio",
  "-p", "no:Faker",
  "-p", "no:cacheprovider",
]
testpaths = ["tests"]
pythonpath = ["src"]
console_output_style = "classic"

[tool.coverage.run]
branch = true
source = ["src/crypto_quant_bot"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mutants", ".hypothesis", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF"]
ignore = ["E501", "B905", "RUF001", "RUF002", "RUF003", "RUF046"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
show_error_codes = true
exclude = ["mutants/", "tests/"]

[tool.mutmut]
source_paths = [
  "src/crypto_quant_bot/contracts/",
  "src/crypto_quant_bot/market_analysis/",
]
only_mutate = [
  "src/crypto_quant_bot/market_analysis/technical_indicators.py",
  "src/crypto_quant_bot/market_analysis/numeric.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_p0_numeric_validation.py",
  "tests/test_p0_math_properties.py",
  "tests/test_p0_math_parameter_contracts.py",
]
also_copy = [
  "src/crypto_quant_bot/__init__.py",
  "src/crypto_quant_bot/core/",
  "src/crypto_quant_bot/data/",
  "config/",
  "contracts/",
  "pyproject.toml",
]
mutate_only_covered_lines = true
max_stack_depth = 10
timeout_multiplier = 8.0
timeout_constant = 1.0
do_not_mutate_patterns = ['raise \w+', 'logger\.\w+']
