[project]
name = "crypto-quant-bot"
version = "0.10.0-lot10"
description = "Crypto Quant Bot V3.1-Ops Lot 10 transaction costs v0 foundation"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
addopts = ["--tb=short", "-s", "-p", "no:ddtrace", "-p", "no:pytest_jsonreport", "-p", "no:metadata", "-p", "no:asyncio", "-p", "no:anyio", "-p", "no:cov", "-p", "no:Faker", "-p", "no:cacheprovider", "-p", "no:faulthandler"]
testpaths = ["tests"]
pythonpath = ["src"]
console_output_style = "classic"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
