name: Lot 44 trades aggressor classification validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema*.py'
      - 'tests/test_lot44*.py'
      - 'config/microstructure/trades_and_aggressor_classification_schema_v1.json'
      - 'contracts/schemas/classified_trade_v1.schema.json'
      - 'contracts/schemas/aggressor_confidence_state_v1.schema.json'
      - 'contracts/schemas/trades_aggressor_classification_schema_*.schema.json'
      - 'scripts/run_lot44_trades_and_aggressor_classification_schema.py'
      - 'scripts/validate_lot44.py'
      - 'scripts/validate_lot44_no_connectivity.py'
      - 'docs/LOT_44_TRADES_AND_AGGRESSOR_CLASSIFICATION_SCHEMA.md'
      - 'docs/ACCEPTANCE_CRITERIA_LOT_44.md'
      - 'reports/lot_44_trades_and_aggressor_classification_schema_report.md'
      - '.github/workflows/lot44-trades-aggressor-classification.yml'
      - 'requirements-dev.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot44:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      GATE_MERGE_SHA: 6bbf4fcc5543f2599378bcab93263e2c8cebcec6
      SOURCE_HEAD_SHA: 29cf31ba581346b1d7d328911daa76a6c7a681a1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 29cf31ba581346b1d7d328911daa76a6c7a681a1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove exact frozen source and gate ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          git merge-base --is-ancestor "$GATE_MERGE_SHA" "$SOURCE_HEAD_SHA"
          test ! -e src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine.py
          test ! -e scripts/run_lot45_order_flow_delta_and_cvd_engine.py
          test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine.py
          test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine_models.py
          test ! -e scripts/run_lot46_trade_classification_confidence_engine.py
          test ! -e scripts/validate_lot46.py
          test ! -e tests/test_lot46_trade_classification_confidence_engine.py
      - name: Compile lint type schema and no-connectivity checks
        run: |
          set -euo pipefail
          mkdir -p reports/lot44
          {
            python -m compileall -q src scripts tests
            for path in \
              config/microstructure/trades_and_aggressor_classification_schema_v1.json \
              contracts/schemas/classified_trade_v1.schema.json \
              contracts/schemas/aggressor_confidence_state_v1.schema.json \
              contracts/schemas/trades_aggressor_classification_schema_state_v1.schema.json \
              contracts/schemas/trades_aggressor_classification_schema_audit_v1.schema.json; do
              python -m json.tool "$path" >/dev/null
            done
            ruff check \
              src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py \
              src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py \
              src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py \
              scripts/run_lot44_trades_and_aggressor_classification_schema.py \
              scripts/validate_lot44.py scripts/validate_lot44_no_connectivity.py \
              tests/test_lot44_trades_and_aggressor_classification_schema.py \
              tests/test_lot44_schema_contracts.py
            mypy src/crypto_quant_bot/microstructure
            python scripts/validate_lot44_no_connectivity.py
          } 2>&1 | tee reports/lot44/static_checks.txt
      - name: Targeted line and branch coverage
        run: |
          set -euo pipefail
          coverage erase
          pytest -q \
            tests/test_lot44_trades_and_aggressor_classification_schema.py \
            tests/test_lot44_schema_contracts.py \
            --cov=crypto_quant_bot.microstructure.trades_and_aggressor_classification_schema \
            --cov=crypto_quant_bot.microstructure.trades_and_aggressor_classification_schema_models \
            --cov=crypto_quant_bot.microstructure.trades_and_aggressor_classification_schema_validation \
            --cov-branch --cov-report=json:reports/lot44/coverage.json --cov-report=term-missing \
            2>&1 | tee reports/lot44/targeted_coverage.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          totals=json.loads(Path('reports/lot44/coverage.json').read_text())['totals']
          lines=float(totals['percent_statements_covered'])
          branches=float(totals['percent_branches_covered'])
          result={
              'schema_version':'lot44-coverage-summary-v1',
              'status':'PASS' if lines>=95 and branches>=90 else 'FAIL',
              'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
              'line_coverage_percent':round(lines,2),
              'branch_coverage_percent':round(branches,2),
              'line_coverage_min_percent':95.0,
              'branch_coverage_min_percent':90.0,
              'anti_flake_repetitions':3,
          }
          Path('reports/lot44/coverage_summary.json').write_text(
              json.dumps(result,indent=2,sort_keys=True)+'\n', encoding='utf-8'
          )
          print(json.dumps(result,sort_keys=True))
          if result['status']!='PASS':
              raise SystemExit('LOT44_CRITICAL_COVERAGE_BELOW_THRESHOLD')
          PY
      - name: Generate validate and replay deterministic evidence
        run: |
          set -euo pipefail
          outputs=(
            data/audit/trades_and_aggressor_classification_schema_lot44.json
            data/audit/trades_and_aggressor_classification_schema_audit_lot44.json
            data/audit/aggressor_confidence_state_lot44.json
          )
          rm -rf /tmp/lot44-run1
          mkdir -p /tmp/lot44-run1
          python scripts/run_lot44_trades_and_aggressor_classification_schema.py --code-commit "$SOURCE_HEAD_SHA"
          python scripts/validate_lot44.py --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
          python scripts/validate_lot44_no_connectivity.py
          for path in "${outputs[@]}"; do cp "$path" "/tmp/lot44-run1/$(basename "$path")"; done
          python scripts/run_lot44_trades_and_aggressor_classification_schema.py --code-commit "$SOURCE_HEAD_SHA"
          python scripts/validate_lot44.py --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
          for path in "${outputs[@]}"; do cmp "/tmp/lot44-run1/$(basename "$path")" "$path"; done
      - name: Architecture roadmap traceability engineering and safety
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          python scripts/validate_lot44_no_connectivity.py
      - name: Security dependency regression and anti-flake
        run: |
          bandit -q -r \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py \
            scripts/validate_lot44.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do
            pytest -q \
              tests/test_lot44_trades_and_aggressor_classification_schema.py \
              tests/test_lot44_schema_contracts.py
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot44-trades-aggressor-classification-evidence
          path: |
            reports/lot44/
            data/audit/trades_and_aggressor_classification_schema_lot44.json
            data/audit/trades_and_aggressor_classification_schema_audit_lot44.json
            data/audit/aggressor_confidence_state_lot44.json
