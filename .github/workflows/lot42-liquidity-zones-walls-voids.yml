name: Lot 42 liquidity zones walls voids validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot42:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      GATE_MERGE_SHA: 7456c5b80b609ee5958d8b6da0effd489faa308c
      SOURCE_HEAD_SHA: 2d91da1777f1ccbd7f81563dbc74fd3b89eecdf2
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove exact gate ancestry source availability and Lot 44 absence
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GATE_MERGE_SHA" HEAD
          git rev-parse --verify "$SOURCE_HEAD_SHA^{commit}" >/dev/null
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py
          test ! -e config/microstructure/trades_and_aggressor_classification_schema_v1.json
          test ! -e scripts/run_lot44_trades_and_aggressor_classification_schema.py
          test ! -e scripts/validate_lot44.py
          test ! -e docs/LOT_44_TRADES_AND_AGGRESSOR_CLASSIFICATION_SCHEMA.md
          test ! -e docs/ACCEPTANCE_CRITERIA_LOT_44.md
      - name: Compile lint type schema and no-connectivity checks
        run: |
          set -euo pipefail
          mkdir -p reports/lot42
          {
            python -m compileall -q src scripts tests
            for path in \
              config/microstructure/liquidity_zones_walls_and_voids_engine_v1.json \
              contracts/schemas/liquidity_zone_set_v1.schema.json \
              contracts/schemas/liquidity_zones_walls_voids_engine_state_v1.schema.json \
              contracts/schemas/liquidity_zones_walls_voids_engine_audit_v1.schema.json; do
              python -m json.tool "$path" >/dev/null
            done
            ruff check \
              src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine.py \
              src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine_models.py \
              src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine_validation.py \
              src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_analysis.py \
              src/crypto_quant_bot/microstructure/__init__.py \
              scripts/run_lot42_liquidity_zones_walls_and_voids_engine.py \
              scripts/validate_lot42.py scripts/validate_lot42_no_connectivity.py \
              tests/test_lot42*.py
            mypy src/crypto_quant_bot/microstructure
            python scripts/validate_lot42_no_connectivity.py
          } 2>&1 | tee reports/lot42/static_checks.txt
      - name: Targeted line and branch coverage
        run: |
          set -euo pipefail
          coverage erase
          pytest -q tests/test_lot42*.py \
            --cov=crypto_quant_bot.microstructure.liquidity_zones_walls_and_voids_engine \
            --cov=crypto_quant_bot.microstructure.liquidity_zones_walls_and_voids_engine_models \
            --cov=crypto_quant_bot.microstructure.liquidity_zones_walls_and_voids_engine_validation \
            --cov=crypto_quant_bot.microstructure.liquidity_zones_walls_and_voids_analysis \
            --cov-branch --cov-report=json:reports/lot42/coverage.json --cov-report=term-missing \
            2>&1 | tee reports/lot42/targeted_coverage.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          totals=json.loads(Path('reports/lot42/coverage.json').read_text())['totals']
          lines=float(totals['percent_statements_covered'])
          branches=float(totals['percent_branches_covered'])
          result={
              'schema_version':'lot42-coverage-summary-v1',
              'status':'PASS' if lines>=95 and branches>=90 else 'FAIL',
              'source_head_sha':os.environ['CANDIDATE_SHA'],
              'line_coverage_percent':round(lines,2),
              'branch_coverage_percent':round(branches,2),
              'line_coverage_min_percent':95.0,
              'branch_coverage_min_percent':90.0,
              'anti_flake_repetitions':3,
          }
          Path('reports/lot42/coverage_summary.json').write_text(
              json.dumps(result,indent=2,sort_keys=True)+'\n', encoding='utf-8'
          )
          print(json.dumps(result,sort_keys=True))
          if result['status']!='PASS':
              raise SystemExit('LOT42_CRITICAL_COVERAGE_BELOW_THRESHOLD')
          PY
      - name: Replay certified Lot 42 source and compare frozen outputs
        run: |
          set -euo pipefail
          outputs=(
            data/audit/liquidity_zones_walls_and_voids_engine_lot42.json
            data/audit/liquidity_zones_walls_and_voids_engine_audit_lot42.json
            data/audit/liquidity_zone_set_lot42.json
          )
          rm -rf /tmp/lot42-source-validation /tmp/lot42-run1
          git worktree add --detach /tmp/lot42-source-validation "$SOURCE_HEAD_SHA"
          trap 'git worktree remove --force /tmp/lot42-source-validation >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/lot42-run1
          (
            cd /tmp/lot42-source-validation
            PYTHONPATH=src python scripts/run_lot42_liquidity_zones_walls_and_voids_engine.py --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot42.py --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            PYTHONPATH=src python scripts/validate_lot42_no_connectivity.py
            for path in "${outputs[@]}"; do cp "$path" "/tmp/lot42-run1/$(basename "$path")"; done
            PYTHONPATH=src python scripts/run_lot42_liquidity_zones_walls_and_voids_engine.py --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot42.py --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            for path in "${outputs[@]}"; do cmp "/tmp/lot42-run1/$(basename "$path")" "$path"; done
          )
          for path in "${outputs[@]}"; do
            cmp "/tmp/lot42-source-validation/$path" "$GITHUB_WORKSPACE/$path"
          done
          git worktree remove --force /tmp/lot42-source-validation
          trap - EXIT
      - name: Architecture roadmap traceability engineering and safety
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          python scripts/validate_lot42_no_connectivity.py
      - name: Security dependency regression and anti-flake
        run: |
          bandit -q -r \
            src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine.py \
            src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine_models.py \
            src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine_validation.py \
            src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_analysis.py \
            scripts/validate_lot42.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do pytest -q tests/test_lot42*.py; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot42-liquidity-zones-walls-voids-evidence
          path: |
            reports/lot42/
            data/audit/liquidity_zones_walls_and_voids_engine_lot42.json
            data/audit/liquidity_zones_walls_and_voids_engine_audit_lot42.json
            data/audit/liquidity_zone_set_lot42.json
