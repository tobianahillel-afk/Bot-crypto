name: Lot 32 critical mutation assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/crypto_quant_bot/data_governance/instrument_symbol_and_contract_normalization*.py'
      - 'tests/test_lot32_instrument_symbol_and_contract_normalization.py'
      - 'tests/test_lot32_validation_boundaries.py'
      - 'tests/test_lot32_mutation_oracles.py'
      - 'config/data_governance/instrument_symbol_contract_normalization_v1.json'
      - '.github/workflows/lot32-mutation.yml'
      - 'requirements-dev.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Build isolated Lot 32 mutation workspace
        run: |
          rm -rf .tmp-lot32-mutants reports/lot32/mutation
          mkdir -p \
            .tmp-lot32-mutants/src/crypto_quant_bot/data_governance \
            .tmp-lot32-mutants/tests \
            .tmp-lot32-mutants/scripts \
            .tmp-lot32-mutants/config/data_governance \
            .tmp-lot32-mutants/data/audit \
            .tmp-lot32-mutants/contracts/schemas \
            reports/lot32/mutation
          cp src/crypto_quant_bot/__init__.py .tmp-lot32-mutants/src/crypto_quant_bot/
          cp src/crypto_quant_bot/data_governance/*.py \
            .tmp-lot32-mutants/src/crypto_quant_bot/data_governance/
          cp tests/test_lot32_instrument_symbol_and_contract_normalization.py \
            .tmp-lot32-mutants/tests/
          cp tests/test_lot32_validation_boundaries.py .tmp-lot32-mutants/tests/
          cp tests/test_lot32_mutation_oracles.py .tmp-lot32-mutants/tests/
          cp scripts/validate_lot32_no_connectivity.py .tmp-lot32-mutants/scripts/
          cp config/data_governance/instrument_symbol_contract_normalization_v1.json \
            .tmp-lot32-mutants/config/data_governance/
          cp data/audit/lot32_v3_entry_gate.json .tmp-lot32-mutants/data/audit/
          cp data/audit/source_registry_lot31.json .tmp-lot32-mutants/data/audit/
          cp data/audit/market_data_governance_scope_and_source_registry_lot31.json \
            .tmp-lot32-mutants/data/audit/
          cp data/audit/market_data_governance_scope_and_source_registry_audit_lot31.json \
            .tmp-lot32-mutants/data/audit/
          cp contracts/schemas/instrument_*.json .tmp-lot32-mutants/contracts/schemas/
          cat > .tmp-lot32-mutants/pyproject.toml <<'TOML'
          [project]
          name = "crypto-quant-bot"
          version = "0.32.0.dev0"
          requires-python = "==3.11.*"
          dependencies = []

          [tool.pytest.ini_options]
          pythonpath = ["src", "."]
          addopts = ["--tb=short", "-p", "no:cacheprovider"]

          [tool.mutmut]
          paths_to_mutate = [
            "src/crypto_quant_bot/data_governance/instrument_symbol_and_contract_normalization.py",
            "src/crypto_quant_bot/data_governance/instrument_symbol_and_contract_normalization_models.py",
          ]
          tests_dir = ["tests/"]
          runner = "python -m pytest -q tests/test_lot32_instrument_symbol_and_contract_normalization.py tests/test_lot32_validation_boundaries.py tests/test_lot32_mutation_oracles.py"
          also_copy = [
            "src/crypto_quant_bot/__init__.py",
            "src/crypto_quant_bot/data_governance/__init__.py",
            "src/crypto_quant_bot/data_governance/market_data_governance_scope_and_source_registry.py",
            "src/crypto_quant_bot/data_governance/market_data_governance_scope_and_source_registry_models.py",
            "src/crypto_quant_bot/data_governance/source_registry_models.py",
            "src/crypto_quant_bot/data_governance/source_registry_state.py",
            "src/crypto_quant_bot/data_governance/source_registry_validation.py",
            "scripts/validate_lot32_no_connectivity.py",
            "config/data_governance/instrument_symbol_contract_normalization_v1.json",
            "data/audit/lot32_v3_entry_gate.json",
            "data/audit/source_registry_lot31.json",
            "data/audit/market_data_governance_scope_and_source_registry_lot31.json",
            "data/audit/market_data_governance_scope_and_source_registry_audit_lot31.json",
            "contracts/schemas/instrument_specification_v1.schema.json",
            "contracts/schemas/instrument_registry_v1.schema.json",
            "contracts/schemas/instrument_symbol_contract_normalization_state_v1.schema.json",
            "contracts/schemas/instrument_symbol_contract_normalization_audit_v1.schema.json",
          ]
          mutate_only_covered_lines = true
          timeout_factor = 8.0
          do_not_mutate_patterns = ['raise \\w+', 'logger\\.\\w+']
          TOML
      - name: Run mutation suite
        shell: bash
        run: |
          set -o pipefail
          cd .tmp-lot32-mutants
          mutmut run 2>&1 | tee ../reports/lot32/mutation/run.txt
          mutmut results 2>&1 | tee ../reports/lot32/mutation/results.txt || true
      - name: Enforce mutation score
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('reports/lot32/mutation/run.txt')
          if not path.is_file():
              raise SystemExit('LOT32_MUTATION_RUN_LOG_MISSING')
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          text = text.replace('\r', '\n').replace('\ufe0f', '')
          counter_pattern = re.compile(r'(\d+)\s*/\s*(\d+)')
          summary_pattern = re.compile(
              r'🎉\s*(\d+)[\s\S]*?⏰\s*(\d+)[\s\S]*?🤔\s*(\d+)[\s\S]*?🙁\s*(\d+)'
          )
          parsed = None
          for counter in reversed(list(counter_pattern.finditer(text))):
              completed, total = map(int, counter.groups())
              if completed != total or total <= 0:
                  continue
              summary = summary_pattern.search(text, counter.end())
              if summary is None:
                  continue
              killed, timeout, suspicious, survived = map(int, summary.groups())
              if killed + timeout + suspicious + survived == total:
                  parsed = (completed, total, killed, timeout, suspicious, survived)
                  break
          if parsed is None:
              raise SystemExit('LOT32_MUTATION_SCORE_PARSE_ERROR')
          completed, total, killed, timeout, suspicious, survived = parsed
          evaluated = killed + timeout + suspicious + survived
          score = 100.0 * (killed + timeout) / evaluated
          payload = {
              'schema_version': 'lot32-critical-mutation-score-v1',
              'scope': 'instrument_symbol_contract_normalization',
              'killed': killed,
              'timeout': timeout,
              'survived': survived,
              'suspicious': suspicious,
              'evaluated': evaluated,
              'completed': completed,
              'total': total,
              'score_percent': round(score, 2),
              'minimum_score_percent': 80.0,
              'status': 'PASS' if score >= 80.0 else 'FAIL',
          }
          output = Path('reports/lot32/mutation/score.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          if score < 80.0:
              raise SystemExit('LOT32_MUTATION_BELOW_80_PERCENT')
          PY
      - name: Verify canonical source immutability
        run: |
          rm -rf .tmp-lot32-mutants
          git diff --exit-code -- src/crypto_quant_bot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot32-critical-mutation-evidence
          path: reports/lot32/mutation/
