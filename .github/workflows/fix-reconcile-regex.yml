name: Fix historical reconciliation parser

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/roadmap-v1-v21-documentation
          fetch-depth: 0
      - name: Fix JSONL extension parsing order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/reconcile-historical-roadmap.yml')
          text = path.read_text(encoding='utf-8')
          old = r'(?:py|json|jsonl|md|sh|toml|txt|csv)'
          new = r'(?:py|jsonl|json|md|sh|toml|txt|csv)'
          if old not in text:
              raise SystemExit('Target regex not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-reconcile-regex.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix historical evidence path parser'
          git push origin HEAD:agent/roadmap-v1-v21-documentation
