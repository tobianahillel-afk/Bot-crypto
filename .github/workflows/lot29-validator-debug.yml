name: Lot 29 validator 21 diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot29-validator-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Run Lot 21 validator with native output
        run: python scripts/validate_lot21.py
