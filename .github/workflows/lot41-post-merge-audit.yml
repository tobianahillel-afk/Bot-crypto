name: Lot 41 independent post-merge audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot41-post-merge-audit.yml'
      - 'src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine*.py'
      - 'config/microstructure/spread_depth_and_imbalance_engine_v1.json'
      - 'contracts/schemas/book_feature_state_v1.schema.json'
      - 'contracts/schemas/spread_depth_imbalance*.schema.json'
      - 'scripts/*lot41*'
      - 'tests/test_lot41*.py'
      - 'docs/*LOT_41*'
      - 'data/audit/*lot41.json'
      - 'reports/lot41/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      LOT41_AUDIT_MERGE: 2b4186aa0bac2f60819361958e6eff215699ab53
      SOURCE_HEAD_SHA: 14c0d8da1b02d076b3c43a07a34ac96c673018b0
      IMPLEMENTATION_MERGE_SHA: a253ce35c97303e8b8c65707c07597e996b3a832
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove historical audit ancestry and frozen production immutability
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$LOT41_AUDIT_MERGE" HEAD
          git merge-base --is-ancestor "$IMPLEMENTATION_MERGE_SHA" "$LOT41_AUDIT_MERGE"
          git diff --quiet "$IMPLEMENTATION_MERGE_SHA" HEAD -- \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_models.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_validation.py \
            config/microstructure/spread_depth_and_imbalance_engine_v1.json \
            contracts/schemas/book_feature_state_v1.schema.json \
            contracts/schemas/spread_depth_imbalance_engine_state_v1.schema.json \
            contracts/schemas/spread_depth_imbalance_engine_audit_v1.schema.json \
            scripts/run_lot41_spread_depth_and_imbalance_engine.py \
            scripts/validate_lot41.py \
            scripts/validate_lot41_no_connectivity.py \
            scripts/validate_lot41_frozen_evidence.py \
            tests/test_lot41_spread_depth_and_imbalance_engine.py \
            tests/test_lot41_validation_contracts.py \
            tests/test_lot41_schema_contracts.py \
            docs/LOT_41_SPREAD_DEPTH_AND_IMBALANCE_ENGINE.md \
            docs/ACCEPTANCE_CRITERIA_LOT_41.md \
            reports/lot_41_spread_depth_and_imbalance_engine_report.md \
            data/audit/book_feature_state_lot41.json \
            data/audit/spread_depth_and_imbalance_engine_audit_lot41.json \
            data/audit/spread_depth_and_imbalance_engine_lot41.json \
            reports/lot41/coverage_summary.json \
            reports/lot41/mutation_summary.json
      - name: Replay exact Lot 41 post-merge certification
        run: |
          set -euo pipefail
          rm -rf /tmp/lot41-post-merge-certified
          git worktree add --detach /tmp/lot41-post-merge-certified "$LOT41_AUDIT_MERGE"
          (
            cd /tmp/lot41-post-merge-certified
            PYTHONPATH=src python scripts/validate_lot41_frozen_evidence.py
            PYTHONPATH=src python scripts/validate_lot41.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            PYTHONPATH=src python scripts/validate_lot41_no_connectivity.py
            PYTHONPATH=src python scripts/validate_lot41_post_merge.py | tee /tmp/lot41-post-merge-validation.json
          )
          git worktree remove --force /tmp/lot41-post-merge-certified
      - name: Historical Lot 41 audit smoke and security
        run: |
          set -euo pipefail
          rm -rf /tmp/lot41-post-merge-smoke
          git worktree add --detach /tmp/lot41-post-merge-smoke "$LOT41_AUDIT_MERGE"
          (
            cd /tmp/lot41-post-merge-smoke
            PYTHONPATH=src python -m compileall -q src scripts tests
            ruff check scripts/validate_lot41_post_merge.py \
              scripts/validate_lot41_frozen_evidence.py
            PYTHONPATH=src pytest -q tests/test_lot41*.py
            bandit -q -r scripts/validate_lot41_post_merge.py \
              scripts/validate_lot41_frozen_evidence.py -ll
          )
          git worktree remove --force /tmp/lot41-post-merge-smoke
      - name: Current architecture and downstream safety remain valid
        run: |
          set -euo pipefail
          python scripts/validate_domain_architecture.py
          python scripts/validate_roadmap_documentation.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          pip-audit -r requirements-dev.lock
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py
          test ! -e config/microstructure/trades_and_aggressor_classification_schema_v1.json
          test ! -e scripts/run_lot44_trades_and_aggressor_classification_schema.py
          test ! -e scripts/validate_lot44.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot41-post-merge-audit-evidence
          path: /tmp/lot41-post-merge-validation.json
