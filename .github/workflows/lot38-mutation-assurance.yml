name: Lot 38 mutation assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine*.py'
      - 'config/microstructure/order_book_l2_snapshot_engine_v1.json'
      - 'contracts/schemas/order_book_snapshot_raw_v1.schema.json'
      - 'contracts/schemas/order_book_snapshot_v1.schema.json'
      - 'contracts/schemas/book_health_state_v1.schema.json'
      - 'contracts/schemas/order_book_l2_snapshot_engine_state_v1.schema.json'
      - 'contracts/schemas/order_book_l2_snapshot_engine_audit_v1.schema.json'
      - 'reports/lot38/mutation_summary.json'
      - 'scripts/validate_lot38_frozen_evidence.py'
      - '.github/workflows/lot38-mutation-assurance.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      SOURCE_HEAD_SHA: b74bea4329d5e5cb7cf2452058b684ea5a5df13c
      EVIDENCE_HEAD_SHA: ef197437d13012644e48a9044cf0883bd17700fb
      MERGED_COMMIT_SHA: e4b44d27886ade86f9d1d05d480b89010b03700d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove frozen Lot 38 mutation source and evidence across squash merge
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git cat-file -e "$EVIDENCE_HEAD_SHA^{commit}"
          git cat-file -e "$MERGED_COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$MERGED_COMMIT_SHA" HEAD

          mutation_source=(
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_models.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_validation.py
            config/microstructure/order_book_l2_snapshot_engine_v1.json
            contracts/schemas/order_book_snapshot_raw_v1.schema.json
            contracts/schemas/order_book_snapshot_v1.schema.json
            contracts/schemas/book_health_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_audit_v1.schema.json
            tests/test_lot38_order_book_l2_snapshot_engine.py
            tests/test_lot38_branch_coverage.py
            tests/test_lot38_mutation_contracts.py
            tests/test_lot38_coverage_completion.py
          )
          git diff --quiet "$SOURCE_HEAD_SHA" "$MERGED_COMMIT_SHA" -- "${mutation_source[@]}"

          immutable_current=(
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_models.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_validation.py
            config/microstructure/order_book_l2_snapshot_engine_v1.json
            contracts/schemas/order_book_snapshot_raw_v1.schema.json
            contracts/schemas/order_book_snapshot_v1.schema.json
            contracts/schemas/book_health_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_audit_v1.schema.json
            tests/test_lot38_order_book_l2_snapshot_engine.py
            tests/test_lot38_branch_coverage.py
            tests/test_lot38_mutation_contracts.py
          )
          git diff --quiet "$MERGED_COMMIT_SHA" HEAD -- "${immutable_current[@]}"
          git diff --quiet "$EVIDENCE_HEAD_SHA" "$MERGED_COMMIT_SHA" -- reports/lot38/mutation_summary.json
          git diff --quiet "$MERGED_COMMIT_SHA" HEAD -- reports/lot38/mutation_summary.json
      - name: Validate exact certified mutation campaign
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_lot38_frozen_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('reports/lot38/mutation_summary.json').read_text())
          expected = {
              'status': 'PASS',
              'source_head_sha': 'b74bea4329d5e5cb7cf2452058b684ea5a5df13c',
              'killed_mutants': 1006,
              'survived_mutants': 226,
              'timeout_mutants': 0,
              'suspicious_mutants': 0,
              'evaluated_mutants': 1232,
              'completed_mutants': 1232,
              'total_mutants': 1232,
              'mutation_score_percent': 81.66,
              'minimum_score_percent': 80.0,
              'max_children': 1,
              'python_hash_seed': '0',
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f'LOT38_FROZEN_MUTATION_EVIDENCE_CHANGED:{key}')
          if payload['mutation_score_percent'] < payload['minimum_score_percent']:
              raise SystemExit('LOT38_MUTATION_SCORE_BELOW_THRESHOLD')
          print('LOT38_FROZEN_MUTATION_ASSURANCE_PASS')
          PY
      - name: Baseline behavior remains compatible
        run: |
          pytest -q \
            tests/test_lot38_order_book_l2_snapshot_engine.py \
            tests/test_lot38_branch_coverage.py \
            tests/test_lot38_mutation_contracts.py \
            tests/test_lot38_coverage_completion.py
          python scripts/validate_lot38_frozen_evidence.py
