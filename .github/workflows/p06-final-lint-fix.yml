name: P0.6 final lint fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p06-final-pre-lot26-assurance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p06-final-pre-lot26-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install canonical Ruff
        run: python -m pip install ruff==0.12.0
      - name: Apply safe Ruff corrections
        run: ruff check --fix scripts/run_p06_final_assurance.py
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Final runner lint already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_p06_final_assurance.py
          git commit -m 'Apply final P0.6 runner lint correction'
          git push origin HEAD:agent/p06-final-pre-lot26-assurance
