name: Lot 28 critical mutation assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/explanations/explanation_core_why_not_trade_v1.json'
      - 'src/crypto_quant_bot/market_analysis/explanation_core*.py'
      - 'tests/lot28_fixtures.py'
      - 'tests/test_lot28_*.py'
      - '.github/workflows/lot28-mutation.yml'
      - 'requirements-dev.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Build isolated Lot 28 mutation workspace
        run: |
          rm -rf .tmp-lot28-mutants reports/lot28/mutation
          mkdir -p .tmp-lot28-mutants/src .tmp-lot28-mutants/config/explanations .tmp-lot28-mutants/data/audit .tmp-lot28-mutants/tests reports/lot28/mutation
          cp -R src/crypto_quant_bot .tmp-lot28-mutants/src/
          printf '%s\n' '"""Minimal package aggregator for isolated Lot 28 mutation tests."""' > .tmp-lot28-mutants/src/crypto_quant_bot/market_analysis/__init__.py
          cp config/explanations/explanation_core_why_not_trade_v1.json .tmp-lot28-mutants/config/explanations/
          cp data/audit/global_market_context_aggregator_lot27.json data/audit/multi_timeframe_alignment_engine_lot26.json .tmp-lot28-mutants/data/audit/
          cp tests/lot28_fixtures.py tests/test_lot28_contracts.py tests/test_lot28_explanation_core_and_why_not_trade_layer.py tests/test_lot28_negative_paths.py tests/test_lot28_validation_helpers.py .tmp-lot28-mutants/tests/
          python - <<'PY'
          from pathlib import Path
          for path in Path('.tmp-lot28-mutants/tests').glob('test_lot28_*.py'):
              text = path.read_text(encoding='utf-8')
              path.write_text(
                  text.replace('from tests.lot28_fixtures import', 'from lot28_fixtures import'),
                  encoding='utf-8',
              )
          PY
          cat > .tmp-lot28-mutants/pyproject.toml <<'TOML'
          [project]
          name = "crypto-quant-bot"
          version = "0.28.0.dev0"
          requires-python = "==3.11.*"
          dependencies = []

          [tool.pytest.ini_options]
          pythonpath = ["src", "tests"]
          addopts = ["--tb=short", "-p", "no:cacheprovider"]

          [tool.mutmut]
          paths_to_mutate = [
            "src/crypto_quant_bot/market_analysis/explanation_core_and_why_not_trade_layer.py",
            "src/crypto_quant_bot/market_analysis/explanation_core_validation.py",
          ]
          tests_dir = ["tests/"]
          runner = "python -m pytest -q tests/test_lot28_contracts.py tests/test_lot28_explanation_core_and_why_not_trade_layer.py tests/test_lot28_negative_paths.py tests/test_lot28_validation_helpers.py"
          also_copy = [
            "src/crypto_quant_bot/__init__.py",
            "src/crypto_quant_bot/contracts/",
            "src/crypto_quant_bot/market_analysis/__init__.py",
            "src/crypto_quant_bot/market_analysis/alignment_io.py",
            "src/crypto_quant_bot/market_analysis/explanation_core_and_why_not_trade_layer_models.py",
            "config/",
            "data/",
          ]
          mutate_only_covered_lines = true
          timeout_factor = 8.0
          TOML
      - name: Run mutation suite
        shell: bash
        run: |
          set -o pipefail
          cd .tmp-lot28-mutants
          mutmut run 2>&1 | tee ../reports/lot28/mutation/run.txt
          mutmut results 2>&1 | tee ../reports/lot28/mutation/results.txt || true
      - name: Enforce mutation score
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('reports/lot28/mutation/run.txt')
          if not path.is_file():
              raise SystemExit('LOT28_MUTATION_RUN_LOG_MISSING')
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text).replace('\r', '\n')
          pattern = re.compile(
              r'(\d+)/(\d+).*?🎉\s*(\d+).*?⏰\s*(\d+).*?🤔\s*(\d+).*?🙁\s*(\d+)'
          )
          matches = pattern.findall(text)
          if not matches:
              raise SystemExit('LOT28_MUTATION_SCORE_PARSE_ERROR')
          completed, total, killed, timeout, suspicious, survived = map(int, matches[-1])
          evaluated = killed + timeout + suspicious + survived
          if completed != total or evaluated != total or total <= 0:
              raise SystemExit(
                  f'LOT28_MUTATION_INCOMPLETE completed={completed} total={total} evaluated={evaluated}'
              )
          score = 100.0 * (killed + timeout) / evaluated
          payload = {
              'schema_version': 'lot28-critical-mutation-score-v1',
              'scope': 'explanation_core_why_not_trade',
              'killed': killed,
              'timeout': timeout,
              'survived': survived,
              'suspicious': suspicious,
              'evaluated': evaluated,
              'score_percent': round(score, 2),
              'minimum_score_percent': 80.0,
              'status': 'PASS' if score >= 80.0 else 'FAIL',
          }
          output = Path('reports/lot28/mutation/score.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          if score < 80.0:
              raise SystemExit('LOT28_MUTATION_BELOW_80_PERCENT')
          PY
      - name: Verify canonical source immutability
        run: |
          rm -rf .tmp-lot28-mutants
          git diff --exit-code -- src/crypto_quant_bot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot28-critical-mutation-evidence
          path: reports/lot28/mutation/
