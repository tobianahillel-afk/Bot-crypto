name: P0.6 Ruff cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p06-final-pre-lot26-assurance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p06-final-pre-lot26-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Apply cleanup
        run: python scripts/patch_p06_ruff_cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Ruff cleanup already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crypto_quant_bot/release/candidate.py tests/test_p06_*.py
          git commit -m 'Apply P0.6 Ruff cleanup'
          git push origin HEAD:agent/p06-final-pre-lot26-assurance
