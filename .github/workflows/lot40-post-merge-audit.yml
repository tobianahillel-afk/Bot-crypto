name: Lot 40 independent post-merge audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot40-post-merge-audit.yml'
      - 'src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector*.py'
      - 'config/microstructure/book_integrity_desynchronization_detector_v1.json'
      - 'contracts/schemas/book_integrity*.schema.json'
      - 'contracts/schemas/book_health_veto_v1.schema.json'
      - 'scripts/*lot40*'
      - 'tests/test_lot40*.py'
      - 'docs/*LOT_40*'
      - 'data/audit/*lot40.json'
      - 'reports/lot40/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    env:
      LOT40_AUDIT_MERGE: 20975b505c7f8b527751fb5d3bce034c6e55dcc2
      LOT40_SOURCE_HEAD: b9a18a8aaef858b985c3f75ef2aa8955ec521e9f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove historical audit ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$LOT40_AUDIT_MERGE" HEAD
      - name: Replay exact Lot 40 post-merge certification
        run: |
          set -euo pipefail
          rm -rf /tmp/lot40-post-merge-certified
          git worktree add --detach /tmp/lot40-post-merge-certified "$LOT40_AUDIT_MERGE"
          (
            cd /tmp/lot40-post-merge-certified
            PYTHONPATH=src python scripts/validate_lot40_frozen_evidence.py
            PYTHONPATH=src python scripts/validate_lot40_post_merge.py
            PYTHONPATH=src python scripts/validate_lot40.py \
              --expected-code-commit "$LOT40_SOURCE_HEAD" --require-persisted
            PYTHONPATH=src python scripts/validate_lot40_no_connectivity.py
          )
          git worktree remove --force /tmp/lot40-post-merge-certified
      - name: Historical Lot 40 audit smoke and security
        run: |
          set -euo pipefail
          rm -rf /tmp/lot40-post-merge-smoke
          git worktree add --detach /tmp/lot40-post-merge-smoke "$LOT40_AUDIT_MERGE"
          (
            cd /tmp/lot40-post-merge-smoke
            PYTHONPATH=src python -m compileall -q src scripts tests
            ruff check scripts/validate_lot40_post_merge.py \
              scripts/validate_lot40_frozen_evidence.py
            PYTHONPATH=src pytest -q tests/test_lot40*.py
            bandit -q -r scripts/validate_lot40_post_merge.py \
              scripts/validate_lot40_frozen_evidence.py -ll
          )
          git worktree remove --force /tmp/lot40-post-merge-smoke
      - name: Current architecture and downstream safety remain valid
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/validate_domain_architecture.py
          python scripts/validate_roadmap_documentation.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py
          test ! -e config/microstructure/trades_and_aggressor_classification_schema_v1.json
          test ! -e scripts/run_lot44_trades_and_aggressor_classification_schema.py
          test ! -e scripts/validate_lot44.py
