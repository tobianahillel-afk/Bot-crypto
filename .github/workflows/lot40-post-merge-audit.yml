name: Lot 40 independent post-merge audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      SOURCE_HEAD_SHA: b9a18a8aaef858b985c3f75ef2aa8955ec521e9f
      EVIDENCE_HEAD_SHA: ea04fe826261eeed5a59eea60265b38b68404b6b
      FINAL_PR_HEAD_SHA: 1268772c07cbb76c18b3267aef12dad5ba58af31
      MERGED_COMMIT: 88f0dac660e262a1c468d9cd75c5e7996ce4817b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove post-merge ancestry, historical lock and Lot 40 immutability
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 91df3e378336a791a731cb1561382ba28e6e0978 "$SOURCE_HEAD_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" "$EVIDENCE_HEAD_SHA"
          git merge-base --is-ancestor "$EVIDENCE_HEAD_SHA" "$FINAL_PR_HEAD_SHA"
          git merge-base --is-ancestor "$MERGED_COMMIT" HEAD
          for path in \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_models.py \
            scripts/run_lot41_spread_depth_and_imbalance_engine.py \
            scripts/validate_lot41.py; do
            if git cat-file -e "$MERGED_COMMIT:$path" 2>/dev/null; then
              echo "Lot 41 existed at Lot 40 certification: $path" >&2
              exit 1
            fi
          done
          git diff --quiet "$MERGED_COMMIT" HEAD -- \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_models.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_validation.py \
            config/microstructure/book_integrity_desynchronization_detector_v1.json \
            contracts/schemas/book_integrity_state_v1.schema.json \
            contracts/schemas/book_health_veto_v1.schema.json \
            contracts/schemas/book_integrity_desynchronization_detector_state_v1.schema.json \
            contracts/schemas/book_integrity_desynchronization_detector_audit_v1.schema.json \
            scripts/run_lot40_book_integrity_desynchronization_detector.py \
            scripts/validate_lot40.py \
            scripts/validate_lot40_no_connectivity.py \
            tests/test_lot40_health_policy_derivation.py \
            tests/test_lot40_schema_contracts.py \
            tests/test_lot40_strict_level_contracts.py \
            tests/test_lot40_v4_entry_gate.py \
            tests/test_lot40_validation_contracts.py \
            docs/LOT_40_BOOK_INTEGRITY_DESYNCHRONIZATION_DETECTOR.md \
            docs/ACCEPTANCE_CRITERIA_LOT_40.md \
            data/audit/book_integrity_desynchronization_detector_lot40.json \
            data/audit/book_integrity_desynchronization_detector_audit_lot40.json \
            data/audit/book_integrity_state_lot40.json \
            data/audit/book_health_veto_lot40.json \
            reports/lot40/coverage_summary.json \
            reports/lot40/mutation_summary.json
      - name: Compile lint type and exact post-merge validators
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m json.tool data/audit/roadmap_lifecycle_overlay_lot40.json >/dev/null
          ruff check scripts/validate_lot40_post_merge.py \
            scripts/validate_lot40_frozen_evidence.py \
            tests/test_lot40_book_integrity_desynchronization_detector.py
          mypy src/crypto_quant_bot
          python scripts/validate_lot40_frozen_evidence.py
          python scripts/validate_lot40_post_merge.py
          rm -rf /tmp/lot40-certified
          git worktree add --detach /tmp/lot40-certified "$MERGED_COMMIT"
          (
            cd /tmp/lot40-certified
            PYTHONPATH=src python scripts/validate_lot40.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            PYTHONPATH=src python scripts/validate_lot40_no_connectivity.py
          )
          git worktree remove --force /tmp/lot40-certified
      - name: Architecture roadmap traceability and engineering gates
        run: |
          python scripts/validate_domain_architecture.py
          python scripts/validate_roadmap_documentation.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Full regression security dependency and anti-flake
        run: |
          pytest -q
          bandit -q -r \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_models.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_validation.py \
            scripts/validate_lot40_post_merge.py \
            scripts/validate_lot40_frozen_evidence.py -ll
          pip-audit -r requirements-dev.lock
          for repetition in 1 2 3; do pytest -q tests/test_lot40*.py; done
          python scripts/validate_lot40_post_merge.py
      - name: Prove Lot 42 remains locked
        run: |
          set -euo pipefail
          test ! -e src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine.py
          test ! -e scripts/run_lot42_liquidity_zones_walls_and_voids_engine.py
          test ! -e scripts/validate_lot42.py
