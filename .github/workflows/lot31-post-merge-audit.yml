name: Lot 31 post-merge audit exact-head

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'pyproject.toml'
      - 'data/audit/roadmap_lifecycle_overlay_lot31.json'
      - 'docs/LOT_31_POST_MERGE_AUDIT.md'
      - 'docs/LOT31_POST_MERGE_VALIDATION_MATRIX.md'
      - 'docs/ROADMAP_V1_TO_V21.md'
      - 'scripts/validate_roadmap_documentation.py'
      - 'tests/test_lot30_post_merge_state.py'
      - 'tests/test_lot31_post_merge_state.py'
      - '.github/workflows/lot31-post-merge-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Verify audit-only production boundary
        shell: bash
        run: |
          git fetch origin main
          AUDIT_PATHS=(
            data/audit/roadmap_lifecycle_overlay_lot31.json
            docs/LOT_31_POST_MERGE_AUDIT.md
            docs/LOT31_POST_MERGE_VALIDATION_MATRIX.md
          )
          if ! git diff --quiet origin/main...HEAD -- "${AUDIT_PATHS[@]}"; then
            if ! git diff --quiet origin/main...HEAD -- src/; then
              echo 'Production source changed together with immutable Lot 31 audit artifacts'
              git diff --stat origin/main...HEAD -- src/ "${AUDIT_PATHS[@]}"
              exit 1
            fi
          fi
      - name: Compile lint and type checks
        run: |
          python -m compileall -q src scripts tests
          ruff check \
            scripts/validate_roadmap_documentation.py \
            tests/test_lot30_post_merge_state.py \
            tests/test_lot31_post_merge_state.py
          mypy src/crypto_quant_bot
      - name: Validate lifecycle roadmap and Lot 31 evidence
        run: |
          python -m json.tool data/audit/roadmap_lifecycle_overlay_lot31.json >/dev/null
          python scripts/validate_lot30.py
          python scripts/validate_lot31_entry_gate.py
          python scripts/validate_lot31.py
          python scripts/validate_lot31_no_connectivity.py
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Post-merge assertions and full regression
        run: |
          pytest -q tests/test_lot30_post_merge_state.py tests/test_lot31_post_merge_state.py
          pytest -q
      - name: Audit anti-flake repetitions
        run: |
          pytest -q tests/test_lot30_post_merge_state.py tests/test_lot31_post_merge_state.py
          pytest -q tests/test_lot30_post_merge_state.py tests/test_lot31_post_merge_state.py
          pytest -q tests/test_lot30_post_merge_state.py tests/test_lot31_post_merge_state.py
      - name: Security and dependency checks
        run: |
          bandit -q -r src -ll
          pip-audit -r requirements-dev.lock
