name: Documentation Tooling Benchmark

on:
  push:
    branches:
      - engineering/bootstrap-development-engine
    paths:
      - "config/governance/documentation_tooling_lychee_benchmark_v1.json"
      - "scripts/governance/benchmark_lychee.py"
      - ".github/workflows/documentation-tooling-benchmark.yml"
      - "engineering/DOCUMENTATION_TOOLING_BENCHMARK.md"
      - "engineering/work_units/ENG-05.6-WU05.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-tooling-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee v0.24.2 offline benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LYCHEE_ASSET_URL: "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz"
      LYCHEE_ASSET_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
      LYCHEE_EXPECTED_VERSION: "0.24.2"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate lychee benchmark policy
        run: python3 scripts/governance/benchmark_lychee.py --self-check

      - name: Download and verify exact lychee release
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lychee.tar.gz"
          bindir="${RUNNER_TEMP}/lychee-bin"
          mkdir -p "${bindir}"
          curl --fail --location --silent --show-error             --proto '=https' --tlsv1.2             "${LYCHEE_ASSET_URL}"             --output "${archive}"
          printf '%s  %s\n' "${LYCHEE_ASSET_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${bindir}"
          lychee_bin="${bindir}/lychee-x86_64-unknown-linux-gnu/lychee"
          test -x "${lychee_bin}"
          version="$("${lychee_bin}" --version)"
          printf '%s\n' "${version}" | grep -F "${LYCHEE_EXPECTED_VERSION}" >/dev/null
          printf 'LYCHEE_BIN=%s\n' "${lychee_bin}" >> "${GITHUB_ENV}"

      - name: Run offline local-link benchmark
        shell: bash
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          python3 scripts/governance/benchmark_lychee.py             --lychee-bin "${LYCHEE_BIN}"             --output "${RUNNER_TEMP}/lychee-benchmark.json"
          python3 - "${RUNNER_TEMP}/lychee-benchmark.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(
              "LYCHEE_BENCHMARK_SUMMARY "
              f"broken_errors={data['synthetic_broken']['errors']} "
              f"valid_errors={data['synthetic_valid']['errors']} "
              f"representative_errors={data['representative']['errors']} "
              f"lychee_ms={data['total_lychee_elapsed_ms']} "
              f"docs={len(data['representative']['documents'])}"
          )
          PY
