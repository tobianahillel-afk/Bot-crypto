name: Lot 37 V4 implementation entry gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/audit/lot37_v4_entry_gate.json'
      - 'contracts/schemas/lot37_v4_entry_gate_v1.schema.json'
      - 'docs/LOT_37_V4_ENTRY_GATE.md'
      - 'reports/lot_37_v4_entry_gate_report.md'
      - 'scripts/validate_lot37_entry_gate.py'
      - 'tests/test_lot37_v4_entry_gate.py'
      - 'tests/fixtures/lot37/**'
      - '.github/workflows/lot37-entry-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Verify exact audited V3 base and gate-only boundary
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=33fba0abf7463fc54a36282476ee51655ff09919
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$PR_BASE_SHA" = "$EXPECTED_BASE"
            git diff --quiet "$PR_BASE_SHA"...HEAD -- src/
          fi
      - name: Compile lint schema fixture and gate validation
        run: |
          python -m compileall -q scripts tests
          python -m json.tool data/audit/lot37_v4_entry_gate.json >/dev/null
          python -m json.tool contracts/schemas/lot37_v4_entry_gate_v1.schema.json >/dev/null
          python -m json.tool tests/fixtures/lot37/offline_l2_availability_fixture_v1.json >/dev/null
          python -m json.tool tests/fixtures/lot37/offline_trade_availability_fixture_v1.json >/dev/null
          ruff check scripts/validate_lot37_entry_gate.py tests/test_lot37_v4_entry_gate.py
          python scripts/validate_lot36_post_merge.py
          python scripts/validate_lot37_entry_gate.py
      - name: Architecture roadmap traceability and engineering gates
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Gate tests and full regression
        run: |
          pytest -q tests/test_lot37_v4_entry_gate.py
          pytest -q
      - name: Gate anti-flake repetitions
        run: |
          pytest -q tests/test_lot37_v4_entry_gate.py
          pytest -q tests/test_lot37_v4_entry_gate.py
          pytest -q tests/test_lot37_v4_entry_gate.py
      - name: Security and dependency checks
        run: |
          bandit -q -r scripts/validate_lot37_entry_gate.py -ll
          pip-audit -r requirements-dev.lock
