name: Lot 29 mutation oracle cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix_lot29_mutation_oracle_import.py'
      - '.github/workflows/lot29-oracle-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/lot29-v2-deterministic-replay-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot29-v2-deterministic-replay-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Apply and validate exact cleanup
        run: |
          python scripts/fix_lot29_mutation_oracle_import.py
          ruff check tests/test_lot29_mutation_oracles.py
          pytest -q tests/test_lot29_*.py
      - name: Commit non-workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "Clean Lot 29 mutation oracle imports"
          git push origin HEAD:agent/lot29-v2-deterministic-replay-audit
