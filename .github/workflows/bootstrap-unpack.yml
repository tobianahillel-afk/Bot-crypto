name: Bootstrap unpack repository archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-unpack.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive into repository root
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(find . -maxdepth 1 -type f -iname '*.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP archive at repository root, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]:-}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          workdir="$(mktemp -d)"
          unzip -q "$archive" -d "$workdir/unpacked"

          rm -rf "$workdir/unpacked/__MACOSX"
          find "$workdir/unpacked" -name '.DS_Store' -delete

          mapfile -t entries < <(find "$workdir/unpacked" -mindepth 1 -maxdepth 1 -print | sort)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            payload_root="${entries[0]}"
          else
            payload_root="$workdir/unpacked"
          fi

          rm -rf "$payload_root/.git"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$payload_root"/. .

          find . -name '__MACOSX' -type d -prune -exec rm -rf {} +
          find . -name '.DS_Store' -delete
          find . -mindepth 2 -type d -name '.git' -prune -exec rm -rf {} +

          git status --short

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
            exit 0
          fi
          git commit -m 'Extract project archive to repository root'
          git push origin HEAD:main
