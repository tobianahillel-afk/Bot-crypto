name: Lot 40 book integrity desynchronization validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot40:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      GATE_MERGE_SHA: 91df3e378336a791a731cb1561382ba28e6e0978
      SOURCE_HEAD_SHA: b9a18a8aaef858b985c3f75ef2aa8955ec521e9f
      MERGED_COMMIT_SHA: 88f0dac660e262a1c468d9cd75c5e7996ce4817b
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove Lot 40 ancestry and downstream Lot 42 lock
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GATE_MERGE_SHA" "$MERGED_COMMIT_SHA"
          git merge-base --is-ancestor "$MERGED_COMMIT_SHA" HEAD
          test ! -e src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine.py
          test ! -e src/crypto_quant_bot/microstructure/liquidity_zones_walls_and_voids_engine_models.py
          test ! -e scripts/run_lot42_liquidity_zones_walls_and_voids_engine.py
          test ! -e scripts/validate_lot42.py
      - name: Compile lint type schema and no-connectivity checks
        run: |
          set -euo pipefail
          mkdir -p reports/lot40
          python -m compileall -q src scripts tests
          for path in \
            config/microstructure/book_integrity_desynchronization_detector_v1.json \
            contracts/schemas/book_integrity_state_v1.schema.json \
            contracts/schemas/book_health_veto_v1.schema.json \
            contracts/schemas/book_integrity_desynchronization_detector_state_v1.schema.json \
            contracts/schemas/book_integrity_desynchronization_detector_audit_v1.schema.json; do
            python -m json.tool "$path" >/dev/null
          done
          ruff check \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_models.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_validation.py \
            src/crypto_quant_bot/microstructure/__init__.py \
            scripts/run_lot40_book_integrity_desynchronization_detector.py \
            scripts/validate_lot40.py scripts/validate_lot40_no_connectivity.py \
            tests/test_lot40*.py
          mypy src/crypto_quant_bot/microstructure
          python scripts/validate_lot40_no_connectivity.py
      - name: Targeted line and branch coverage
        run: |
          coverage erase
          pytest -q tests/test_lot40*.py \
            --cov=crypto_quant_bot.microstructure.book_integrity_desynchronization_detector \
            --cov=crypto_quant_bot.microstructure.book_integrity_desynchronization_detector_models \
            --cov=crypto_quant_bot.microstructure.book_integrity_desynchronization_detector_validation \
            --cov-branch --cov-report=json:reports/lot40/coverage.json --cov-report=term-missing
          python - <<'PY'
          import json, os
          from pathlib import Path
          totals=json.loads(Path('reports/lot40/coverage.json').read_text())['totals']
          lines=float(totals['percent_statements_covered'])
          branches=float(totals['percent_branches_covered'])
          result={
              'schema_version':'lot40-coverage-summary-v1',
              'status':'PASS' if lines>=95 and branches>=90 else 'FAIL',
              'source_head_sha':os.environ['CANDIDATE_SHA'],
              'line_coverage_percent':round(lines,2),
              'branch_coverage_percent':round(branches,2),
              'line_coverage_min_percent':95.0,
              'branch_coverage_min_percent':90.0,
              'anti_flake_repetitions':3,
          }
          Path('reports/lot40/coverage_summary.json').write_text(
              json.dumps(result,indent=2,sort_keys=True)+'\n', encoding='utf-8'
          )
          print(json.dumps(result,sort_keys=True))
          if result['status']!='PASS':
              raise SystemExit('LOT40_CRITICAL_COVERAGE_BELOW_THRESHOLD')
          PY
      - name: Replay certified generate validate and deterministic evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/lot40-certified /tmp/lot40-run1
          git worktree add --detach /tmp/lot40-certified "$MERGED_COMMIT_SHA"
          mkdir -p /tmp/lot40-run1
          (
            cd /tmp/lot40-certified
            outputs=(
              data/audit/book_integrity_desynchronization_detector_lot40.json
              data/audit/book_integrity_desynchronization_detector_audit_lot40.json
              data/audit/book_integrity_state_lot40.json
              data/audit/book_health_veto_lot40.json
            )
            PYTHONPATH=src python scripts/run_lot40_book_integrity_desynchronization_detector.py \
              --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot40.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            PYTHONPATH=src python scripts/validate_lot40_no_connectivity.py
            for path in "${outputs[@]}"; do
              cp "$path" "/tmp/lot40-run1/$(basename "$path")"
            done
            PYTHONPATH=src python scripts/run_lot40_book_integrity_desynchronization_detector.py \
              --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot40.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            for path in "${outputs[@]}"; do
              cmp "/tmp/lot40-run1/$(basename "$path")" "$path"
            done
          )
          git worktree remove --force /tmp/lot40-certified
      - name: Architecture roadmap traceability engineering and safety
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          python scripts/validate_lot40_no_connectivity.py
      - name: Security dependency regression and anti-flake
        run: |
          bandit -q -r \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_models.py \
            src/crypto_quant_bot/microstructure/book_integrity_desynchronization_detector_validation.py \
            scripts/validate_lot40.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do pytest -q tests/test_lot40*.py; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot40-book-integrity-evidence
          path: |
            reports/lot40/
            data/audit/book_integrity_desynchronization_detector_lot40.json
            data/audit/book_integrity_desynchronization_detector_audit_lot40.json
            data/audit/book_integrity_state_lot40.json
            data/audit/book_health_veto_lot40.json
