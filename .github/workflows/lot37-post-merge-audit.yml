name: Lot 37 independent post-merge audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/LOT_37_POST_MERGE_AUDIT.md'
      - 'docs/LOT37_POST_MERGE_VALIDATION_MATRIX.md'
      - 'data/audit/roadmap_lifecycle_overlay_lot37.json'
      - 'data/audit/microstructure_scope_and_offline_data_contracts_lot37.json'
      - 'data/audit/microstructure_scope_and_offline_data_contracts_audit_lot37.json'
      - 'data/audit/microstructure_contract_registry_lot37.json'
      - 'data/audit/microstructure_capability_matrix_lot37.json'
      - 'reports/lot37/coverage_summary.json'
      - 'reports/lot37/mutation_summary.json'
      - 'scripts/validate_lot37.py'
      - 'scripts/validate_lot37_frozen_evidence.py'
      - '.github/workflows/lot37-post-merge-audit.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove historical merge and evidence ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f1da136ff956e40915fab42ae21748a6f2b1ebca HEAD
          git merge-base --is-ancestor c7ff8eecafd5f34196e9383013e97548b1a0ba02 HEAD
          git cat-file -e 59b189e9980772245993a9212b6c8ad5e9a88a00^{commit}
          git cat-file -e 91c28f17acc2f66c906dddee96cbda369945f3ea^{commit}
      - name: Compile lint type and immutable Lot 37 evidence
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src scripts tests
          ruff check scripts/validate_lot37.py scripts/validate_lot37_frozen_evidence.py
          mypy src/crypto_quant_bot
          python scripts/validate_lot37_frozen_evidence.py
          python scripts/validate_lot37.py --expected-code-commit 59b189e9980772245993a9212b6c8ad5e9a88a00
      - name: Architecture roadmap traceability and engineering
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Full regression and archived evidence check
        env:
          PYTHONPATH: src
        run: |
          pytest -q
          python scripts/validate_lot37_frozen_evidence.py
      - name: Security and immutable evidence final checks
        env:
          PYTHONPATH: src
        run: |
          bandit -q -r src -ll
          pip-audit -r requirements-dev.lock
          python scripts/validate_lot37_frozen_evidence.py
