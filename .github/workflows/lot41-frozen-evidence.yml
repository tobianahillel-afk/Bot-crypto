name: Lot 41 frozen evidence attestation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot41-frozen-evidence.yml'
      - 'src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine*.py'
      - 'config/microstructure/spread_depth_and_imbalance_engine_v1.json'
      - 'contracts/schemas/book_feature_state_v1.schema.json'
      - 'contracts/schemas/spread_depth_imbalance*.schema.json'
      - 'scripts/*lot41*'
      - 'tests/test_lot41*.py'
      - 'docs/*LOT_41*'
      - 'data/audit/*lot41.json'
      - 'reports/lot41/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      GATE_MERGE_SHA: 75822f8ea7c6f67f73649d2f43be6efba840ab67
      SOURCE_HEAD_SHA: 14c0d8da1b02d076b3c43a07a34ac96c673018b0
      EVIDENCE_HEAD_SHA: 7ada0ca6c4d439505ef453b988dedd4aa96c1a32
      FINAL_PR_HEAD_SHA: 89ae244db77f16f31d226a7494d78b65b904dcd9
      MERGED_COMMIT_SHA: a253ce35c97303e8b8c65707c07597e996b3a832
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove certified chain squash equivalence and exact five-file evidence set
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/51/head:refs/remotes/origin/lot41-pr51-head
          git merge-base --is-ancestor "$GATE_MERGE_SHA" "$SOURCE_HEAD_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" "$EVIDENCE_HEAD_SHA"
          git merge-base --is-ancestor "$EVIDENCE_HEAD_SHA" "$FINAL_PR_HEAD_SHA"
          git merge-base --is-ancestor "$MERGED_COMMIT_SHA" HEAD
          git diff --quiet "$FINAL_PR_HEAD_SHA" "$MERGED_COMMIT_SHA" -- .
          git diff --name-only "$SOURCE_HEAD_SHA" "$EVIDENCE_HEAD_SHA" | sort > /tmp/lot41-evidence.txt
          cat > /tmp/lot41-expected.txt <<'EOF'
          data/audit/book_feature_state_lot41.json
          data/audit/spread_depth_and_imbalance_engine_audit_lot41.json
          data/audit/spread_depth_and_imbalance_engine_lot41.json
          reports/lot41/coverage_summary.json
          reports/lot41/mutation_summary.json
          EOF
          sort -o /tmp/lot41-expected.txt /tmp/lot41-expected.txt
          diff -u /tmp/lot41-expected.txt /tmp/lot41-evidence.txt
      - name: Prove frozen Lot 41 production immutability
        run: |
          set -euo pipefail
          git diff --quiet "$SOURCE_HEAD_SHA" HEAD -- \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_models.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_validation.py \
            config/microstructure/spread_depth_and_imbalance_engine_v1.json \
            contracts/schemas/book_feature_state_v1.schema.json \
            contracts/schemas/spread_depth_imbalance_engine_state_v1.schema.json \
            contracts/schemas/spread_depth_imbalance_engine_audit_v1.schema.json \
            scripts/run_lot41_spread_depth_and_imbalance_engine.py \
            scripts/validate_lot41.py \
            scripts/validate_lot41_no_connectivity.py \
            tests/test_lot41_spread_depth_and_imbalance_engine.py \
            tests/test_lot41_validation_contracts.py \
            tests/test_lot41_schema_contracts.py \
            docs/LOT_41_SPREAD_DEPTH_AND_IMBALANCE_ENGINE.md \
            docs/ACCEPTANCE_CRITERIA_LOT_41.md
      - name: Prove frozen evidence immutability
        run: |
          set -euo pipefail
          git diff --quiet "$EVIDENCE_HEAD_SHA" HEAD -- \
            data/audit/book_feature_state_lot41.json \
            data/audit/spread_depth_and_imbalance_engine_audit_lot41.json \
            data/audit/spread_depth_and_imbalance_engine_lot41.json \
            reports/lot41/coverage_summary.json \
            reports/lot41/mutation_summary.json
      - name: Replay exact frozen evidence and deterministic implementation
        run: |
          set -euo pipefail
          rm -rf /tmp/lot41-frozen-certified
          git worktree add --detach /tmp/lot41-frozen-certified "$FINAL_PR_HEAD_SHA"
          (
            cd /tmp/lot41-frozen-certified
            PYTHONPATH=src python -m compileall -q src scripts tests
            ruff check scripts/validate_lot41_frozen_evidence.py
            PYTHONPATH=src python scripts/validate_lot41_frozen_evidence.py | tee /tmp/lot41-frozen-validation.json
            PYTHONPATH=src python scripts/validate_lot41.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            PYTHONPATH=src python scripts/validate_lot41_no_connectivity.py
            PYTHONPATH=src pytest -q tests/test_lot41*.py
            for repetition in 1 2 3; do PYTHONPATH=src pytest -q tests/test_lot41*.py; done
            bandit -q -r scripts/validate_lot41_frozen_evidence.py -ll
          )
          git worktree remove --force /tmp/lot41-frozen-certified
      - name: Current architecture and downstream safety remain valid
        run: |
          set -euo pipefail
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          pip-audit -r requirements-dev.lock
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py
          test ! -e config/microstructure/trades_and_aggressor_classification_schema_v1.json
          test ! -e scripts/run_lot44_trades_and_aggressor_classification_schema.py
          test ! -e scripts/validate_lot44.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot41-frozen-evidence-attestation
          path: /tmp/lot41-frozen-validation.json
