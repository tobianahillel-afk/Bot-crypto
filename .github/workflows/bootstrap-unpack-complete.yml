name: Restore complete archive contents

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-unpack-complete.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore every file from original archive
        shell: bash
        run: |
          set -euo pipefail

          source_commit='f13a571eaaa5f0526bfcf4da00f046ef7a65b5af'
          source_path='crypto_quant_bot (2).zip'
          workdir="$(mktemp -d)"

          git show "${source_commit}:${source_path}" > "$workdir/archive.zip"
          unzip -q "$workdir/archive.zip" -d "$workdir/unpacked"

          rm -rf "$workdir/unpacked/__MACOSX"
          find "$workdir/unpacked" -name '.DS_Store' -delete

          mapfile -t entries < <(find "$workdir/unpacked" -mindepth 1 -maxdepth 1 -print | sort)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            payload_root="${entries[0]}"
          else
            payload_root="$workdir/unpacked"
          fi

          rm -rf "$payload_root/.git"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$payload_root"/. .

          find . -name '__MACOSX' -type d -prune -exec rm -rf {} +
          find . -name '.DS_Store' -delete
          find . -mindepth 2 -type d -name '.git' -prune -exec rm -rf {} +

          git status --short --ignored

      - name: Commit complete archive tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -A
          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
            exit 0
          fi
          git commit -m 'Restore complete project archive at repository root'
          git push origin HEAD:main
