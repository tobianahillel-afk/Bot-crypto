name: Lot 43 V4 implementation entry gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot43-entry-gate.yml'
      - 'contracts/schemas/lot43_v4_entry_gate_v1.schema.json'
      - 'data/audit/lot43_v4_entry_gate.json'
      - 'docs/LOT_43_V4_ENTRY_GATE.md'
      - 'reports/lot_43_v4_entry_gate_report.md'
      - 'scripts/validate_lot43_entry_gate.py'
      - 'tests/test_lot43_v4_entry_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      GATE_FINAL_HEAD_SHA: e7d354b3856be7748dbe2420e33c3874f901f38c
      GATE_MERGE_SHA: ed8845e0e56151348fe57c0e9bceaf4646ea49aa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove certified gate squash and replay historical absence
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GATE_MERGE_SHA" HEAD
          git diff --quiet "$GATE_FINAL_HEAD_SHA" "$GATE_MERGE_SHA"
          rm -rf /tmp/lot43-gate-certified
          git worktree add --detach /tmp/lot43-gate-certified "$GATE_MERGE_SHA"
          trap 'git worktree remove --force /tmp/lot43-gate-certified >/dev/null 2>&1 || true' EXIT
          (
            cd /tmp/lot43-gate-certified
            PYTHONPATH=src python scripts/validate_lot43_entry_gate.py
            PYTHONPATH=src pytest -q tests/test_lot43_v4_entry_gate.py
            test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine.py
            test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_models.py
            test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_validation.py
            test ! -e config/microstructure/book_resilience_and_replenishment_engine_v1.json
            test ! -e scripts/run_lot43_book_resilience_and_replenishment_engine.py
            test ! -e scripts/validate_lot43.py
            test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
            test ! -e scripts/run_lot44_trades_and_aggressor_classification_schema.py
          )
          git worktree remove --force /tmp/lot43-gate-certified
          trap - EXIT
      - name: Validate immutable Lot 43 gate contract
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m json.tool data/audit/lot43_v4_entry_gate.json >/dev/null
          python -m json.tool contracts/schemas/lot43_v4_entry_gate_v1.schema.json >/dev/null
          ruff check scripts/validate_lot43_entry_gate.py tests/test_lot43_v4_entry_gate.py
          pytest -q tests/test_lot43_v4_entry_gate.py
      - name: Architecture roadmap traceability and engineering controls
        run: |
          set -euo pipefail
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Security dependency full regression and anti-flake
        run: |
          set -euo pipefail
          bandit -q -r scripts/validate_lot43_entry_gate.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do pytest -q tests/test_lot43_v4_entry_gate.py; done
