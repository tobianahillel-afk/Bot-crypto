name: Lot 43 V4 implementation entry gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      BASE_COMMIT: 2438622734e597cdcbada6b926e3c05d9e4cf8bc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove exact audited base and governance-only diff
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          git diff --name-only "$BASE_COMMIT" HEAD | sort > /tmp/lot43-gate-diff.txt
          cat > /tmp/lot43-gate-expected.txt <<'EOF'
          .github/workflows/lot43-entry-gate.yml
          contracts/schemas/lot43_v4_entry_gate_v1.schema.json
          data/audit/lot43_v4_entry_gate.json
          docs/LOT_43_V4_ENTRY_GATE.md
          reports/lot_43_v4_entry_gate_report.md
          scripts/validate_lot43_entry_gate.py
          tests/test_lot43_v4_entry_gate.py
          EOF
          sort -o /tmp/lot43-gate-expected.txt /tmp/lot43-gate-expected.txt
          diff -u /tmp/lot43-gate-expected.txt /tmp/lot43-gate-diff.txt
      - name: Prove Lot 43 and Lot 44 implementation remain absent
        run: |
          set -euo pipefail
          test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine.py
          test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_models.py
          test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_validation.py
          test ! -e config/microstructure/book_resilience_and_replenishment_engine_v1.json
          test ! -e contracts/schemas/book_resilience_and_replenishment_engine_state_v1.schema.json
          test ! -e contracts/schemas/book_resilience_and_replenishment_engine_audit_v1.schema.json
          test ! -e contracts/schemas/book_resilience_state_v1.schema.json
          test ! -e scripts/run_lot43_book_resilience_and_replenishment_engine.py
          test ! -e scripts/validate_lot43.py
          test ! -e scripts/validate_lot43_no_connectivity.py
          test ! -e tests/test_lot43_book_resilience_and_replenishment_engine.py
          test ! -e data/audit/book_resilience_and_replenishment_engine_lot43.json
          test ! -e data/audit/book_resilience_and_replenishment_engine_audit_lot43.json
          test ! -e data/audit/book_resilience_state_lot43.json
          test ! -e reports/lot_43_book_resilience_and_replenishment_engine_report.md
          test ! -e docs/LOT_43_BOOK_RESILIENCE_AND_REPLENISHMENT_ENGINE.md
          test ! -e docs/ACCEPTANCE_CRITERIA_LOT_43.md
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py
          test ! -e config/microstructure/trades_and_aggressor_classification_schema_v1.json
          test ! -e scripts/run_lot44_trades_and_aggressor_classification_schema.py
          test ! -e scripts/validate_lot44.py
          test ! -e tests/test_lot44_trades_and_aggressor_classification_schema.py
          test ! -e docs/LOT_44_TRADES_AND_AGGRESSOR_CLASSIFICATION_SCHEMA.md
          test ! -e docs/ACCEPTANCE_CRITERIA_LOT_44.md
      - name: Validate closed gate contract and exact predecessor audit
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m json.tool data/audit/lot43_v4_entry_gate.json >/dev/null
          python -m json.tool contracts/schemas/lot43_v4_entry_gate_v1.schema.json >/dev/null
          ruff check scripts/validate_lot43_entry_gate.py tests/test_lot43_v4_entry_gate.py
          python scripts/validate_lot43_entry_gate.py
          pytest -q tests/test_lot43_v4_entry_gate.py
      - name: Architecture roadmap traceability and engineering controls
        run: |
          set -euo pipefail
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Security dependency full regression and anti-flake
        run: |
          set -euo pipefail
          bandit -q -r scripts/validate_lot43_entry_gate.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do pytest -q tests/test_lot43_v4_entry_gate.py; done
      - name: Re-prove downstream lock after all validation
        run: |
          set -euo pipefail
          python scripts/validate_lot43_entry_gate.py
          test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine.py
          test ! -e scripts/run_lot43_book_resilience_and_replenishment_engine.py
          test ! -e src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
          test ! -e scripts/run_lot44_trades_and_aggressor_classification_schema.py
