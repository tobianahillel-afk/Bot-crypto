name: Lot 35 implementation entry gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/audit/lot35_v3_entry_gate.json'
      - 'contracts/schemas/lot35_v3_entry_gate_v1.schema.json'
      - 'docs/LOT_35_V3_ENTRY_GATE.md'
      - 'reports/lot_35_v3_entry_gate_report.md'
      - 'scripts/validate_lot35_entry_gate.py'
      - 'tests/test_lot35_v3_entry_gate.py'
      - '.github/workflows/lot35-entry-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Verify exact audited base and gate-only boundary
        shell: bash
        run: |
          git merge-base --is-ancestor ff9bff8e670d2d6dd86df713c4baf5d0228e53c8 HEAD
          git diff --quiet ff9bff8e670d2d6dd86df713c4baf5d0228e53c8...HEAD -- src/
      - name: Compile lint schema and gate validation
        run: |
          python -m compileall -q scripts tests
          python -m json.tool data/audit/lot35_v3_entry_gate.json >/dev/null
          python -m json.tool contracts/schemas/lot35_v3_entry_gate_v1.schema.json >/dev/null
          ruff check scripts/validate_lot35_entry_gate.py tests/test_lot35_v3_entry_gate.py
          python scripts/validate_lot34.py
          python scripts/validate_lot34_no_connectivity.py
          python scripts/validate_lot34_post_merge.py
          python scripts/validate_lot35_entry_gate.py
      - name: Architecture roadmap traceability and engineering gates
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Gate tests and full regression
        run: |
          pytest -q tests/test_lot35_v3_entry_gate.py
          pytest -q
      - name: Gate anti-flake repetitions
        run: |
          pytest -q tests/test_lot35_v3_entry_gate.py
          pytest -q tests/test_lot35_v3_entry_gate.py
          pytest -q tests/test_lot35_v3_entry_gate.py
      - name: Security and dependency checks
        run: |
          bandit -q -r scripts/validate_lot35_entry_gate.py -ll
          pip-audit -r requirements-dev.lock
