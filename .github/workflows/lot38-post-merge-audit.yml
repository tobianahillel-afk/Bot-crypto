name: Lot 38 independent post-merge audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'docs/LOT_38_POST_MERGE_AUDIT.md'
      - 'docs/LOT38_POST_MERGE_VALIDATION_MATRIX.md'
      - 'data/audit/roadmap_lifecycle_overlay_lot38.json'
      - 'reports/lot38/coverage_summary.json'
      - 'reports/lot38/mutation_summary.json'
      - 'scripts/validate_lot37_post_merge.py'
      - 'scripts/validate_lot38_post_merge.py'
      - 'tests/test_lot37_post_merge_state.py'
      - 'tests/test_lot38_coverage_completion.py'
      - 'tests/test_lot38_post_merge_state.py'
      - 'tests/test_lot38_v4_entry_gate.py'
      - '.github/workflows/lot37-post-merge-audit.yml'
      - '.github/workflows/lot38-order-book-l2-snapshot.yml'
      - '.github/workflows/lot38-mutation-assurance.yml'
      - '.github/workflows/lot38-post-merge-audit.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove immutable historical Lot 38 boundary
        shell: bash
        run: |
          set -euo pipefail
          MERGED_COMMIT=e4b44d27886ade86f9d1d05d480b89010b03700d
          git merge-base --is-ancestor "$MERGED_COMMIT" HEAD
          git diff --quiet "$MERGED_COMMIT" HEAD -- \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine.py \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_models.py \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_validation.py \
            config/microstructure/order_book_l2_snapshot_engine_v1.json \
            contracts/schemas/order_book_snapshot_raw_v1.schema.json \
            contracts/schemas/order_book_snapshot_v1.schema.json \
            contracts/schemas/book_health_state_v1.schema.json \
            contracts/schemas/order_book_l2_snapshot_engine_state_v1.schema.json \
            contracts/schemas/order_book_l2_snapshot_engine_audit_v1.schema.json \
            data/audit/order_book_l2_snapshot_engine_lot38.json \
            data/audit/order_book_l2_snapshot_engine_audit_lot38.json \
            data/audit/order_book_snapshot_lot38.json \
            data/audit/book_health_state_lot38.json \
            reports/lot38/coverage_summary.json \
            reports/lot38/mutation_summary.json
      - name: Compile lint type and frozen Lot 38 evidence
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src scripts tests
          ruff check \
            scripts/validate_lot38_frozen_evidence.py \
            tests/test_lot38_coverage_completion.py \
            tests/test_lot38_post_merge_state.py \
            tests/test_lot38_v4_entry_gate.py
          mypy src/crypto_quant_bot
          python scripts/validate_lot37_post_merge.py
          python scripts/validate_lot38_frozen_evidence.py
          python scripts/validate_lot38.py --expected-code-commit b74bea4329d5e5cb7cf2452058b684ea5a5df13c
          python scripts/validate_lot38_no_connectivity.py
          python - <<'PY'
          from pathlib import Path
          audit = Path('docs/LOT_38_POST_MERGE_AUDIT.md').read_text(encoding='utf-8')
          matrix = Path('docs/LOT38_POST_MERGE_VALIDATION_MATRIX.md').read_text(encoding='utf-8')
          assert 'GO_LOT38_POST_MERGE' in audit
          assert 'release=0.38.0' in audit
          assert '81.66%' in matrix
          assert 'PLANNED_LOCKED' in audit
          print('LOT38_HISTORICAL_POST_MERGE_ATTESTATION: PASS')
          PY
      - name: Architecture roadmap traceability and engineering gates
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Audit tests full regression and anti-flake
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_lot38_post_merge_state.py
          pytest -q
          pytest -q tests/test_lot38_post_merge_state.py
          pytest -q tests/test_lot38_post_merge_state.py
          pytest -q tests/test_lot38_post_merge_state.py
      - name: Security and final historical attestation
        env:
          PYTHONPATH: src
        run: |
          bandit -q -r src -ll
          pip-audit -r requirements-dev.lock
          python scripts/validate_lot37_post_merge.py
          python scripts/validate_lot38_frozen_evidence.py
