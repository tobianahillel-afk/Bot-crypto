name: Lot 27 one-shot final reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot27-final-reconciliation.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/lot27-global-market-context-aggregator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot27-global-market-context-aggregator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Make release metadata replacements independent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/finalize_lot27_release.py')
          text = path.read_text(encoding='utf-8')
          old = '''    replace(
              "pyproject.toml",
              'version = "0.26.0"\\ndescription = "Crypto Quant Bot V3.1-Ops — Lot 26 validated offline descriptive alignment"',
              'version = "0.27.0"\\ndescription = "Crypto Quant Bot V3.1-Ops — Lot 27 validated offline global market context"',
          )
          '''
          new = '''    replace(
              "pyproject.toml",
              'version = "0.26.0"',
              'version = "0.27.0"',
          )
              replace(
              "pyproject.toml",
              'description = "Crypto Quant Bot V3.1-Ops — Lot 26 validated offline descriptive alignment"',
              'description = "Crypto Quant Bot V3.1-Ops — Lot 27 validated offline global market context"',
          )
          '''
          if old not in text:
              raise SystemExit('LOT27_PYPROJECT_RELEASE_BLOCK_NOT_FOUND')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Reconcile canonical Lot 27 release state
        run: |
          python scripts/finalize_lot27_release.py \
            --implementation-commit bae0633d1fb28a77eb91111796d35549a5a365c8
      - name: Remove one-shot files from validated workspace
        run: |
          rm -f .github/workflows/lot27-final-reconciliation.yml
          rm -f scripts/finalize_lot27_release.py
      - name: Validate reconciled repository state
        run: |
          python -m compileall -q src scripts tests
          ruff check src/crypto_quant_bot/market_analysis/global_market_context_aggregator*.py scripts/run_lot27_global_market_context_aggregator.py scripts/validate_lot27.py tests/lot27_fixtures.py tests/test_lot27_*.py tests/test_lot26_post_merge_state.py
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_domain_architecture.py
          python scripts/validate_traceability_contract.py
          python scripts/validate_lot27.py
          pytest -q tests/test_lot26_post_merge_state.py tests/test_lot27_*.py
      - name: Commit validated non-workflow release state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml README.md CHANGELOG.md docs data/audit reports tests
          git diff --cached --quiet || git commit -m 'Lot27 finalize CI-backed release evidence'
          git push origin HEAD:agent/lot27-global-market-context-aggregator
      # Third revision intentionally triggers the corrected one-shot workflow.
