name: Lot 44 frozen evidence attestation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot44-frozen-evidence.yml'
      - '.github/workflows/lot44-trades-aggressor-classification.yml'
      - '.github/workflows/lot44-mutation-assurance.yml'
      - 'config/microstructure/trades_and_aggressor_classification_schema_v1.json'
      - 'contracts/schemas/classified_trade_v1.schema.json'
      - 'contracts/schemas/aggressor_confidence_state_v1.schema.json'
      - 'contracts/schemas/trades_aggressor_classification_schema_state_v1.schema.json'
      - 'contracts/schemas/trades_aggressor_classification_schema_audit_v1.schema.json'
      - 'src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py'
      - 'src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py'
      - 'src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py'
      - 'scripts/run_lot44_trades_and_aggressor_classification_schema.py'
      - 'scripts/validate_lot44.py'
      - 'scripts/validate_lot44_frozen_evidence.py'
      - 'scripts/validate_lot44_no_connectivity.py'
      - 'tests/test_lot44*.py'
      - 'docs/LOT_44_TRADES_AND_AGGRESSOR_CLASSIFICATION_SCHEMA.md'
      - 'docs/ACCEPTANCE_CRITERIA_LOT_44.md'
      - 'data/audit/trades_and_aggressor_classification_schema_lot44.json'
      - 'data/audit/trades_and_aggressor_classification_schema_audit_lot44.json'
      - 'data/audit/aggressor_confidence_state_lot44.json'
      - 'reports/lot44/**'
      - 'reports/lot_44_trades_and_aggressor_classification_schema_report.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      GATE_MERGE_SHA: 6bbf4fcc5543f2599378bcab93263e2c8cebcec6
      SOURCE_HEAD_SHA: fd6d4d88608b80a7f27d561f59988072177d00b2
      CERTIFICATION_ANCHOR_SHA: 74dce49ba636cb47ae09fcef7de48bdc3d21de15
      EVIDENCE_HEAD_SHA: dc9fb81b2b32858b75180d6b632346577df02d1e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove certified source certification and evidence chain
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GATE_MERGE_SHA" "$SOURCE_HEAD_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" "$CERTIFICATION_ANCHOR_SHA"
          git merge-base --is-ancestor "$CERTIFICATION_ANCHOR_SHA" "$EVIDENCE_HEAD_SHA"
          git merge-base --is-ancestor "$EVIDENCE_HEAD_SHA" HEAD
          test "$(git rev-list --count "$SOURCE_HEAD_SHA..$CERTIFICATION_ANCHOR_SHA")" = "2"
          test "$(git rev-list --count "$CERTIFICATION_ANCHOR_SHA..$EVIDENCE_HEAD_SHA")" = "5"
          git diff --name-only "$CERTIFICATION_ANCHOR_SHA" "$EVIDENCE_HEAD_SHA" | sort > /tmp/lot44-evidence.txt
          printf '%s\n' \
            data/audit/aggressor_confidence_state_lot44.json \
            data/audit/trades_and_aggressor_classification_schema_audit_lot44.json \
            data/audit/trades_and_aggressor_classification_schema_lot44.json \
            reports/lot44/coverage_summary.json \
            reports/lot44/mutation_summary.json | sort > /tmp/lot44-evidence-expected.txt
          diff -u /tmp/lot44-evidence-expected.txt /tmp/lot44-evidence.txt
      - name: Prove frozen Lot 44 production source immutability
        run: |
          set -euo pipefail
          git diff --quiet "$SOURCE_HEAD_SHA" HEAD -- \
            config/microstructure/trades_and_aggressor_classification_schema_v1.json \
            contracts/schemas/classified_trade_v1.schema.json \
            contracts/schemas/aggressor_confidence_state_v1.schema.json \
            contracts/schemas/trades_aggressor_classification_schema_state_v1.schema.json \
            contracts/schemas/trades_aggressor_classification_schema_audit_v1.schema.json \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py \
            scripts/run_lot44_trades_and_aggressor_classification_schema.py \
            scripts/validate_lot44.py \
            scripts/validate_lot44_no_connectivity.py \
            tests/test_lot44_trades_and_aggressor_classification_schema.py \
            tests/test_lot44_schema_contracts.py \
            docs/LOT_44_TRADES_AND_AGGRESSOR_CLASSIFICATION_SCHEMA.md \
            docs/ACCEPTANCE_CRITERIA_LOT_44.md \
            reports/lot_44_trades_and_aggressor_classification_schema_report.md
          git diff --quiet "$CERTIFICATION_ANCHOR_SHA" HEAD -- \
            .github/workflows/lot44-trades-aggressor-classification.yml \
            .github/workflows/lot44-mutation-assurance.yml
      - name: Prove frozen evidence immutability
        run: |
          set -euo pipefail
          git diff --quiet "$EVIDENCE_HEAD_SHA" HEAD -- \
            data/audit/aggressor_confidence_state_lot44.json \
            data/audit/trades_and_aggressor_classification_schema_audit_lot44.json \
            data/audit/trades_and_aggressor_classification_schema_lot44.json \
            reports/lot44/coverage_summary.json \
            reports/lot44/mutation_summary.json
      - name: Validate current frozen evidence contract
        run: |
          set -euo pipefail
          python -m compileall -q scripts/validate_lot44_frozen_evidence.py
          ruff check scripts/validate_lot44_frozen_evidence.py
          python scripts/validate_lot44_frozen_evidence.py \
            | tee /tmp/lot44-frozen-validation.json
      - name: Replay certified Lot 44 source deterministically
        run: |
          set -euo pipefail
          rm -rf /tmp/lot44-source-certified /tmp/lot44-run1 /tmp/lot44-frozen-expected
          mkdir -p /tmp/lot44-run1 /tmp/lot44-frozen-expected
          cp data/audit/trades_and_aggressor_classification_schema_lot44.json /tmp/lot44-frozen-expected/
          cp data/audit/trades_and_aggressor_classification_schema_audit_lot44.json /tmp/lot44-frozen-expected/
          cp data/audit/aggressor_confidence_state_lot44.json /tmp/lot44-frozen-expected/
          git worktree add --detach /tmp/lot44-source-certified "$SOURCE_HEAD_SHA"
          trap 'git worktree remove --force /tmp/lot44-source-certified >/dev/null 2>&1 || true' EXIT
          (
            cd /tmp/lot44-source-certified
            outputs=(
              data/audit/trades_and_aggressor_classification_schema_lot44.json
              data/audit/trades_and_aggressor_classification_schema_audit_lot44.json
              data/audit/aggressor_confidence_state_lot44.json
            )
            PYTHONPATH=src python scripts/run_lot44_trades_and_aggressor_classification_schema.py \
              --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot44.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            PYTHONPATH=src python scripts/validate_lot44_no_connectivity.py
            for path in "${outputs[@]}"; do
              cmp "$path" "/tmp/lot44-frozen-expected/$(basename "$path")"
              cp "$path" "/tmp/lot44-run1/$(basename "$path")"
            done
            PYTHONPATH=src python scripts/run_lot44_trades_and_aggressor_classification_schema.py \
              --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot44.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            for path in "${outputs[@]}"; do
              cmp "/tmp/lot44-run1/$(basename "$path")" "$path"
            done
            PYTHONPATH=src pytest -q \
              tests/test_lot44_trades_and_aggressor_classification_schema.py \
              tests/test_lot44_schema_contracts.py
          )
          git worktree remove --force /tmp/lot44-source-certified
          trap - EXIT
      - name: Current architecture security and regression
        run: |
          set -euo pipefail
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          python scripts/validate_lot44_no_connectivity.py
          bandit -q -r scripts/validate_lot44_frozen_evidence.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do
            pytest -q \
              tests/test_lot44_trades_and_aggressor_classification_schema.py \
              tests/test_lot44_schema_contracts.py
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot44-frozen-evidence-attestation
          path: /tmp/lot44-frozen-validation.json
