name: Lot 29 bounded Ruff normalization

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix_lot29_ruff.py'
      - '.github/workflows/lot29-ruff-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'agent/lot29-v2-deterministic-replay-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot29-v2-deterministic-replay-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Apply and validate exact normalization
        run: |
          if [ ! -f scripts/fix_lot29_ruff.py ]; then
            echo 'Lot 29 Ruff normalization already applied.'
            exit 0
          fi
          python scripts/fix_lot29_ruff.py
          ruff check \
            src/crypto_quant_bot/market_analysis/v2_deterministic_replay_and_audit.py \
            src/crypto_quant_bot/market_analysis/v2_replay_audit_models.py \
            scripts/run_lot29_v2_deterministic_replay_and_audit.py \
            scripts/validate_lot29.py \
            tests/test_lot29_*.py
          pytest -q tests/test_lot29_v2_deterministic_replay_and_audit.py
      - name: Commit non-workflow normalization
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No normalization changes remain.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "Normalize Lot 29 Ruff findings"
          git push origin HEAD:agent/lot29-v2-deterministic-replay-audit
