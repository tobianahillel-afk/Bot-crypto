name: P0.6 patch readiness allowlist

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p06-final-pre-lot26-assurance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p06-final-pre-lot26-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Apply bounded readiness allowlist
        run: python scripts/patch_p06_readiness_allowlist.py
      - name: Commit validator update
        shell: bash
        run: |
          if git diff --quiet -- scripts/validate_pre_lot26_readiness.py; then
            echo 'Readiness allowlist already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_pre_lot26_readiness.py
          git commit -m 'Allow reviewed P0.6 source migration in readiness gate'
          git push origin HEAD:agent/p06-final-pre-lot26-assurance
