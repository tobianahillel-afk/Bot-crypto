name: Lot 26 one-shot final reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot26-final-reconciliation.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/lot26-multi-timeframe-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot26-multi-timeframe-alignment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Reconcile canonical release state
        run: python scripts/finalize_lot26_release.py
      - name: Remove one-shot reconciliation files
        run: rm -f .github/workflows/lot26-final-reconciliation.yml scripts/finalize_lot26_release.py
      - name: Validate reconciled repository state
        run: |
          python -m compileall -q scripts src
          ruff check scripts/validate_roadmap_documentation.py
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_pre_lot26_readiness.py
          python scripts/validate_lot26.py
          pytest -q tests/test_pre_lot26_readiness.py tests/test_lot26_*.py
      - name: Commit final reconciled state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Lot26 finalize CI-backed release evidence'
          git push origin HEAD:agent/lot26-multi-timeframe-alignment
