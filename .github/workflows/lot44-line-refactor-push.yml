name: Lot 44 line refactor push

on:
  push:
    branches:
      - agent/lot44-trades-aggressor-classification-schema

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'Run temporary Lot 44 line refactor'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/lot44-trades-aggressor-classification-schema
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Apply line refactor
        run: python scripts/_lot44_line_refactor.py
      - name: Validate refactor
        run: |
          set -euo pipefail
          ruff check src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py
          mypy src/crypto_quant_bot/microstructure
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          pytest -q \
            tests/test_lot44_trades_and_aggressor_classification_schema.py \
            tests/test_lot44_schema_contracts.py \
            tests/test_lot44_causal_guards.py
      - name: Commit refactor and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/lot44-line-refactor-push.yml scripts/_lot44_line_refactor.py
          git config user.name "tobianahillel-afk"
          git config user.email "269188945+tobianahillel-afk@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Lot 44 tick-history validation"
          git push origin HEAD:agent/lot44-trades-aggressor-classification-schema
