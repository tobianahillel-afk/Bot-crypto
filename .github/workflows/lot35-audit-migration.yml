name: Lot 35 audit one-shot migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot35-audit-migration.yml'
      - 'pyproject.toml'
      - 'data/audit/roadmap_lifecycle_overlay_lot35.json'
      - 'reports/lot35/coverage_summary.json'
      - 'reports/lot35/mutation_summary.json'

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/lot35-post-merge-audit'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot35-post-merge-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Synchronize current documentation and historical validators
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'LOT35_AUDIT_MIGRATION_MISSING:{label}')
              return text.replace(old, new, 1)

          readme = ROOT / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = replace_once(text, '# Crypto Quant Bot V3.4-Ops', '# Crypto Quant Bot V3.5-Ops', 'readme-title')
          text = replace_once(
              text,
              '| Dernier lot implémenté et validé | **Lot 34 — Market Data Quality Engine** |',
              '| Dernier lot implémenté et validé | **Lot 35 — Candle / Trade / Book Reconciliation** |',
              'readme-current-lot',
          )
          text = replace_once(text, '| Version | **0.34.0** |', '| Version | **0.35.0** |', 'readme-version')
          text = replace_once(
              text,
              '| Prochain lot planifié | **Lot 35 — Candle / Trade / Book Reconciliation**, `PLANNED_LOCKED` |',
              '| Prochain lot planifié | **Lot 36**, `PLANNED_LOCKED` |',
              'readme-next-lot',
          )
          paragraph = (
              '\nLe Lot 35 ajoute la **réconciliation Candle / Trade / Book** offline : deltas exacts en '
              '`Decimal`, écarts temporels en microsecondes entières, source de vérité explicite, '
              'classification `MATCH/TOLERATED_DIFF/MINOR_DIVERGENCE/CRITICAL_DIVERGENCE`, '
              'détection des orphelins et doublons, ordre canonique déterministe et veto fail-closed. '
              'La fixture certifiée contient 3 rapports (2 `MATCH`, 1 `TOLERATED_DIFF`) et conserve '
              '`ALLOW_ANALYSIS`; aucune connectivité, mutation raw ou capacité de trading/exécution '
              'n’est ouverte. Les preuves finales sont 96.43% lignes, 93.75% branches et 83.73% mutation.\n'
          )
          anchor = "le réseau reste désactivé et aucune capacité de trading n'est ouverte.\n"
          if 'Les preuves finales sont 96.43% lignes' not in text:
              text = replace_once(text, anchor, anchor + paragraph, 'readme-lot35-paragraph')
          text = text.replace('Les Lots 31 à 34 restent', 'Les Lots 31 à 35 restent')
          text = text.replace('Les Lots 26 à 34 ne produisent', 'Les Lots 26 à 35 ne produisent')
          validation_anchor = 'python scripts/validate_lot34_post_merge.py\n'
          validation_add = (
              validation_anchor
              + 'python scripts/validate_lot35.py\n'
              + 'python scripts/validate_lot35_no_connectivity.py\n'
              + 'python scripts/validate_lot35_post_merge.py\n'
          )
          text = replace_once(text, validation_anchor, validation_add, 'readme-validation')
          lot35_sources = '''### Lot 35\n\n- [Gate d’entrée](docs/LOT_35_V3_ENTRY_GATE.md)\n- [Spécification](docs/LOT_35_CANDLE_TRADE_BOOK_RECONCILIATION.md)\n- [Critères d’acceptation](docs/ACCEPTANCE_CRITERIA_LOT_35.md)\n- [Audit post-merge](docs/LOT_35_POST_MERGE_AUDIT.md)\n- [Rapport final](reports/lot_35_candle_trade_book_reconciliation_report.md)\n- État certifié : `data/audit/candle_trade_book_reconciliation_lot35.json`\n- Audit certifié : `data/audit/candle_trade_book_reconciliation_audit_lot35.json`\n- Rapports de réconciliation : `data/audit/reconciliation_reports_lot35.json`\n- Veto réconciliation : `data/audit/reconciliation_veto_lot35.json`\n- Coverage : `reports/lot35/coverage_summary.json`\n- Mutation : `reports/lot35/mutation_summary.json`\n- Lifecycle courant : `data/audit/roadmap_lifecycle_overlay_lot35.json`\n\n'''
          if '### Lot 35\n' not in text:
              text = replace_once(
                  text,
                  '### Architecture future verrouillée\n',
                  lot35_sources + '### Architecture future verrouillée\n',
                  'readme-lot35-section',
              )
          readme.write_text(text, encoding='utf-8')

          roadmap = ROOT / 'docs/ROADMAP_V1_TO_V21.md'
          text = roadmap.read_text(encoding='utf-8')
          text = replace_once(text, 'Projet : **Crypto Quant Bot V3.4-Ops**', 'Projet : **Crypto Quant Bot V3.5-Ops**', 'roadmap-title')
          text = replace_once(text, "- Dernier lot dont l'implémentation est terminée : **Lot 34**.", "- Dernier lot dont l'implémentation est terminée : **Lot 35**.", 'roadmap-current')
          text = replace_once(text, '- Version courante : `0.34.0`.', '- Version courante : `0.35.0`.', 'roadmap-version')
          text = replace_once(
              text,
              '- Lot 34 : `IMPLEMENTED_VALIDATED_DATA_QUALITY_ONLY`.',
              '- Lot 34 : `IMPLEMENTED_VALIDATED_DATA_QUALITY_ONLY`.\n- Lot 35 : `IMPLEMENTED_VALIDATED_RECONCILIATION_ONLY`.',
              'roadmap-lot35-status',
          )
          text = replace_once(text, '- Lots 35–177 : planifiés et verrouillés.', '- Lots 36–177 : planifiés et verrouillés.', 'roadmap-future')
          text = replace_once(
              text,
              "- V3 possède le registre de sources, le registre canonique d'instruments, la gouvernance temporelle et le quality gate offline, sans connectivité ni ingestion.",
              "- V3 possède le registre de sources, le registre canonique d'instruments, la gouvernance temporelle, le quality gate et la réconciliation candle/trade/book offline, sans connectivité ni ingestion.",
              'roadmap-v3-summary',
          )
          text = replace_once(text, 'data/audit/roadmap_lifecycle_overlay_lot34.json', 'data/audit/roadmap_lifecycle_overlay_lot35.json', 'roadmap-overlay')
          lot35_section = '''## Lot 35\n\n- [Entry gate](LOT_35_V3_ENTRY_GATE.md)\n- [Specification](LOT_35_CANDLE_TRADE_BOOK_RECONCILIATION.md)\n- [Acceptance criteria](ACCEPTANCE_CRITERIA_LOT_35.md)\n- [Post-merge audit](LOT_35_POST_MERGE_AUDIT.md)\n- Configuration : `config/data_governance/candle_trade_book_reconciliation_v1.json`\n- State : `data/audit/candle_trade_book_reconciliation_lot35.json`\n- Audit : `data/audit/candle_trade_book_reconciliation_audit_lot35.json`\n- Reconciliation reports : `data/audit/reconciliation_reports_lot35.json`\n- Reconciliation veto : `data/audit/reconciliation_veto_lot35.json`\n- Report : `reports/lot_35_candle_trade_book_reconciliation_report.md`\n- Coverage evidence : `reports/lot35/coverage_summary.json`\n- Mutation evidence : `reports/lot35/mutation_summary.json`\n- Runner : `scripts/run_lot35_candle_trade_book_reconciliation.py`\n- Validator : `scripts/validate_lot35.py`\n- No-connectivity validator : `scripts/validate_lot35_no_connectivity.py`\n- Post-merge validator : `scripts/validate_lot35_post_merge.py`\n- Lifecycle overlay : `data/audit/roadmap_lifecycle_overlay_lot35.json`\n\n'''
          if '## Lot 35\n' not in text:
              text = replace_once(
                  text,
                  '## Séparations obligatoires\n',
                  lot35_section + '## Séparations obligatoires\n',
                  'roadmap-lot35-section',
              )
          text = text.replace("Les Lots 26–34 n'en produisent aucune.", "Les Lots 26–35 n'en produisent aucune.")
          text = replace_once(
              text,
              "15. Lot 35 reste verrouillé après l'audit post-merge du Lot 34 jusqu'à un gate d'entrée distinct et une décision humaine explicite.",
              "15. Lot 36 reste verrouillé après l'audit post-merge du Lot 35 jusqu'à un gate d'entrée distinct et une décision humaine explicite.",
              'roadmap-next-lock',
          )
          roadmap.write_text(text, encoding='utf-8')

          gate = ROOT / 'scripts/validate_lot35_entry_gate.py'
          text = gate.read_text(encoding='utf-8')
          text = text.replace('import tomllib\n', '')
          text = replace_once(
              text,
              '    project = tomllib.loads((ROOT / "pyproject.toml").read_text(encoding="utf-8"))["project"]\n    require(project["version"] == "0.34.0", "Lot 35 gate requires project version 0.34.0")\n',
              '',
              'gate-current-version',
          )
          gate.write_text(text, encoding='utf-8')

          validator = ROOT / 'scripts/validate_roadmap_documentation.py'
          text = validator.read_text(encoding='utf-8')
          text = replace_once(text, 'roadmap_lifecycle_overlay_lot34.json', 'roadmap_lifecycle_overlay_lot35.json', 'validator-overlay')
          marker = '}\nPORTFOLIO_RISK_FILES = ['
          addition = '''}\nREQUIRED_RELEASE_FILES[35] = [\n    "docs/LOT_35_CANDLE_TRADE_BOOK_RECONCILIATION.md",\n    "docs/LOT_35_POST_MERGE_AUDIT.md",\n    "data/audit/candle_trade_book_reconciliation_lot35.json",\n    "data/audit/candle_trade_book_reconciliation_audit_lot35.json",\n    "data/audit/reconciliation_reports_lot35.json",\n    "data/audit/reconciliation_veto_lot35.json",\n    "reports/lot35/coverage_summary.json",\n    "reports/lot35/mutation_summary.json",\n]\nPORTFOLIO_RISK_FILES = ['''
          text = replace_once(text, marker, addition, 'validator-release-files')
          text = replace_once(text, 'overlay.get("latest_implemented_lot") == 34, "lifecycle latest lot must be 34"', 'overlay.get("latest_implemented_lot") == 35, "lifecycle latest lot must be 35"', 'validator-latest')
          text = replace_once(
              text,
              'overlay.get("previous_overlay") == "data/audit/roadmap_lifecycle_overlay_lot33.json",\n        "Lot 34 lifecycle predecessor mismatch",',
              'overlay.get("previous_overlay") == "data/audit/roadmap_lifecycle_overlay_lot34.json",\n        "Lot 35 lifecycle predecessor mismatch",',
              'validator-predecessor',
          )
          text = replace_once(text, '        "34": "IMPLEMENTED_VALIDATED_DATA_QUALITY_ONLY",\n', '        "34": "IMPLEMENTED_VALIDATED_DATA_QUALITY_ONLY",\n        "35": "IMPLEMENTED_VALIDATED_RECONCILIATION_ONLY",\n', 'validator-status')
          lot35_lifecycle = '''    lot35 = lots["35"]\n    require(lot35.get("merged_commit") == "d083d4f27c89759ebed37b2ecacccbe88dccad11", "Lot 35 merged commit mismatch")\n    require(lot35.get("external_connectivity_allowed") is False, "Lot 35 connectivity enabled")\n    require(lot35.get("network_ingestion_allowed") is False, "Lot 35 ingestion enabled")\n    require(lot35.get("raw_data_mutation_allowed") is False, "Lot 35 raw mutation enabled")\n'''
          text = replace_once(
              text,
              '    require(lot34.get("raw_data_mutation_allowed") is False, "Lot 34 raw mutation enabled")\n',
              '    require(lot34.get("raw_data_mutation_allowed") is False, "Lot 34 raw mutation enabled")\n' + lot35_lifecycle,
              'validator-lot35-lifecycle',
          )
          old_lock = '''    require(\n        lots.get("35") == {"implementation_started": False, "status": "PLANNED_LOCKED"},\n        "Lot 35 must remain locked before its entry gate",\n    )\n'''
          new_lock = '''    require(\n        lots.get("36") == {"implementation_started": False, "status": "PLANNED_LOCKED"},\n        "Lot 36 must remain locked before its entry gate",\n    )\n'''
          text = replace_once(text, old_lock, new_lock, 'validator-lot36-lock')
          validate_lot35 = '''\n\ndef validate_lot35() -> None:\n    state = load_object(ROOT / "data/audit/candle_trade_book_reconciliation_lot35.json")\n    audit = load_object(ROOT / "data/audit/candle_trade_book_reconciliation_audit_lot35.json")\n    reports = load_object(ROOT / "data/audit/reconciliation_reports_lot35.json")\n    veto = load_object(ROOT / "data/audit/reconciliation_veto_lot35.json")\n    coverage = load_object(ROOT / "reports/lot35/coverage_summary.json")\n    mutation = load_object(ROOT / "reports/lot35/mutation_summary.json")\n    state_checksum = validate_payload_checksum(\n        state, "output_checksum",\n        "8fc7243beffdf985fd6947557b87ab7bd27f9191520eb2d5d9af25d1e7a886b4",\n        "Lot 35 state",\n    )\n    validate_payload_checksum(\n        audit, "audit_checksum",\n        "98a88396f5b2e5ffc1cde02435399540ad213f5ec361b33e8a19c08b0fedf1de",\n        "Lot 35 audit",\n    )\n    require(audit.get("state_output_checksum") == state_checksum, "Lot 35 audit link mismatch")\n    require(state.get("validation_state") == "VALIDATED_RECONCILIATION_ONLY", "Lot 35 state changed")\n    require(audit.get("validation_state") == "VALIDATED_RECONCILIATION_ONLY", "Lot 35 audit state changed")\n    require(reports.get("records") == state.get("reports"), "Lot 35 report collection mismatch")\n    require(veto == state.get("veto"), "Lot 35 veto artifact mismatch")\n    metrics = state.get("metrics")\n    require(isinstance(metrics, dict), "Lot 35 metrics missing")\n    require(metrics.get("lot_35_records_processed_total") == 3, "Lot 35 record count changed")\n    require(metrics.get("lot_35_match_total") == 2, "Lot 35 match count changed")\n    require(metrics.get("lot_35_tolerated_diff_total") == 1, "Lot 35 tolerated count changed")\n    require(metrics.get("lot_35_minor_divergence_total") == 0, "Lot 35 minor count changed")\n    require(metrics.get("lot_35_critical_divergence_total") == 0, "Lot 35 critical count changed")\n    require(state.get("veto", {}).get("action") == "ALLOW_ANALYSIS", "Lot 35 reference veto changed")\n    require(coverage.get("status") == "PASS", "Lot 35 coverage status changed")\n    require(coverage.get("evidence_commit") == "09701c7d5ebefbeba41143a2838564b09ea5fb3a", "Lot 35 coverage evidence commit changed")\n    require(coverage.get("line_coverage_percent") == 96.43, "Lot 35 line coverage changed")\n    require(coverage.get("branch_coverage_percent") == 93.75, "Lot 35 branch coverage changed")\n    require(coverage.get("anti_flake_repetitions") == 3, "Lot 35 anti-flake evidence changed")\n    require(mutation.get("status") == "PASS", "Lot 35 mutation status changed")\n    require(mutation.get("evidence_commit") == "09701c7d5ebefbeba41143a2838564b09ea5fb3a", "Lot 35 mutation evidence commit changed")\n    require(mutation.get("mutation_score_percent") == 83.73, "Lot 35 mutation score changed")\n    require(mutation.get("killed_mutants") == 1029, "Lot 35 killed mutants changed")\n    require(mutation.get("evaluated_mutants") == 1229, "Lot 35 evaluated mutants changed")\n    validate_fail_closed((state, audit), "Lot 35")\n'''
          text = replace_once(
              text,
              '\n\ndef validate_portfolio_risk_standard() -> None:\n',
              validate_lot35 + '\n\ndef validate_portfolio_risk_standard() -> None:\n',
              'validator-lot35-function',
          )
          text = replace_once(
              text,
              '        validate_lot34()\n        validate_portfolio_risk_standard()',
              '        validate_lot34()\n        validate_lot35()\n        validate_portfolio_risk_standard()',
              'validator-lot35-call',
          )
          text = replace_once(
              text,
              'historical_lots=178 lifecycle_latest=34 status=POST_MERGE_AUDITED next_locked=35',
              'historical_lots=178 lifecycle_latest=35 status=POST_MERGE_AUDITED next_locked=36',
              'validator-summary',
          )
          validator.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration before committing
        run: |
          python -m compileall -q src scripts tests
          ruff check \
            scripts/validate_lot35_entry_gate.py \
            scripts/validate_lot35_post_merge.py \
            scripts/validate_roadmap_documentation.py \
            tests/test_lot35_post_merge_state.py
          mypy src/crypto_quant_bot
          python scripts/validate_lot35_entry_gate.py
          python scripts/validate_lot35.py
          python scripts/validate_lot35_no_connectivity.py
          python scripts/validate_lot35_post_merge.py
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/validate_traceability_contract.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          pytest -q tests/test_lot35_post_merge_state.py
      - name: Commit synchronized audit head and remove migration workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ROADMAP_V1_TO_V21.md scripts/validate_lot35_entry_gate.py scripts/validate_roadmap_documentation.py
          git rm .github/workflows/lot35-audit-migration.yml
          git commit -m 'Synchronize Lot 35 post-merge governance state'
          git push origin HEAD:agent/lot35-post-merge-audit
