name: Lot 26 one-shot Ruff autofix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot26-ruff-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'agent/lot26-multi-timeframe-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot26-multi-timeframe-alignment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix \
            scripts/run_lot26_multi_timeframe_alignment_engine.py \
            scripts/validate_lot26.py \
            src/crypto_quant_bot/contracts/timeframe_alignment.py \
            src/crypto_quant_bot/market_analysis/alignment_*.py \
            tests/lot26_fixtures.py \
            tests/test_lot26_*.py || true
      - name: Commit safe formatting fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts src/crypto_quant_bot/contracts/timeframe_alignment.py src/crypto_quant_bot/market_analysis tests
          git diff --cached --quiet || git commit -m 'Lot26 apply safe Ruff fixes'
          git push origin HEAD:agent/lot26-multi-timeframe-alignment
