name: Bootstrap institutional P0 hardening

on:
  push:
    branches: [agent/p0-institutional-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[p0-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-institutional-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Repair migrator replacement boundaries
        run: python scripts/repair_p0_migrator.py
      - name: Apply idempotent P0 migration
        run: python scripts/apply_p0_hardening.py
      - name: Apply historical mypy fixes
        run: python scripts/apply_p0_type_fixes.py
      - name: Install quality dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Apply safe Ruff autofixes to changed and new Python files
        shell: bash
        run: |
          mapfile -t files < <(
            {
              git diff --name-only --diff-filter=ACMR origin/main -- '*.py'
              git ls-files --others --exclude-standard -- '*.py'
            } | sort -u
          )
          if ((${#files[@]})); then
            ruff check --fix "${files[@]}"
          else
            echo 'No changed Python files'
          fi
      - name: Create local candidate commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply institutional P0 hardening [p0-applied]'
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Critical Ruff checks repository-wide
        run: ruff check --select E9,F63,F7,F82 src scripts tests
      - name: Ruff changed-file gate
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          if ((${#files[@]})); then ruff check "${files[@]}"; else echo 'No changed Python files'; fi
      - name: Mypy package validation
        run: mypy src/crypto_quant_bot
      - name: Architecture boundary gate
        run: python scripts/validate_architecture_boundaries.py
      - name: Silent numeric coercion gate
        run: python scripts/check_no_silent_numeric_coercion.py
      - name: Roadmap validation
        run: python scripts/validate_roadmap_documentation.py
      - name: Complexity and duplication inventory
        run: python scripts/quality_inventory.py
      - name: Full tests with line and branch coverage
        run: pytest -q --cov --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json
      - name: New P0 numerical core coverage gate
        run: coverage report --include='src/crypto_quant_bot/market_analysis/numeric.py,src/crypto_quant_bot/market_analysis/math_parameters.py' --fail-under=90
      - name: Legacy differential coverage inventory
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=0 --html-report reports/quality/legacy_diff_coverage.html
      - name: Static security scan
        run: bandit -q -r src -ll
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements-dev.txt
      - name: Targeted mutation score gate
        shell: bash
        run: |
          rm -rf mutants
          mkdir -p reports/quality
          set -o pipefail
          mutmut run 2>&1 | tee reports/quality/mutation_run.txt
          mutmut results 2>&1 | tee reports/quality/mutation_results.txt
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          text = Path('reports/quality/mutation_run.txt').read_text(encoding='utf-8', errors='replace')
          matches = re.findall(
              r'🎉\s*(\d+).*?⏰\s*(\d+).*?🤔\s*(\d+).*?🙁\s*(\d+)',
              text,
              flags=re.DOTALL,
          )
          if not matches:
              raise SystemExit('MUTATION_SCORE_PARSE_ERROR: no mutmut summary found')
          killed, timeout, suspicious, survived = map(int, matches[-1])
          total = killed + timeout + suspicious + survived
          if total <= 0:
              raise SystemExit('MUTATION_SCORE_INVALID: no evaluated mutants')
          score = 100.0 * (killed + timeout) / total
          payload = {
              'schema_version': 'mutation-score-v1',
              'killed': killed,
              'timeout': timeout,
              'suspicious': suspicious,
              'survived': survived,
              'evaluated': total,
              'score_percent': round(score, 2),
              'minimum_score_percent': 80.0,
              'status': 'PASS' if score >= 80.0 else 'FAIL',
          }
          Path('reports/quality/mutation_score.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, sort_keys=True))
          if score < 80.0:
              raise SystemExit('MUTATION_SCORE_BELOW_80_PERCENT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p0-bootstrap-evidence
          path: |
            coverage.xml
            coverage.json
            reports/quality/complexity_duplication_inventory.json
            reports/quality/complexity_duplication_inventory.md
            reports/quality/legacy_diff_coverage.html
            reports/quality/mutation_run.txt
            reports/quality/mutation_results.txt
            reports/quality/mutation_score.json
      - name: Push validated candidate commit
        run: git push origin HEAD:agent/p0-institutional-hardening
