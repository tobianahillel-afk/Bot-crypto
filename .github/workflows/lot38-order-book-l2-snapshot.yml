name: Lot 38 order book L2 snapshot validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/microstructure/order_book_l2_snapshot_engine_v1.json'
      - 'contracts/schemas/order_book_snapshot_raw_v1.schema.json'
      - 'contracts/schemas/order_book_snapshot_v1.schema.json'
      - 'contracts/schemas/book_health_state_v1.schema.json'
      - 'contracts/schemas/order_book_l2_snapshot_engine_state_v1.schema.json'
      - 'contracts/schemas/order_book_l2_snapshot_engine_audit_v1.schema.json'
      - 'src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine*.py'
      - 'scripts/run_lot38_order_book_l2_snapshot_engine.py'
      - 'scripts/validate_lot38.py'
      - 'scripts/validate_lot38_no_connectivity.py'
      - 'scripts/validate_lot38_frozen_evidence.py'
      - 'tests/test_lot38_order_book_l2_snapshot_engine.py'
      - 'tests/test_lot38_branch_coverage.py'
      - 'tests/test_lot38_mutation_contracts.py'
      - 'tests/test_lot38_coverage_completion.py'
      - 'docs/LOT_38_ORDER_BOOK_L2_SNAPSHOT_ENGINE.md'
      - 'docs/ACCEPTANCE_CRITERIA_LOT_38.md'
      - 'reports/lot_38_order_book_l2_snapshot_engine_report.md'
      - 'reports/lot38/coverage_summary.json'
      - 'reports/lot38/mutation_summary.json'
      - 'data/audit/order_book_l2_snapshot_engine_lot38.json'
      - 'data/audit/order_book_l2_snapshot_engine_audit_lot38.json'
      - 'data/audit/order_book_snapshot_lot38.json'
      - 'data/audit/book_health_state_lot38.json'
      - '.github/workflows/lot38-order-book-l2-snapshot.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot38:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      SOURCE_HEAD_SHA: b74bea4329d5e5cb7cf2452058b684ea5a5df13c
      EVIDENCE_HEAD_SHA: ef197437d13012644e48a9044cf0883bd17700fb
      MERGED_COMMIT_SHA: e4b44d27886ade86f9d1d05d480b89010b03700d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove immutable Lot 38 squash merge and release boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git cat-file -e "$EVIDENCE_HEAD_SHA^{commit}"
          git cat-file -e "$MERGED_COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$MERGED_COMMIT_SHA" HEAD

          source_surfaces=(
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_models.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_validation.py
            config/microstructure/order_book_l2_snapshot_engine_v1.json
            contracts/schemas/order_book_snapshot_raw_v1.schema.json
            contracts/schemas/order_book_snapshot_v1.schema.json
            contracts/schemas/book_health_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_audit_v1.schema.json
            scripts/run_lot38_order_book_l2_snapshot_engine.py
            scripts/validate_lot38.py
            scripts/validate_lot38_no_connectivity.py
            docs/LOT_38_ORDER_BOOK_L2_SNAPSHOT_ENGINE.md
            docs/ACCEPTANCE_CRITERIA_LOT_38.md
            tests/test_lot38_order_book_l2_snapshot_engine.py
            tests/test_lot38_branch_coverage.py
            tests/test_lot38_mutation_contracts.py
            tests/test_lot38_coverage_completion.py
          )
          git diff --quiet "$SOURCE_HEAD_SHA" "$MERGED_COMMIT_SHA" -- "${source_surfaces[@]}"

          immutable_current_surfaces=(
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_models.py
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_validation.py
            config/microstructure/order_book_l2_snapshot_engine_v1.json
            contracts/schemas/order_book_snapshot_raw_v1.schema.json
            contracts/schemas/order_book_snapshot_v1.schema.json
            contracts/schemas/book_health_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_state_v1.schema.json
            contracts/schemas/order_book_l2_snapshot_engine_audit_v1.schema.json
            scripts/run_lot38_order_book_l2_snapshot_engine.py
            scripts/validate_lot38.py
            scripts/validate_lot38_no_connectivity.py
            docs/LOT_38_ORDER_BOOK_L2_SNAPSHOT_ENGINE.md
            docs/ACCEPTANCE_CRITERIA_LOT_38.md
            tests/test_lot38_order_book_l2_snapshot_engine.py
            tests/test_lot38_branch_coverage.py
            tests/test_lot38_mutation_contracts.py
          )
          git diff --quiet "$MERGED_COMMIT_SHA" HEAD -- "${immutable_current_surfaces[@]}"

          evidence_surfaces=(
            data/audit/order_book_l2_snapshot_engine_lot38.json
            data/audit/order_book_l2_snapshot_engine_audit_lot38.json
            data/audit/order_book_snapshot_lot38.json
            data/audit/book_health_state_lot38.json
            reports/lot38/coverage_summary.json
            reports/lot38/mutation_summary.json
          )
          git diff --quiet "$EVIDENCE_HEAD_SHA" "$MERGED_COMMIT_SHA" -- "${evidence_surfaces[@]}"
          git diff --quiet "$MERGED_COMMIT_SHA" HEAD -- "${evidence_surfaces[@]}"
      - name: Compile lint type and immutable evidence checks
        run: |
          python -m compileall -q src scripts tests
          ruff check \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine.py \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_models.py \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_validation.py \
            scripts/run_lot38_order_book_l2_snapshot_engine.py \
            scripts/validate_lot38.py \
            scripts/validate_lot38_no_connectivity.py \
            scripts/validate_lot38_frozen_evidence.py \
            tests/test_lot38_order_book_l2_snapshot_engine.py \
            tests/test_lot38_branch_coverage.py \
            tests/test_lot38_mutation_contracts.py \
            tests/test_lot38_coverage_completion.py
          mypy src/crypto_quant_bot/microstructure
          python scripts/validate_lot38_frozen_evidence.py
          python scripts/validate_lot38.py --expected-code-commit "$SOURCE_HEAD_SHA"
          python scripts/validate_lot38_no_connectivity.py
      - name: Re-run targeted Lot 38 behavioral tests
        run: |
          pytest -q \
            tests/test_lot38_order_book_l2_snapshot_engine.py \
            tests/test_lot38_branch_coverage.py \
            tests/test_lot38_mutation_contracts.py \
            tests/test_lot38_coverage_completion.py
          python scripts/validate_lot38_frozen_evidence.py
      - name: Architecture roadmap traceability and full non-regression
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          pytest -q
      - name: Security and final immutable evidence checks
        run: |
          bandit -q -r \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine.py \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_models.py \
            src/crypto_quant_bot/microstructure/order_book_l2_snapshot_engine_validation.py \
            scripts/run_lot38_order_book_l2_snapshot_engine.py \
            scripts/validate_lot38.py -ll
          pip-audit -r requirements-dev.lock
          python scripts/validate_lot38_frozen_evidence.py
