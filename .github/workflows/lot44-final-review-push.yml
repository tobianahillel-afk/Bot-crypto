name: Lot 44 final review patch

on:
  push:
    branches:
      - agent/lot44-trades-aggressor-classification-schema

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run final Lot 44 review patch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/lot44-trades-aggressor-classification-schema
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Apply final review patch
        run: python scripts/_lot44_final_review_patch.py
      - name: Validate final review patch
        run: |
          set -euo pipefail
          ruff check \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_validation.py \
            tests/test_lot44_causal_guards.py
          mypy src/crypto_quant_bot/microstructure
          pytest -q \
            tests/test_lot44_trades_and_aggressor_classification_schema.py \
            tests/test_lot44_schema_contracts.py \
            tests/test_lot44_causal_guards.py
      - name: Commit patch and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/lot44-final-review-push.yml scripts/_lot44_final_review_patch.py
          git config user.name "tobianahillel-afk"
          git config user.email "269188945+tobianahillel-afk@users.noreply.github.com"
          git add -A
          git commit -m "Close final Lot 44 review invariants"
          git push origin HEAD:agent/lot44-trades-aggressor-classification-schema
