name: Pre-Lot26 readiness validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.python-version'
      - 'requirements-dev.in'
      - 'requirements-dev.lock'
      - 'pyproject.toml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/pre-lot26-readiness-validation.yml'
      - 'config/math/multi_timeframe_alignment_v1.json'
      - 'config/governance/**'
      - 'config/temporal/**'
      - 'config/research/forecast_horizon_registry_v1.json'
      - 'contracts/schemas/**'
      - 'docs/**'
      - 'scripts/apply_lot26_migration.py'
      - 'scripts/lot26_payload_*.txt'
      - 'scripts/audit_roadmap_semantics.py'
      - 'scripts/quality_inventory.py'
      - 'scripts/validate_domain_architecture.py'
      - 'scripts/validate_engineering_deviations.py'
      - 'scripts/validate_pre_lot26_readiness.py'
      - 'scripts/validate_traceability_contract.py'
      - 'src/crypto_quant_bot/contracts/timeframe_alignment.py'
      - 'tests/test_pre_lot26_readiness.py'
      - 'tests/test_p06_*.py'
  push:
    branches:
      - main
    paths:
      - 'config/governance/**'
      - 'config/temporal/**'
      - 'config/research/forecast_horizon_registry_v1.json'
      - 'contracts/schemas/**'
      - 'docs/**'
      - 'scripts/audit_roadmap_semantics.py'
      - 'scripts/quality_inventory.py'
      - 'scripts/validate_domain_architecture.py'
      - 'scripts/validate_engineering_deviations.py'
      - 'scripts/validate_pre_lot26_readiness.py'
      - 'scripts/validate_traceability_contract.py'
      - 'tests/test_pre_lot26_readiness.py'
      - 'tests/test_p06_*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply one-shot Lot 26 implementation migration
        if: github.event_name == 'pull_request' && hashFiles('scripts/apply_lot26_migration.py') != ''
        shell: bash
        run: |
          python scripts/apply_lot26_migration.py
          rm -f .github/workflows/apply-lot26-migration.yml
          rm -f scripts/apply_lot26_migration.py scripts/lot26_payload_*.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Lot26 materialize multi-timeframe alignment implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip

      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Compile readiness code
        run: python -m compileall -q scripts tests

      - name: Ruff readiness and P0.6 code
        run: >-
          ruff check
          scripts/validate_pre_lot26_readiness.py
          scripts/audit_roadmap_semantics.py
          scripts/quality_inventory.py
          scripts/validate_domain_architecture.py
          scripts/validate_engineering_deviations.py
          scripts/validate_traceability_contract.py
          tests/test_pre_lot26_readiness.py
          tests/test_p06_decision_evidence.py
          tests/test_p06_global_coverage_gate.py

      - name: Run readiness validator
        run: python scripts/validate_pre_lot26_readiness.py --write-report

      - name: Validate canonical roadmap
        run: python scripts/validate_roadmap_documentation.py

      - name: Validate semantic roadmap ownership
        run: python scripts/audit_roadmap_semantics.py

      - name: Validate all domain boundaries
        run: python scripts/validate_domain_architecture.py

      - name: Validate mandatory decision traceability
        run: python scripts/validate_traceability_contract.py

      - name: Validate owned engineering deviations
        run: |
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py

      - name: Run readiness tests
        run: pytest -q tests/test_pre_lot26_readiness.py tests/test_p06_decision_evidence.py tests/test_p06_global_coverage_gate.py

      - name: Run full regression suite
        run: pytest -q

      - name: Publish job summary
        if: always()
        run: |
          if [ -f reports/PRE_LOT26_ENTRY_GATE_REPORT.md ]; then
            cat reports/PRE_LOT26_ENTRY_GATE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
