name: Lot 26 foundation and lifecycle validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'requirements-dev.lock'
      - 'pyproject.toml'
      - '.github/workflows/pre-lot26-readiness-validation.yml'
      - 'config/**'
      - 'contracts/schemas/**'
      - 'docs/**'
      - 'scripts/validate_pre_lot26_readiness.py'
      - 'scripts/validate_lot26.py'
      - 'scripts/run_lot26_multi_timeframe_alignment_engine.py'
      - 'src/crypto_quant_bot/contracts/timeframe_alignment.py'
      - 'src/crypto_quant_bot/market_analysis/alignment_*.py'
      - 'tests/test_pre_lot26_readiness.py'
      - 'tests/test_lot26_*.py'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'contracts/schemas/**'
      - 'docs/**'
      - 'scripts/validate_pre_lot26_readiness.py'
      - 'scripts/validate_lot26.py'
      - 'scripts/run_lot26_multi_timeframe_alignment_engine.py'
      - 'src/crypto_quant_bot/contracts/timeframe_alignment.py'
      - 'src/crypto_quant_bot/market_analysis/alignment_*.py'
      - 'tests/test_pre_lot26_readiness.py'
      - 'tests/test_lot26_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Compile lifecycle code
        run: python -m compileall -q src scripts tests
      - name: Ruff lifecycle and Lot 26 code
        run: ruff check scripts/validate_pre_lot26_readiness.py scripts/validate_lot26.py scripts/run_lot26_multi_timeframe_alignment_engine.py src/crypto_quant_bot/contracts/timeframe_alignment.py src/crypto_quant_bot/market_analysis/alignment_*.py tests/test_pre_lot26_readiness.py tests/test_lot26_*.py
      - name: Validate foundation and lifecycle
        run: python scripts/validate_pre_lot26_readiness.py --write-report
      - name: Validate canonical roadmap
        run: python scripts/validate_roadmap_documentation.py
      - name: Validate semantic ownership and architecture
        run: |
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_domain_architecture.py
          python scripts/validate_traceability_contract.py
      - name: Run lifecycle and Lot 26 tests
        run: pytest -q tests/test_pre_lot26_readiness.py tests/test_lot26_*.py
      - name: Run full regression suite
        run: pytest -q
