name: Lot 45 mutation assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine*.py'
      - 'tests/test_lot45*.py'
      - 'config/microstructure/order_flow_delta_and_cvd_engine_v1.json'
      - 'contracts/schemas/order_flow_delta_cvd_engine_state_v1.schema.json'
      - 'contracts/schemas/order_flow_delta_cvd_engine_audit_v1.schema.json'
      - 'contracts/schemas/order_flow_state_v1.schema.json'
      - 'contracts/schemas/cvd_series_v1.schema.json'
      - '.github/workflows/lot45-mutation-assurance.yml'
      - 'requirements-dev.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-22.04
    env:
      SOURCE_HEAD_SHA: 48a69f40f0958b660c43813019dad8a7b9fb3a9a
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 48a69f40f0958b660c43813019dad8a7b9fb3a9a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove exact frozen source and Lot 46 lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine.py
          test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine_models.py
          test ! -e scripts/run_lot46_trade_classification_confidence_engine.py
          test ! -e scripts/validate_lot46.py
          test ! -e tests/test_lot46_trade_classification_confidence_engine.py
      - name: Baseline Lot 45 tests
        run: |
          set -o pipefail
          mkdir -p reports/lot45/mutation
          PYTHONPATH=src pytest -q \
            tests/test_lot45_order_flow_delta_and_cvd_engine.py \
            tests/test_lot45_policy_contract.py \
            tests/test_lot45_runtime_binding_and_rounding.py \
            tests/test_lot45_schema_contracts.py \
            --junitxml=reports/lot45/mutation/baseline.xml \
            2>&1 | tee reports/lot45/mutation/baseline.txt
      - name: Build isolated mutation workspace
        run: |
          set -euo pipefail
          rm -rf .tmp-lot45-mutants
          mkdir -p .tmp-lot45-mutants/tests
          cp -R src .tmp-lot45-mutants/
          cp -R config .tmp-lot45-mutants/
          cp -R data .tmp-lot45-mutants/
          cp -R contracts .tmp-lot45-mutants/
          cp -R tests/fixtures .tmp-lot45-mutants/tests/ 2>/dev/null || true
          cp tests/test_lot45_order_flow_delta_and_cvd_engine.py .tmp-lot45-mutants/tests/
          cp tests/test_lot45_policy_contract.py .tmp-lot45-mutants/tests/
          cp tests/test_lot45_runtime_binding_and_rounding.py .tmp-lot45-mutants/tests/
          cp tests/test_lot45_schema_contracts.py .tmp-lot45-mutants/tests/
          python - <<'PY'
          from pathlib import Path
          import toml

          root = Path('.tmp-lot45-mutants')
          mutated = {
              'order_flow_delta_and_cvd_engine.py',
              'order_flow_delta_and_cvd_engine_models.py',
              'order_flow_delta_and_cvd_engine_validation.py',
          }
          microstructure = root / 'src/crypto_quant_bot/microstructure'
          dependency_files = [
              'src/crypto_quant_bot/__init__.py',
              'src/crypto_quant_bot/data_governance/',
              *[
                  str(path.relative_to(root))
                  for path in sorted(microstructure.glob('*.py'))
                  if path.name not in mutated
              ],
          ]
          mutation_test_selection = [
              'tests/test_lot45_order_flow_delta_and_cvd_engine.py',
              'tests/test_lot45_policy_contract.py',
              'tests/test_lot45_runtime_binding_and_rounding.py',
              'tests/test_lot45_schema_contracts.py',
              '-k',
              (
                  'not test_reference_frozen_lot44_builds_expected_order_flow '
                  'and not test_artifacts_reject_nonexistent_and_mismatched_code_commits'
              ),
          ]
          config = {
              'project': {
                  'name': 'crypto-quant-bot-lot45-mutation',
                  'version': '0.45.0.dev0',
                  'requires-python': '==3.11.*',
                  'dependencies': [],
              },
              'tool': {
                  'pytest': {
                      'ini_options': {
                          'pythonpath': ['src', '.'],
                          'addopts': ['--tb=short', '-p', 'no:cacheprovider'],
                      }
                  },
                  'mutmut': {
                      'paths_to_mutate': [
                          'src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine.py',
                          'src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine_models.py',
                          'src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine_validation.py',
                      ],
                      'pytest_add_cli_args_test_selection': mutation_test_selection,
                      'also_copy': dependency_files + [
                          'config/', 'data/audit/', 'contracts/', 'tests/fixtures/'
                      ],
                      'mutate_only_covered_lines': True,
                      'timeout_factor': 8.0,
                      'do_not_mutate_patterns': [r'raise \\w+', r'logger\\.\\w+'],
                  },
              },
          }
          (root / 'pyproject.toml').write_text(toml.dumps(config), encoding='utf-8')
          PY
      - name: Run deterministic mutation analysis and enforce score
        run: |
          set -euo pipefail
          mkdir -p reports/lot45/mutation
          cd .tmp-lot45-mutants
          set +e
          mutmut run --max-children 1 2>&1 | tee ../reports/lot45/mutation/run.txt
          run_status=${PIPESTATUS[0]}
          mutmut results 2>&1 | tee ../reports/lot45/mutation/results.txt
          results_status=${PIPESTATUS[0]}
          set -e
          cd ..
          RUN_STATUS="$run_status" RESULTS_STATUS="$results_status" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          path = Path('reports/lot45/mutation/run.txt')
          if not path.is_file():
              raise SystemExit('LOT45_MUTATION_RUN_LOG_MISSING')
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])', '', text)
          text = text.replace('\r', '\n').replace('\ufe0f', '')
          complete = [
              tuple(map(int, match.groups()))
              for match in re.finditer(r'(\d+)\s*/\s*(\d+)', text)
              if match.group(1) == match.group(2) and int(match.group(2)) > 0
          ]
          if not complete:
              raise SystemExit('LOT45_MUTATION_TOTAL_PARSE_ERROR')
          completed, total = complete[-1]
          patterns = {
              'killed': re.compile(r'🎉\s*(\d+)'),
              'timeout': re.compile(r'⏰\s*(\d+)'),
              'suspicious': re.compile(r'🤔\s*(\d+)'),
              'survived': re.compile(r'🙁\s*(\d+)'),
          }
          metrics = {}
          for name, pattern in patterns.items():
              matches = list(pattern.finditer(text))
              if not matches:
                  raise SystemExit(f'LOT45_MUTATION_{name.upper()}_PARSE_ERROR')
              metrics[name] = int(matches[-1].group(1))
          killed = metrics['killed']
          timeout = metrics['timeout']
          suspicious = metrics['suspicious']
          survived = metrics['survived']
          evaluated = killed + timeout + suspicious + survived
          if evaluated != total:
              raise SystemExit(f'LOT45_MUTATION_COUNT_MISMATCH:{total}:{evaluated}')
          score = 100.0 * killed / evaluated
          pass_status = (
              score >= 80.0
              and timeout == 0
              and suspicious == 0
              and int(os.environ['RUN_STATUS']) == 0
              and int(os.environ['RESULTS_STATUS']) == 0
          )
          payload = {
              'schema_version': 'lot45-mutation-summary-v1',
              'status': 'PASS' if pass_status else 'FAIL',
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'max_children': 1,
              'python_hash_seed': os.environ['PYTHONHASHSEED'],
              'killed_mutants': killed,
              'timeout_mutants': timeout,
              'suspicious_mutants': suspicious,
              'survived_mutants': survived,
              'evaluated_mutants': evaluated,
              'completed_mutants': completed,
              'total_mutants': total,
              'mutation_score_percent': round(score, 2),
              'minimum_score_percent': 80.0,
              'mutmut_run_exit_code': int(os.environ['RUN_STATUS']),
              'mutmut_results_exit_code': int(os.environ['RESULTS_STATUS']),
          }
          Path('reports/lot45/mutation_summary.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          if not pass_status:
              raise SystemExit('LOT45_MUTATION_ASSURANCE_FAILED')
          PY
      - name: Verify canonical source immutability
        run: |
          set -euo pipefail
          rm -rf .tmp-lot45-mutants
          git diff --exit-code -- \
            src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine.py \
            src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine_models.py \
            src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot45-mutation-evidence
          path: |
            reports/lot45/mutation/
            reports/lot45/mutation_summary.json
