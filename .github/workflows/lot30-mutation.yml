name: Lot 30 critical mutation assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/crypto_quant_bot/market_analysis/v2_market_analysis_closure*.py'
      - 'tests/test_lot30_*.py'
      - '.github/workflows/lot30-mutation.yml'
      - 'requirements-dev.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Build isolated Lot 30 mutation workspace
        run: |
          rm -rf .tmp-lot30-mutants reports/lot30/mutation
          mkdir -p \
            .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis \
            .tmp-lot30-mutants/tests \
            reports/lot30/mutation
          cp src/crypto_quant_bot/__init__.py .tmp-lot30-mutants/src/crypto_quant_bot/
          : > .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis/__init__.py
          cp src/crypto_quant_bot/market_analysis/alignment_common.py .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis/
          cp src/crypto_quant_bot/market_analysis/alignment_io.py .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis/
          cp src/crypto_quant_bot/market_analysis/v2_replay_audit_models.py .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis/
          cp src/crypto_quant_bot/market_analysis/v2_deterministic_replay_and_audit.py .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis/
          cp src/crypto_quant_bot/market_analysis/v2_market_analysis_closure.py .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis/
          cp src/crypto_quant_bot/market_analysis/v2_market_analysis_closure_models.py .tmp-lot30-mutants/src/crypto_quant_bot/market_analysis/
          cp tests/test_lot30_v2_market_analysis_closure.py .tmp-lot30-mutants/tests/
          cp tests/test_lot30_mutation_oracles.py .tmp-lot30-mutants/tests/
          cp tests/test_lot30_validation_boundaries.py .tmp-lot30-mutants/tests/
          cat > .tmp-lot30-mutants/pyproject.toml <<'TOML'
          [project]
          name = "crypto-quant-bot"
          version = "0.30.0.dev0"
          requires-python = "==3.11.*"
          dependencies = []

          [tool.pytest.ini_options]
          pythonpath = ["src", "."]
          addopts = ["--tb=short", "-p", "no:cacheprovider"]

          [tool.mutmut]
          paths_to_mutate = [
            "src/crypto_quant_bot/market_analysis/v2_market_analysis_closure.py",
            "src/crypto_quant_bot/market_analysis/v2_market_analysis_closure_models.py",
          ]
          tests_dir = ["tests/"]
          runner = "python -m pytest -q tests/test_lot30_*.py"
          also_copy = [
            "src/crypto_quant_bot/__init__.py",
            "src/crypto_quant_bot/market_analysis/__init__.py",
            "src/crypto_quant_bot/market_analysis/alignment_common.py",
            "src/crypto_quant_bot/market_analysis/alignment_io.py",
            "src/crypto_quant_bot/market_analysis/v2_replay_audit_models.py",
            "src/crypto_quant_bot/market_analysis/v2_deterministic_replay_and_audit.py",
          ]
          mutate_only_covered_lines = true
          timeout_factor = 8.0
          TOML
      - name: Run mutation suite
        shell: bash
        run: |
          set -o pipefail
          cd .tmp-lot30-mutants
          mutmut run 2>&1 | tee ../reports/lot30/mutation/run.txt
          mutmut results 2>&1 | tee ../reports/lot30/mutation/results.txt || true
      - name: Enforce mutation score
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('reports/lot30/mutation/run.txt')
          if not path.is_file():
              raise SystemExit('LOT30_MUTATION_RUN_LOG_MISSING')
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          text = text.replace('\r', '\n').replace('\ufe0f', '')
          counter_pattern = re.compile(r'(\d+)\s*/\s*(\d+)')
          summary_pattern = re.compile(
              r'🎉\s*(\d+)[\s\S]*?⏰\s*(\d+)[\s\S]*?🤔\s*(\d+)[\s\S]*?🙁\s*(\d+)'
          )
          parsed = None
          for counter in reversed(list(counter_pattern.finditer(text))):
              completed, total = map(int, counter.groups())
              if completed != total or total <= 0:
                  continue
              summary = summary_pattern.search(text, counter.end())
              if summary is None:
                  continue
              killed, timeout, suspicious, survived = map(int, summary.groups())
              if killed + timeout + suspicious + survived == total:
                  parsed = (completed, total, killed, timeout, suspicious, survived)
                  break
          if parsed is None:
              raise SystemExit('LOT30_MUTATION_SCORE_PARSE_ERROR')
          completed, total, killed, timeout, suspicious, survived = parsed
          evaluated = killed + timeout + suspicious + survived
          score = 100.0 * (killed + timeout) / evaluated
          payload = {
              'schema_version': 'lot30-critical-mutation-score-v1',
              'scope': 'v2_market_analysis_closure',
              'killed': killed,
              'timeout': timeout,
              'survived': survived,
              'suspicious': suspicious,
              'evaluated': evaluated,
              'completed': completed,
              'total': total,
              'score_percent': round(score, 2),
              'minimum_score_percent': 80.0,
              'status': 'PASS' if score >= 80.0 else 'FAIL',
          }
          output = Path('reports/lot30/mutation/score.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          if score < 80.0:
              raise SystemExit('LOT30_MUTATION_BELOW_80_PERCENT')
          PY
      - name: Verify canonical source immutability
        run: |
          rm -rf .tmp-lot30-mutants
          git diff --exit-code -- src/crypto_quant_bot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot30-critical-mutation-evidence
          path: reports/lot30/mutation/
