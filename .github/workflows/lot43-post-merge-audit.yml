name: Lot 43 independent post-merge audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot43-post-merge-audit.yml'
      - 'scripts/validate_lot43_post_merge.py'
      - 'data/audit/roadmap_lifecycle_overlay_lot43.json'
      - 'docs/LOT_43_POST_MERGE_AUDIT.md'
      - 'docs/LOT43_POST_MERGE_VALIDATION_MATRIX.md'
      - 'data/audit/book_resilience_and_replenishment_engine_lot43.json'
      - 'data/audit/book_resilience_and_replenishment_engine_audit_lot43.json'
      - 'data/audit/book_resilience_state_lot43.json'
      - 'reports/lot43/**'
      - 'src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine.py'
      - 'src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_models.py'
      - 'src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_validation.py'
      - 'src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_analysis.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      SOURCE_HEAD_SHA: d45f40aec90b26dd1278ec2f49b405fa5b2ed94e
      EVIDENCE_HEAD_SHA: 76c0670d7933f29965306993ff217647def0f0d4
      IMPLEMENTATION_MERGE_SHA: 0b524b1478272e0a69a06b50c68b1b2c3b092964
      POST_MERGE_AUDIT_SHA: 7a207a16e7aa543f9f7c241828f8ea5ae9ed0407
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove closed Lot 43 source and evidence remain immutable
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$POST_MERGE_AUDIT_SHA" HEAD
          git diff --quiet "$SOURCE_HEAD_SHA" HEAD -- \
            config/microstructure/book_resilience_and_replenishment_engine_v1.json \
            contracts/schemas/book_resilience_state_v1.schema.json \
            contracts/schemas/book_resilience_replenishment_engine_state_v1.schema.json \
            contracts/schemas/book_resilience_replenishment_engine_audit_v1.schema.json \
            src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine.py \
            src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_models.py \
            src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_validation.py \
            src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_analysis.py \
            scripts/run_lot43_book_resilience_and_replenishment_engine.py \
            scripts/validate_lot43.py scripts/validate_lot43_no_connectivity.py \
            docs/LOT_43_BOOK_RESILIENCE_AND_REPLENISHMENT_ENGINE.md \
            docs/ACCEPTANCE_CRITERIA_LOT_43.md
          git diff --quiet "$EVIDENCE_HEAD_SHA" HEAD -- \
            data/audit/book_resilience_and_replenishment_engine_lot43.json \
            data/audit/book_resilience_and_replenishment_engine_audit_lot43.json \
            data/audit/book_resilience_state_lot43.json \
            reports/lot43/coverage_summary.json reports/lot43/mutation_summary.json
      - name: Replay merged Lot 43 post-merge decision historically
        run: |
          set -euo pipefail
          rm -rf /tmp/lot43-post-merge-certified
          git worktree add --detach /tmp/lot43-post-merge-certified "$POST_MERGE_AUDIT_SHA"
          trap 'git worktree remove --force /tmp/lot43-post-merge-certified >/dev/null 2>&1 || true' EXIT
          (
            cd /tmp/lot43-post-merge-certified
            PYTHONPATH=src python scripts/validate_lot43_post_merge.py \
              | tee /tmp/lot43-post-merge-validation.json
            grep -F '"verdict": "GO_LOT43_POST_MERGE"' /tmp/lot43-post-merge-validation.json
          )
          git worktree remove --force /tmp/lot43-post-merge-certified
          trap - EXIT
      - name: Current architecture and security regression
        run: |
          set -euo pipefail
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          bandit -q -r scripts/validate_lot43_post_merge.py -ll
          pip-audit -r requirements-dev.lock
