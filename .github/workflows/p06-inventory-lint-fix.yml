name: P0.6 inventory lint fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p06-final-pre-lot26-assurance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p06-final-pre-lot26-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - run: python -m pip install ruff==0.12.0
      - name: Apply explicit safe modernization
        run: ruff check --fix --unsafe-fixes scripts/quality_inventory.py
      - name: Verify registry identity is unchanged
        run: python scripts/validate_engineering_deviations.py
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/quality_inventory.py
          git commit -m 'Apply P0.6 inventory Ruff correction'
          git push origin HEAD:agent/p06-final-pre-lot26-assurance
