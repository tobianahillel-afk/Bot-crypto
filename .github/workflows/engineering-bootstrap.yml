name: Engineering Bootstrap

on:
  push:
    branches:
      - engineering/bootstrap-development-engine
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: engineering-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Compile governance scripts
        run: python -m compileall -q scripts/governance

      - name: Validate canonical state
        run: python scripts/governance/validate_bootstrap_state.py

      - name: Validate work-item set
        run: python scripts/governance/validate_work_item.py

      - name: Validate Agent Work Unit contract
        run: python scripts/governance/validate_agent_work_unit.py

      - name: Run Agent Work Unit adversarial self-tests
        run: python scripts/governance/selftest_agent_work_unit.py

      - name: Validate Agent Work Unit dependency DAG
        run: python scripts/governance/validate_agent_work_unit_graph.py

      - name: Run Agent Work Unit DAG adversarial self-tests
        run: python scripts/governance/selftest_agent_work_unit_graph.py

      - name: Validate deterministic AWU complexity
        run: python scripts/governance/validate_awu_complexity.py

      - name: Run AWU complexity adversarial self-tests
        run: python scripts/governance/selftest_awu_complexity.py

      - name: Validate mandatory AWU split decisions
        run: python scripts/governance/validate_awu_split.py

      - name: Run AWU split adversarial self-tests
        run: python scripts/governance/selftest_awu_split.py

      - name: Validate deterministic AWU risk classification
        run: python scripts/governance/validate_awu_risk.py

      - name: Run AWU risk adversarial self-tests
        run: python scripts/governance/selftest_awu_risk.py

      - name: Validate handoff
        run: python scripts/governance/validate_handoff.py

      - name: Validate repository truth registry
        run: python scripts/governance/validate_truth_registry.py

      - name: Validate permanent state design
        run: python scripts/governance/validate_permanent_state_design.py

      - name: Validate historical evidence protection
        run: python scripts/governance/validate_historical_evidence_protection.py

      - name: Validate canonical ENG-00 baseline
        run: python scripts/governance/validate_canonical_baseline.py

      - name: Validate permanent project-state schema
        run: python scripts/governance/validate_project_state_schema.py

      - name: Validate permanent project state
        run: python scripts/governance/validate_project_state.py

      - name: Validate permanent state machine
        run: python scripts/governance/validate_project_state_machine.py

      - name: Run state-machine adversarial self-tests
        run: python scripts/governance/selftest_project_state_machine.py

      - name: Validate agent execution evidence policy
        run: python scripts/governance/validate_agent_evidence_policy.py

      - name: Run agent evidence adversarial self-tests
        run: python scripts/governance/selftest_agent_evidence_policy.py

      - name: Verify external state snapshot bindings
        run: python scripts/governance/verify_external_git_state.py --mode snapshot

      - name: Run external state-drift adversarial self-tests
        run: python scripts/governance/selftest_external_state_drift.py

      - name: Verify live external Git state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/governance/verify_external_git_state.py --mode github

      - name: Run negative validator self-tests
        run: python scripts/governance/selftest_bootstrap_validators.py

      - name: Enforce active work-item boundary
        run: python scripts/governance/validate_bootstrap_diff.py --base origin/main

      - name: Cold-start qualification
        run: python scripts/governance/cold_start_qualification.py
