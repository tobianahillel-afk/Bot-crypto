name: Engineering Bootstrap

on:
  push:
    branches:
      - engineering/bootstrap-development-engine
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: engineering-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Compile governance scripts
        run: python -m compileall -q scripts/governance

      - name: Validate canonical state
        run: python scripts/governance/validate_bootstrap_state.py

      - name: Validate work-item set
        run: python scripts/governance/validate_work_item.py

      - name: Validate Agent Work Unit contract
        run: python scripts/governance/validate_agent_work_unit.py

      - name: Run Agent Work Unit adversarial self-tests
        run: python scripts/governance/selftest_agent_work_unit.py

      - name: Validate Agent Work Unit dependency DAG
        run: python scripts/governance/validate_agent_work_unit_graph.py

      - name: Run Agent Work Unit DAG adversarial self-tests
        run: python scripts/governance/selftest_agent_work_unit_graph.py

      - name: Validate deterministic AWU complexity
        run: python scripts/governance/validate_awu_complexity.py

      - name: Run AWU complexity adversarial self-tests
        run: python scripts/governance/selftest_awu_complexity.py

      - name: Validate mandatory AWU split decisions
        run: python scripts/governance/validate_awu_split.py

      - name: Run AWU split adversarial self-tests
        run: python scripts/governance/selftest_awu_split.py

      - name: Validate deterministic AWU risk classification
        run: python scripts/governance/validate_awu_risk.py

      - name: Run AWU risk adversarial self-tests
        run: python scripts/governance/selftest_awu_risk.py

      - name: Validate AWU context routing and budgets
        run: python scripts/governance/validate_awu_context.py

      - name: Run AWU context adversarial self-tests
        run: python scripts/governance/selftest_awu_context.py

      - name: Validate handoff
        run: |
          python scripts/governance/validate_handoff.py
          python scripts/governance/validate_handoff.py --self-check

      - name: Validate repository truth registry
        run: python scripts/governance/validate_truth_registry.py

      - name: Validate permanent state design
        run: python scripts/governance/validate_permanent_state_design.py

      - name: Validate historical evidence protection
        run: python scripts/governance/validate_historical_evidence_protection.py

      - name: Validate canonical ENG-00 baseline
        run: python scripts/governance/validate_canonical_baseline.py

      - name: Validate permanent project-state schema
        run: python scripts/governance/validate_project_state_schema.py

      - name: Validate permanent project state
        run: python scripts/governance/validate_project_state.py

      - name: Validate permanent state machine
        run: python scripts/governance/validate_project_state_machine.py

      - name: Run state-machine adversarial self-tests
        run: python scripts/governance/selftest_project_state_machine.py

      - name: Validate agent execution evidence policy
        run: python scripts/governance/validate_agent_evidence_policy.py

      - name: Run agent evidence adversarial self-tests
        run: python scripts/governance/selftest_agent_evidence_policy.py

      - name: Verify external state snapshot bindings
        run: python scripts/governance/verify_external_git_state.py --mode snapshot

      - name: Run external state-drift adversarial self-tests
        run: python scripts/governance/selftest_external_state_drift.py

      - name: Verify live external Git state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/governance/verify_external_git_state.py --mode github

      - name: Run negative validator self-tests
        run: python scripts/governance/selftest_bootstrap_validators.py

      - name: Resolve active Agent Work Unit
        run: python scripts/governance/resolve_active_awu.py

      - name: Enforce active Agent Work Unit boundary
        run: python scripts/governance/validate_bootstrap_diff.py

      - name: Run active AWU scope adversarial self-tests
        run: python scripts/governance/selftest_active_awu_scope.py

      - name: Validate operational AWU dependency DAG
        run: python scripts/governance/validate_agent_work_unit_graph.py engineering/work_units/*.json

      - name: Validate deterministic diff classifier
        run: python scripts/governance/classify_diff.py --self-check

      - name: Run diff classifier adversarial self-tests
        run: python scripts/governance/selftest_diff_classifier.py

      - name: Validate deterministic diff impact mapping
        run: python scripts/governance/map_diff_impact.py --self-check

      - name: Run diff impact adversarial self-tests
        run: python scripts/governance/selftest_diff_impact.py

      - name: Run single-pass incremental validation
        run: python scripts/governance/run_incremental_validation.py

      - name: Run T0 adversarial self-tests
        run: python scripts/governance/selftest_t0.py

      - name: Run T1 adversarial self-tests
        run: python scripts/governance/selftest_t1.py

      - name: Run T2 adversarial self-tests
        run: python scripts/governance/selftest_t2.py

      - name: Run T3/T4 selector adversarial self-tests
        run: python scripts/governance/selftest_t3_t4_selector.py

      - name: Validate certification candidate lifecycle
        run: python scripts/governance/validate_certification_candidate_lifecycle.py

      - name: Run certification candidate lifecycle adversarial self-tests
        run: python scripts/governance/selftest_certification_candidate_lifecycle.py

      - name: Validate exact-head certification evidence binding
        run: python scripts/governance/validate_certification_exact_head_binding.py --self-check

      - name: Run exact-head certification binding adversarial self-tests
        run: python scripts/governance/selftest_certification_exact_head_binding.py

      - name: Validate risk-proportional certification deep assurance
        run: python scripts/governance/validate_certification_deep_assurance.py --self-check

      - name: Run certification deep assurance adversarial self-tests
        run: python scripts/governance/selftest_certification_deep_assurance.py

      - name: Validate canonical certification provenance
        run: python scripts/governance/validate_certification_provenance.py --self-check

      - name: Run certification provenance adversarial self-tests
        run: python scripts/governance/selftest_certification_provenance.py

      - name: Validate native certification attestation transport
        run: python scripts/governance/validate_certification_attestation_transport.py --self-check

      - name: Run native attestation transport adversarial self-tests
        run: python scripts/governance/selftest_certification_attestation_transport.py

      - name: Validate fail-closed certification promotion rules
        run: python scripts/governance/validate_certification_promotion.py --self-check

      - name: Run certification promotion adversarial self-tests
        run: python scripts/governance/selftest_certification_promotion.py

      - name: Run incremental validation adversarial self-tests
        run: python scripts/governance/selftest_incremental_validation.py

      - name: Validate generated current status
        run: python scripts/governance/render_current_status.py --check

      - name: Run current-status adversarial self-tests
        run: python scripts/governance/selftest_current_status.py

      - name: Validate documentation consistency
        run: python scripts/governance/validate_documentation_consistency.py

      - name: Run documentation consistency adversarial self-tests
        run: python scripts/governance/selftest_documentation_consistency.py

      - name: Validate generated context map
        run: python scripts/governance/render_context_map.py --check

      - name: Run context map adversarial self-tests
        run: python scripts/governance/selftest_context_map.py

      - name: Validate documentation tooling evaluation
        run: python scripts/governance/evaluate_documentation_tooling.py --check

      - name: Run documentation tooling evaluation adversarial self-check
        run: python scripts/governance/evaluate_documentation_tooling.py --self-check

      - name: Validate secret controls
        run: python scripts/governance/validate_secret_controls.py

      - name: Run secret control adversarial self-tests
        run: python scripts/governance/selftest_secret_controls.py

      - name: Validate dependency controls
        run: python scripts/governance/validate_dependency_controls.py

      - name: Run dependency control adversarial self-tests
        run: python scripts/governance/selftest_dependency_controls.py

      - name: Validate SAST controls
        run: python scripts/governance/validate_sast_controls.py

      - name: Run SAST control adversarial self-tests
        run: python scripts/governance/selftest_sast_controls.py

      - name: Validate workflow security controls
        run: python scripts/governance/validate_workflow_security_controls.py

      - name: Run workflow security adversarial self-tests
        run: python scripts/governance/selftest_workflow_security_controls.py

      - name: Validate action supply-chain controls
        run: python scripts/governance/audit_action_supply_chain.py --mode inventory

      - name: Run action supply-chain adversarial self-tests
        run: python scripts/governance/selftest_action_supply_chain.py

      - name: Validate approved action pin registry
        run: python scripts/governance/validate_action_pin_registry.py

      - name: Run action pin registry adversarial self-tests
        run: python scripts/governance/selftest_action_pin_registry.py

      - name: Validate workflow permission controls
        run: python scripts/governance/audit_workflow_permissions.py --mode inventory

      - name: Run workflow permission adversarial self-tests
        run: python scripts/governance/selftest_workflow_permissions.py

      - name: Validate repository protection policy
        run: python scripts/governance/validate_repository_protection.py --mode policy

      - name: Run repository protection adversarial self-tests
        run: python scripts/governance/selftest_repository_protection.py

      - name: Verify complete ENG-04 security engine
        run: python scripts/governance/verify_security_engine.py --check-evidence

      - name: Run security-engine adversarial self-tests
        run: python scripts/governance/selftest_security_engine.py

      - name: Validate exact-input proof reuse semantics
        run: python scripts/governance/proof_reuse.py --self-check

      - name: Run proof reuse adversarial self-tests
        run: python scripts/governance/selftest_proof_reuse.py

      - name: Qualify work decomposition engine
        run: python scripts/governance/qualify_work_decomposition.py

      - name: Resume/recovery qualification
        run: python scripts/governance/resume_recovery_qualification.py

      - name: Run resume/recovery adversarial self-tests
        run: python scripts/governance/selftest_resume_recovery.py

      - name: Cold-start qualification
        run: python scripts/governance/cold_start_qualification.py
