name: Lot 28 one-shot quality refactor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot28-one-shot-quality-refactor.yml'
      - 'scripts/refactor_lot28_quality.py'

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/lot28-explanation-core-why-not-trade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot28-explanation-core-why-not-trade
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: python -m pip install -r requirements-dev.lock
      - name: Apply controlled refactor
        run: python scripts/refactor_lot28_quality.py
      - name: Validate refactored Lot 28
        run: |
          python -m compileall -q src scripts tests
          ruff check --fix src/crypto_quant_bot/market_analysis/explanation_core*.py scripts/validate_lot28.py tests/test_lot28_*.py
          ruff check src/crypto_quant_bot/market_analysis/explanation_core*.py scripts/validate_lot28.py tests/test_lot28_*.py
          mypy src/crypto_quant_bot/market_analysis/explanation_core*.py
          pytest -q tests/test_lot28_*.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Commit validated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crypto_quant_bot/market_analysis/explanation_core*.py scripts/validate_lot28.py tests/test_lot28_*.py
          git diff --cached --quiet || git commit -m 'Lot28 remove new engineering deviations'
          git push origin HEAD:agent/lot28-explanation-core-why-not-trade
      # Second revision intentionally triggers execution.
