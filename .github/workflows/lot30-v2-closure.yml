name: Lot 30 V2 market analysis closure validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/closure/v2_market_analysis_closure_v1.json'
      - 'contracts/schemas/v2_market_analysis_closure_state_v1.schema.json'
      - 'src/crypto_quant_bot/market_analysis/v2_market_analysis_closure*.py'
      - 'scripts/*lot30*'
      - 'tests/test_lot30_*.py'
      - 'docs/*LOT_30*'
      - 'reports/*lot_30*'
      - 'data/audit/*lot30.json'
      - '.github/workflows/lot30-v2-closure.yml'
      - 'requirements-dev.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Compile lint type and schema checks
        run: |
          python -m compileall -q src scripts tests
          python -m json.tool config/closure/v2_market_analysis_closure_v1.json >/dev/null
          python -m json.tool contracts/schemas/v2_market_analysis_closure_state_v1.schema.json >/dev/null
          ruff check \
            src/crypto_quant_bot/market_analysis/v2_market_analysis_closure.py \
            src/crypto_quant_bot/market_analysis/v2_market_analysis_closure_models.py \
            scripts/run_lot30_v2_market_analysis_closure.py \
            scripts/validate_lot30.py \
            scripts/validate_all_until_lot30.py \
            scripts/diagnose_exact_chain_until_lot30.py \
            tests/test_lot30_*.py
          mypy \
            src/crypto_quant_bot/market_analysis/v2_market_analysis_closure.py \
            src/crypto_quant_bot/market_analysis/v2_market_analysis_closure_models.py
      - name: Targeted line and branch coverage
        run: |
          mkdir -p reports/lot30
          coverage erase
          pytest -q tests/test_lot30_*.py \
            --cov=crypto_quant_bot.market_analysis.v2_market_analysis_closure \
            --cov=crypto_quant_bot.market_analysis.v2_market_analysis_closure_models \
            --cov-branch \
            --cov-report=json:reports/lot30/coverage.json \
            --cov-report=term-missing
          python - <<'PY'
          import json
          from pathlib import Path
          totals = json.loads(Path('reports/lot30/coverage.json').read_text())['totals']
          lines = float(totals['percent_statements_covered'])
          branches = float(totals['percent_branches_covered'])
          print(f'Lot30 coverage: lines={lines:.2f}% branches={branches:.2f}%')
          if lines < 95.0 or branches < 90.0:
              raise SystemExit('LOT30_CRITICAL_COVERAGE_BELOW_THRESHOLD')
          PY
      - name: Exact V2 closure and deterministic replay
        env:
          CODE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/run_lot30_v2_market_analysis_closure.py --code-commit "$CODE_COMMIT"
          cp data/audit/v2_market_analysis_closure_lot30.json /tmp/lot30-state-run1.json
          cp data/audit/v2_market_analysis_closure_audit_lot30.json /tmp/lot30-audit-run1.json
          cp data/audit/closure_manifest_lot30.json /tmp/lot30-manifest-run1.json
          python scripts/validate_lot30.py
          python scripts/run_lot30_v2_market_analysis_closure.py --code-commit "$CODE_COMMIT"
          cmp /tmp/lot30-state-run1.json data/audit/v2_market_analysis_closure_lot30.json
          cmp /tmp/lot30-audit-run1.json data/audit/v2_market_analysis_closure_audit_lot30.json
          cmp /tmp/lot30-manifest-run1.json data/audit/closure_manifest_lot30.json
          python scripts/validate_lot30.py
          python scripts/diagnose_exact_chain_until_lot30.py --code-commit "$CODE_COMMIT"
      - name: Architecture traceability quality and security
        run: |
          python scripts/validate_lot29.py
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_domain_architecture.py
          python scripts/validate_traceability_contract.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          bandit -q -r \
            src/crypto_quant_bot/market_analysis/v2_market_analysis_closure.py \
            src/crypto_quant_bot/market_analysis/v2_market_analysis_closure_models.py
          pip-audit -r requirements-dev.lock
      - name: Full regression and anti-flake
        run: |
          pytest -q
          pytest -q tests/test_lot30_*.py
          pytest -q tests/test_lot30_*.py
          pytest -q tests/test_lot30_*.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot30-v2-closure-evidence
          path: |
            data/audit/*lot30.json
            reports/lot_30_v2_market_analysis_closure_report.md
            reports/lot30/
