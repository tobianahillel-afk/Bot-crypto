name: Development Engine V1 Exact Head Qualification

on:
  push:
    branches:
      - engineering/bootstrap-development-engine
    paths:
      - ".github/workflows/eng09-wu02-development-engine-v1-qualification.yml"
      - "scripts/governance/qualify_development_engine_v1_exact_head.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng09-wu02-v1-exact-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Development Engine V1 exact-head qualification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Validate Development Engine V1 candidate
        run: |
          python scripts/governance/validate_development_engine_v1_certification.py
          python scripts/governance/selftest_development_engine_v1_certification.py

      - name: Validate ENG-06 exact-head and deep-assurance primitives
        run: |
          python scripts/governance/validate_certification_exact_head_binding.py --self-check
          python scripts/governance/selftest_certification_exact_head_binding.py
          python scripts/governance/validate_certification_deep_assurance.py --self-check
          python scripts/governance/selftest_certification_deep_assurance.py

      - name: Emit Development Engine V1 exact-head qualification material
        run: python scripts/governance/qualify_development_engine_v1_exact_head.py
