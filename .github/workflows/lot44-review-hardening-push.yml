name: Lot 44 review hardening push

on:
  push:
    branches:
      - agent/lot44-trades-aggressor-classification-schema

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Retry temporary Lot 44 review hardening'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/lot44-trades-aggressor-classification-schema
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Apply review hardening
        run: |
          python scripts/_lot44_review_hardening.py
          sed -i 's/Lot 44 confidence policy ordering changed/Lot 44 v1 confidence policy constants changed/g' \
            tests/test_lot44_trades_and_aggressor_classification_schema.py
      - name: Validate hardening
        run: |
          set -euo pipefail
          ruff check \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema.py \
            src/crypto_quant_bot/microstructure/trades_and_aggressor_classification_schema_models.py \
            tests/test_lot44_trades_and_aggressor_classification_schema.py \
            tests/test_lot44_causal_guards.py
          mypy src/crypto_quant_bot/microstructure
          pytest -q \
            tests/test_lot44_trades_and_aggressor_classification_schema.py \
            tests/test_lot44_schema_contracts.py \
            tests/test_lot44_causal_guards.py
      - name: Commit hardening and remove temporary automation
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/lot44-review-hardening.yml \
            .github/workflows/lot44-review-hardening-push.yml \
            scripts/_lot44_review_hardening.py
          git config user.name "tobianahillel-afk"
          git config user.email "269188945+tobianahillel-afk@users.noreply.github.com"
          git add -A
          git commit -m "Harden Lot 44 runtime contract parity"
          git push origin HEAD:agent/lot44-trades-aggressor-classification-schema
