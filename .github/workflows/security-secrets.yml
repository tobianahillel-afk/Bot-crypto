# CI-BOOT-01 — registration proposal only; never a replacement for secret scanning.
# The real Gitleaks workflow is defined on the target non-default branch.
name: Security Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-only:
    name: Registration guard (not a Gitleaks result)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject default-branch stub execution
        shell: bash
        run: |
          echo "::error::Default-branch registration stub does not scan secrets."
          echo "::error::The branch-specific Gitleaks workflow must run and be verified on its exact head_sha."
          exit 1
