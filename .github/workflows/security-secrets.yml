name: Security Secrets

on:
  push:
    branches:
      - main
      - engineering/bootstrap-development-engine
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks pinned CLI
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITLEAKS_TAG: "v8.30.1"
      GITLEAKS_COMMIT: "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
      GITLEAKS_EXPECTED_VERSION: "8.30.1"
      PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
      PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
      PUSH_BEFORE_SHA: "${{ github.event.before }}"
      PUSH_HEAD_SHA: "${{ github.sha }}"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false

      - name: Build exact Gitleaks source
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/gitleaks-src"
          gitleaks_bin="${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          printf 'GITLEAKS_BIN=%s\n' "${gitleaks_bin}" >> "${GITHUB_ENV}"
          git clone --quiet --depth 1 --branch "${GITLEAKS_TAG}" https://github.com/gitleaks/gitleaks.git "${src}"
          actual="$(git -C "${src}" rev-parse HEAD)"
          test "${actual}" = "${GITLEAKS_COMMIT}"
          (
            cd "${src}"
            go build -trimpath \
              -ldflags "-X=github.com/zricethezav/gitleaks/v8/version.Version=${GITLEAKS_TAG}" \
              -o "${gitleaks_bin}" .
          )
          version="$("${gitleaks_bin}" version)"
          printf '%s\n' "${version}" | grep -F "${GITLEAKS_EXPECTED_VERSION}" >/dev/null

      - name: Prove detector catches a synthetic secret
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          cleanup() { rm -rf "${fixture_dir}"; }
          trap cleanup EXIT
          python - "${fixture_dir}/fixture.env" <<'PY'
          import sys
          from pathlib import Path

          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
          suffix = "".join(alphabet[(i * 17 + 5) % len(alphabet)] for i in range(36))
          token = "gh" + "p_" + suffix
          Path(sys.argv[1]).write_text("GITHUB_TOKEN=" + token + "\n", encoding="utf-8")
          PY
          set +e
          "${GITLEAKS_BIN}" dir             --config .gitleaks.toml             --gitleaks-ignore-path .gitleaksignore             --redact=100             --no-banner             --no-color             --timeout 30             "${fixture_dir}" >"${RUNNER_TEMP}/gitleaks-positive.log" 2>&1
          status=$?
          set -e
          if [ "${status}" -ne 1 ]; then
            cat "${RUNNER_TEMP}/gitleaks-positive.log"
            echo "Synthetic secret was not detected" >&2
            exit 1
          fi

      - name: Resolve routine Git range
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          mode="RANGE"
          base=""
          head=""

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${PUSH_HEAD_SHA}"
          fi

          if [ -z "${base}" ] || [ -z "${head}" ] || [ "${base}" = "${zero}" ]; then
            mode="FULL_HISTORY_FALLBACK"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            mode="FULL_HISTORY_FALLBACK"
          fi

          if [ "${mode}" = "RANGE" ]; then
            log_opts="${base}..${head}"
          else
            log_opts="--all"
          fi

          printf 'GITLEAKS_ROUTINE_MODE=%s\n' "${mode}" >> "${GITHUB_ENV}"
          printf 'GITLEAKS_ROUTINE_LOG_OPTS=%s\n' "${log_opts}" >> "${GITHUB_ENV}"
          printf 'GITLEAKS_ROUTINE_MODE=%s\n' "${mode}"
          printf 'GITLEAKS_ROUTINE_LOG_OPTS=%s\n' "${log_opts}"

      - name: Scan introduced Git range
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-range.json"
          set +e
          "${GITLEAKS_BIN}" git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact=100 --no-banner --no-color --timeout 120 --log-opts="${GITLEAKS_ROUTINE_LOG_OPTS}" --report-format json --report-path "${report}" .
          status=$?
          set -e
          python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          findings = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          print(f"GITLEAKS_RANGE_FINDINGS={len(findings)}")
          for index, finding in enumerate(findings, 1):
              safe = {
                  "index": index,
                  "rule_id": finding.get("RuleID"),
                  "file": finding.get("File"),
                  "start_line": finding.get("StartLine"),
                  "commit": finding.get("Commit"),
                  "fingerprint": finding.get("Fingerprint"),
              }
              print(json.dumps(safe, sort_keys=True))
          path.unlink(missing_ok=True)
          PY
          printf 'GITLEAKS_RANGE_STATUS=%s\n' "${status}" >> "${GITHUB_ENV}"

      - name: Scan current repository tree
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-current.json"
          set +e
          "${GITLEAKS_BIN}" dir --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact=100 --no-banner --no-color --timeout 120 --report-format json --report-path "${report}" .
          status=$?
          set -e
          python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          findings = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          print(f"GITLEAKS_CURRENT_FINDINGS={len(findings)}")
          for index, finding in enumerate(findings, 1):
              safe = {
                  "index": index,
                  "rule_id": finding.get("RuleID"),
                  "file": finding.get("File"),
                  "start_line": finding.get("StartLine"),
                  "fingerprint": finding.get("Fingerprint"),
              }
              print(json.dumps(safe, sort_keys=True))
          path.unlink(missing_ok=True)
          PY
          printf 'GITLEAKS_CURRENT_STATUS=%s\n' "${status}" >> "${GITHUB_ENV}"

      - name: Scan full Git history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-history.json"
          set +e
          "${GITLEAKS_BIN}" git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact=100 --no-banner --no-color --timeout 120 --report-format json --report-path "${report}" .
          status=$?
          set -e
          python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          findings = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          print(f"GITLEAKS_HISTORY_FINDINGS={len(findings)}")
          for index, finding in enumerate(findings, 1):
              safe = {
                  "index": index,
                  "rule_id": finding.get("RuleID"),
                  "file": finding.get("File"),
                  "start_line": finding.get("StartLine"),
                  "commit": finding.get("Commit"),
                  "fingerprint": finding.get("Fingerprint"),
              }
              print(json.dumps(safe, sort_keys=True))
          path.unlink(missing_ok=True)
          PY
          printf 'GITLEAKS_HISTORY_STATUS=%s\n' "${status}" >> "${GITHUB_ENV}"

      - name: Enforce clean secret scans
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push|pull_request)
              test "${GITLEAKS_RANGE_STATUS}" = "0"
              ;;
            schedule|workflow_dispatch)
              test "${GITLEAKS_CURRENT_STATUS}" = "0"
              test "${GITLEAKS_HISTORY_STATUS}" = "0"
              ;;
            *)
              echo "Unsupported Security Secrets event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
