name: Security Secrets

on:
  push:
    branches:
      - main
      - engineering/bootstrap-development-engine
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks pinned CLI
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITLEAKS_TAG: "v8.30.1"
      GITLEAKS_COMMIT: "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
      GITLEAKS_EXPECTED_VERSION: "8.30.1"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false

      - name: Build exact Gitleaks source
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/gitleaks-src"
          gitleaks_bin="${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          printf 'GITLEAKS_BIN=%s\n' "${gitleaks_bin}" >> "${GITHUB_ENV}"
          git clone --quiet --depth 1 --branch "${GITLEAKS_TAG}" https://github.com/gitleaks/gitleaks.git "${src}"
          actual="$(git -C "${src}" rev-parse HEAD)"
          test "${actual}" = "${GITLEAKS_COMMIT}"
          (
            cd "${src}"
            go build -trimpath -o "${gitleaks_bin}" .
          )
          version="$("${gitleaks_bin}" version)"
          printf '%s\n' "${version}" | grep -F "${GITLEAKS_EXPECTED_VERSION}" >/dev/null

      - name: Prove detector catches a synthetic secret
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          cleanup() { rm -rf "${fixture_dir}"; }
          trap cleanup EXIT
          python - "${fixture_dir}/fixture.env" <<'PY'
          import sys
          from pathlib import Path

          token = "gh" + "p_" + ("A" * 36)
          Path(sys.argv[1]).write_text("GITHUB_TOKEN=" + token + "\n", encoding="utf-8")
          PY
          set +e
          "${GITLEAKS_BIN}" dir             --config .gitleaks.toml             --redact=100             --no-banner             --no-color             --timeout 30             "${fixture_dir}" >"${RUNNER_TEMP}/gitleaks-positive.log" 2>&1
          status=$?
          set -e
          if [ "${status}" -ne 1 ]; then
            cat "${RUNNER_TEMP}/gitleaks-positive.log"
            echo "Synthetic secret was not detected" >&2
            exit 1
          fi

      - name: Scan current repository tree
        shell: bash
        run: |
          set -euo pipefail
          "${GITLEAKS_BIN}" dir             --config .gitleaks.toml             --redact=100             --no-banner             --no-color             --timeout 120             .

      - name: Scan full Git history
        shell: bash
        run: |
          set -euo pipefail
          "${GITLEAKS_BIN}" git             --config .gitleaks.toml             --redact=100             --no-banner             --no-color             --timeout 120             .
