name: Lot 36 independent post-merge audit and V3 closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/LOT_36_POST_MERGE_AUDIT.md'
      - 'docs/LOT36_POST_MERGE_VALIDATION_MATRIX.md'
      - 'data/audit/roadmap_lifecycle_overlay_lot36.json'
      - 'data/audit/freshness_gap_outage_audit_and_v3_closure_lot36.json'
      - 'data/audit/freshness_gap_outage_audit_and_v3_closure_audit_lot36.json'
      - 'data/audit/closure_manifest_lot36.json'
      - 'data/audit/replay_evidence_lot36.json'
      - 'reports/lot36/coverage_summary.json'
      - 'reports/lot36/mutation_summary.json'
      - 'scripts/validate_lot36.py'
      - 'scripts/validate_lot36_no_connectivity.py'
      - 'scripts/validate_all_until_lot36.py'
      - 'tests/test_lot36_post_merge_state.py'
      - '.github/workflows/lot36-post-merge-audit.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove historical merge ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 87da195283797247505e4fc650214e33e759e21a HEAD
          git cat-file -e b3680f5da0a3fd98fdedc31599c829dc60808290^{commit}
          git cat-file -e 16f3454c6f912f3f00f79836950047b15687abce^{commit}
      - name: Compile lint type and immutable Lot 36 evidence
        run: |
          python -m compileall -q src scripts tests
          ruff check \
            scripts/validate_lot36.py \
            scripts/validate_lot36_no_connectivity.py \
            scripts/validate_all_until_lot36.py \
            tests/test_lot36_post_merge_state.py
          mypy src/crypto_quant_bot
          python scripts/validate_lot36.py
          python scripts/validate_lot36_no_connectivity.py
          python scripts/validate_all_until_lot36.py
          pytest -q tests/test_lot36_post_merge_state.py
      - name: Architecture roadmap traceability and engineering
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Full regression and archived anti-flake
        run: |
          pytest -q
          pytest -q tests/test_lot36_post_merge_state.py
          pytest -q tests/test_lot36_post_merge_state.py
          pytest -q tests/test_lot36_post_merge_state.py
      - name: Security and immutable evidence final checks
        run: |
          bandit -q -r src -ll
          pip-audit -r requirements-dev.lock
          python scripts/validate_lot36.py
          python scripts/validate_lot36_no_connectivity.py
          pytest -q tests/test_lot36_post_merge_state.py
