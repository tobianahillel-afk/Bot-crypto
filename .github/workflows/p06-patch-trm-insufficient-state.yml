name: P0.6 patch TRM insufficient state

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p06-final-pre-lot26-assurance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p06-final-pre-lot26-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Apply TRM insufficient-state correction
        run: python scripts/patch_p06_trm_insufficient_state.py
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'TRM fix already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crypto_quant_bot/market_analysis/trend_range_momentum.py
          git add scripts/validate_pre_lot26_readiness.py
          git commit -m 'Fix TRM insufficient-data state matching'
          git push origin HEAD:agent/p06-final-pre-lot26-assurance
