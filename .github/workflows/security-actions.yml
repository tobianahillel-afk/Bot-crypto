# ENG-09.3-WU03 evidence anchor: exact-digest changed-workflow syntax + diff-local offline security gate.
name: Security Actions

on:
  pull_request:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/actions/**"
      - "config/governance/workflow_security_policy_v1.json"
      - "scripts/governance/validate_workflow_security_controls.py"
      - "scripts/governance/filter_zizmor_changed_findings.py"
      - "scripts/governance/selftest_zizmor_changed_findings.py"
      - "scripts/governance/selftest_workflow_security_controls.py"
  push:
    branches:
      - main
      - engineering/bootstrap-development-engine
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/actions/**"
      - "config/governance/workflow_security_policy_v1.json"
      - "scripts/governance/validate_workflow_security_controls.py"
      - "scripts/governance/filter_zizmor_changed_findings.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint changed workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_ASSET: "actionlint_1.7.12_linux_amd64.tar.gz"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
      PUSH_BEFORE_SHA: "${{ github.event.before }}"
      ZIZMOR_VERSION: "1.30.1"
      ZIZMOR_ASSET: "zizmor-x86_64-unknown-linux-gnu.tar.gz"
      ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact actionlint release
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${ACTIONLINT_ASSET}"
          bin_dir="${RUNNER_TEMP}/actionlint-bin"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ASSET}"
          curl --fail --location --silent --show-error "${url}" --output "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" actionlint
          printf 'ACTIONLINT_BIN=%s\n' "${bin_dir}/actionlint" >> "${GITHUB_ENV}"
          version="$("${bin_dir}/actionlint" -version)"
          printf '%s\n' "${version}" | grep -F "${ACTIONLINT_VERSION}" >/dev/null

      - name: Prove actionlint rejects malformed workflow
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp)"
          cleanup() { rm -f "${fixture}"; }
          trap cleanup EXIT
          cat >"${fixture}" <<'YAML'
          name: invalid-positive-control
          on:
            push:
              branch: main
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo test
          YAML
          set +e
          "${ACTIONLINT_BIN}" "${fixture}" >"${RUNNER_TEMP}/actionlint-positive.log" 2>&1
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            cat "${RUNNER_TEMP}/actionlint-positive.log"
            echo "actionlint positive control unexpectedly passed" >&2
            exit 1
          fi

      - name: Install exact zizmor release
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${ZIZMOR_ASSET}"
          bin_dir="${RUNNER_TEMP}/zizmor-bin"
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${ZIZMOR_ASSET}"
          curl --fail --location --silent --show-error "${url}" --output "${archive}"
          printf '%s  %s\n' "${ZIZMOR_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" zizmor
          printf 'ZIZMOR_BIN=%s\n' "${bin_dir}/zizmor" >> "${GITHUB_ENV}"
          version="$("${bin_dir}/zizmor" --version)"
          printf '%s\n' "${version}" | grep -F "${ZIZMOR_VERSION}" >/dev/null

      - name: Prove zizmor rejects dangerous workflow
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp --suffix=.yml)"
          report="${RUNNER_TEMP}/zizmor-positive.json"
          cleanup() { rm -f "${fixture}" "${report}"; }
          trap cleanup EXIT
          python - "${fixture}" <<'PY'
          import sys
          from pathlib import Path

          expression = "$" + "{{ github.event.pull_request.title }}"
          trigger = "pull_request" + "_target"
          permission = "contents" + ": write"
          text = """name: insecure-positive-control
          on: TRIGGER
          jobs:
            dangerous:
              runs-on: ubuntu-latest
              permissions:
                PERMISSION
              steps:
                - run: echo \"EXPRESSION\"
          """
          text = text.replace("TRIGGER", trigger).replace("PERMISSION", permission)
          Path(sys.argv[1]).write_text(text.replace("EXPRESSION", expression), encoding="utf-8")
          PY
          set +e
          ZIZMOR_OFFLINE=1 "${ZIZMOR_BIN}" --offline --strict-collection --no-config --format=json-v1 "${fixture}" >"${report}"
          status=$?
          set -e
          python - "${report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          findings = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"ZIZMOR_POSITIVE_FINDINGS={len(findings)}")
          if not findings:
              raise SystemExit("ZIZMOR_POSITIVE_CONTROL_NOT_DETECTED")
          PY
          if [ "${status}" -eq 0 ]; then
            echo "zizmor positive control unexpectedly passed" >&2
            exit 1
          fi

      - name: Discover changed workflow security targets
        shell: bash
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          event="${GITHUB_EVENT_NAME}"
          base=""
          workflow_file="${RUNNER_TEMP}/workflow-targets.txt"
          security_file="${RUNNER_TEMP}/workflow-security-targets.txt"

          if [ "${event}" = "pull_request" ] && [ -n "${PR_BASE_SHA}" ]; then
            base="$(git merge-base "${PR_BASE_SHA}" HEAD)"
          elif [ "${event}" = "push" ] && [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "${zero}" ]; then
            base="${PUSH_BEFORE_SHA}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          fi

          if [ -n "${base}" ]; then
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "${base}...HEAD" -- .github | sort -u)
          else
            mapfile -t changed < <(git ls-files .github | sort -u)
          fi

          workflows=()
          security_targets=()
          for path in "${changed[@]}"; do
            case "${path}" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                workflows+=("${path}")
                security_targets+=("${path}")
                ;;
              .github/actions/*/action.yml|.github/actions/*/action.yaml)
                security_targets+=("${path}")
                ;;
            esac
          done
          printf '%s\n' "${workflows[@]}" >"${workflow_file}"
          printf '%s\n' "${security_targets[@]}" >"${security_file}"
          {
            printf 'WORKFLOW_TARGET_FILE=%s\n' "${workflow_file}"
            printf 'WORKFLOW_SECURITY_TARGET_FILE=%s\n' "${security_file}"
            printf 'WORKFLOW_SECURITY_BASE=%s\n' "${base}"
          } >> "${GITHUB_ENV}"
          printf 'ACTIONLINT_TARGET_COUNT=%s\n' "${#workflows[@]}"
          printf 'ZIZMOR_TARGET_COUNT=%s\n' "${#security_targets[@]}"
          if (("${#workflows[@]}" > 0)); then printf 'ACTIONLINT_TARGET=%s\n' "${workflows[@]}"; fi
          if (("${#security_targets[@]}" > 0)); then printf 'ZIZMOR_TARGET=%s\n' "${security_targets[@]}"; fi

      - name: Lint changed workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(sed '/^$/d' "${WORKFLOW_TARGET_FILE}")
          if (("${#targets[@]}" == 0)); then
            echo "No changed workflow definitions"
            exit 0
          fi
          "${ACTIONLINT_BIN}" "${targets[@]}"

      - name: Run changed-finding filter selftests
        run: python scripts/governance/selftest_zizmor_changed_findings.py

      - name: Audit changed workflows and actions with zizmor
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(sed '/^$/d' "${WORKFLOW_SECURITY_TARGET_FILE}")
          if (("${#targets[@]}" == 0)); then
            echo "No changed workflow/action definitions"
            exit 0
          fi
          report="${RUNNER_TEMP}/zizmor-findings.json"
          cleanup() { rm -f "${report}"; }
          trap cleanup EXIT
          set +e
          ZIZMOR_OFFLINE=1 "${ZIZMOR_BIN}" --offline --strict-collection --no-config --format=json-v1 "${targets[@]}" >"${report}"
          status=$?
          set -e
          python scripts/governance/filter_zizmor_changed_findings.py \
            --report "${report}" \
            --base "${WORKFLOW_SECURITY_BASE}" \
            --head HEAD \
            --targets-file "${WORKFLOW_SECURITY_TARGET_FILE}" \
            --zizmor-status "${status}"
