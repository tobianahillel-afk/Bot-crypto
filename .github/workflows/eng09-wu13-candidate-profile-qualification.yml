name: ENG09 WU13 Candidate Profile Qualification

on:
  push:
    branches:
      - engineering/bootstrap-development-engine
    paths:
      - "config/governance/mutation_candidate_profile_policy_v1.json"
      - "config/governance/mutation_candidate_profiles_v1.json"
      - "scripts/governance/validate_mutation_candidate_profiles.py"
      - "scripts/governance/select_mutation_candidate_profile.py"
      - "scripts/governance/selftest_mutation_candidate_profiles.py"
      - "engineering/work_units/ENG-09.3-WU13.json"
      - ".github/workflows/eng09-wu13-candidate-profile-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng09-wu13-candidate-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Read-only Lot45 candidate profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: false

      - name: Validate candidate profile
        run: python scripts/governance/validate_mutation_candidate_profiles.py

      - name: Run candidate profile adversarial selftests
        run: python scripts/governance/selftest_mutation_candidate_profiles.py

      - name: Qualify candidate selector without execution
        shell: bash
        run: |
          set -euo pipefail
          result="$(
            python scripts/governance/select_mutation_candidate_profile.py               --path src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine.py
          )"
          printf '%s\n' "${result}"
          python - "${result}" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          assert payload["selected_candidates"] == ["LOT45_ORDER_FLOW_DELTA_CVD"]
          assert payload["qualification_only"] is True
          assert payload["production_selector_visible"] is False
          assert payload["active_registry_adopted"] is False
          assert payload["execution_allowed"] is False
          assert payload["mutation_executed"] is False
          print("LOT45_CANDIDATE_SELECTOR_QUALIFICATION_PASS")
          PY
