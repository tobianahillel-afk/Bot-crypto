name: Lot 37 microstructure scope and offline contracts validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/microstructure/microstructure_scope_offline_data_contracts_v1.json'
      - 'contracts/schemas/microstructure_offline_l2_input_v1.schema.json'
      - 'contracts/schemas/microstructure_offline_trade_input_v1.schema.json'
      - 'contracts/schemas/microstructure_scope_offline_data_contracts_state_v1.schema.json'
      - 'contracts/schemas/microstructure_scope_offline_data_contracts_audit_v1.schema.json'
      - 'contracts/schemas/microstructure_scope_offline_data_contracts_contract_registry_v1.schema.json'
      - 'contracts/schemas/microstructure_scope_offline_data_contracts_capability_matrix_v1.schema.json'
      - 'src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts.py'
      - 'src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_models.py'
      - 'src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_validation.py'
      - 'scripts/run_lot37_microstructure_scope_and_offline_data_contracts.py'
      - 'scripts/validate_lot37.py'
      - 'scripts/validate_lot37_frozen_evidence.py'
      - 'tests/test_lot37_microstructure_scope_and_offline_data_contracts.py'
      - 'tests/test_lot37_branch_coverage.py'
      - 'docs/LOT_37_MICROSTRUCTURE_SCOPE_AND_OFFLINE_DATA_CONTRACTS.md'
      - 'docs/ACCEPTANCE_CRITERIA_LOT_37.md'
      - 'reports/lot_37_microstructure_scope_and_offline_data_contracts_report.md'
      - 'reports/lot37/coverage_summary.json'
      - 'reports/lot37/mutation_summary.json'
      - 'data/audit/microstructure_scope_and_offline_data_contracts_lot37.json'
      - 'data/audit/microstructure_scope_and_offline_data_contracts_audit_lot37.json'
      - 'data/audit/microstructure_contract_registry_lot37.json'
      - 'data/audit/microstructure_capability_matrix_lot37.json'
      - '.github/workflows/lot37-microstructure-scope-contracts.yml'
      - 'requirements-dev.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot37:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove certified source evidence and merge ancestry
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD=59b189e9980772245993a9212b6c8ad5e9a88a00
          EVIDENCE_HEAD=91c28f17acc2f66c906dddee96cbda369945f3ea
          IMPLEMENTATION_MERGE=f1da136ff956e40915fab42ae21748a6f2b1ebca
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          git merge-base --is-ancestor "$EVIDENCE_HEAD" HEAD
          git merge-base --is-ancestor "$IMPLEMENTATION_MERGE" HEAD
          git diff --quiet "$SOURCE_HEAD" HEAD -- \
            config/microstructure/microstructure_scope_offline_data_contracts_v1.json \
            contracts/schemas/microstructure_offline_l2_input_v1.schema.json \
            contracts/schemas/microstructure_offline_trade_input_v1.schema.json \
            contracts/schemas/microstructure_scope_offline_data_contracts_state_v1.schema.json \
            contracts/schemas/microstructure_scope_offline_data_contracts_audit_v1.schema.json \
            contracts/schemas/microstructure_scope_offline_data_contracts_contract_registry_v1.schema.json \
            contracts/schemas/microstructure_scope_offline_data_contracts_capability_matrix_v1.schema.json \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts.py \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_models.py \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_validation.py \
            scripts/run_lot37_microstructure_scope_and_offline_data_contracts.py \
            scripts/validate_lot37.py \
            tests/test_lot37_microstructure_scope_and_offline_data_contracts.py \
            tests/test_lot37_branch_coverage.py \
            docs/LOT_37_MICROSTRUCTURE_SCOPE_AND_OFFLINE_DATA_CONTRACTS.md \
            docs/ACCEPTANCE_CRITERIA_LOT_37.md
          git diff --quiet "$EVIDENCE_HEAD" HEAD -- \
            data/audit/microstructure_scope_and_offline_data_contracts_lot37.json \
            data/audit/microstructure_scope_and_offline_data_contracts_audit_lot37.json \
            data/audit/microstructure_contract_registry_lot37.json \
            data/audit/microstructure_capability_matrix_lot37.json \
            reports/lot37/coverage_summary.json \
            reports/lot37/mutation_summary.json \
            reports/lot_37_microstructure_scope_and_offline_data_contracts_report.md
      - name: Compile lint type schema and frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m json.tool config/microstructure/microstructure_scope_offline_data_contracts_v1.json >/dev/null
          for schema in \
            microstructure_offline_l2_input_v1 \
            microstructure_offline_trade_input_v1 \
            microstructure_scope_offline_data_contracts_state_v1 \
            microstructure_scope_offline_data_contracts_audit_v1 \
            microstructure_scope_offline_data_contracts_contract_registry_v1 \
            microstructure_scope_offline_data_contracts_capability_matrix_v1; do
            python -m json.tool "contracts/schemas/${schema}.schema.json" >/dev/null
          done
          ruff check \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts.py \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_models.py \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_validation.py \
            scripts/run_lot37_microstructure_scope_and_offline_data_contracts.py \
            scripts/validate_lot37.py \
            scripts/validate_lot37_frozen_evidence.py \
            tests/test_lot37_microstructure_scope_and_offline_data_contracts.py \
            tests/test_lot37_branch_coverage.py
          mypy src/crypto_quant_bot/microstructure
          python scripts/validate_lot37_frozen_evidence.py
          python scripts/validate_lot37.py --expected-code-commit 59b189e9980772245993a9212b6c8ad5e9a88a00
      - name: Architecture roadmap traceability engineering and no-future scans
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          if grep -REn '^[[:space:]]*(import|from)[[:space:]]+(requests|urllib|socket|httpx|aiohttp)' \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts*.py \
            scripts/run_lot37_microstructure_scope_and_offline_data_contracts.py scripts/validate_lot37.py; then
            echo 'LOT37_FORBIDDEN_NETWORK_IMPORT'
            exit 1
          fi
      - name: Security dependency regression and anti-flake
        run: |
          bandit -q -r \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts.py \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_models.py \
            src/crypto_quant_bot/microstructure/microstructure_scope_and_offline_data_contracts_validation.py \
            scripts/run_lot37_microstructure_scope_and_offline_data_contracts.py \
            scripts/validate_lot37.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          pytest -q tests/test_lot37_microstructure_scope_and_offline_data_contracts.py tests/test_lot37_branch_coverage.py
          pytest -q tests/test_lot37_microstructure_scope_and_offline_data_contracts.py tests/test_lot37_branch_coverage.py
          pytest -q tests/test_lot37_microstructure_scope_and_offline_data_contracts.py tests/test_lot37_branch_coverage.py
