name: P0.6 final repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/p06-final-pre-lot26-assurance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p06-final-pre-lot26-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Apply final corrections
        run: python scripts/patch_p06_test_expectations.py
      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'P0.6 corrections already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_p06_trend_range_momentum_complete.py
          git add tests/test_p06_vrc_complete.py
          git add scripts/run_p06_final_assurance.py
          git commit -m 'Finalize P0.6 tests and assurance runner'
          git push origin HEAD:agent/p06-final-pre-lot26-assurance
