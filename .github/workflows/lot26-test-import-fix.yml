name: Lot 26 one-shot test fixture import remediation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lot26-test-import-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/lot26-multi-timeframe-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot26-multi-timeframe-alignment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Qualify Lot 26 fixture imports
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = 0
          for path in sorted(Path('tests').glob('test_lot26_*.py')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('from lot26_fixtures import', 'from tests.lot26_fixtures import')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          if changed != 6:
              raise SystemExit(f'expected 6 fixture import updates, found {changed}')
          PY
      - name: Verify lint and test collection
        run: |
          ruff check tests/lot26_fixtures.py tests/test_lot26_*.py
          pytest --collect-only -q tests/test_lot26_*.py
      - name: Commit verified import fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_lot26_*.py
          git diff --cached --quiet || git commit -m 'Lot26 qualify test fixture imports'
          git push origin HEAD:agent/lot26-multi-timeframe-alignment
