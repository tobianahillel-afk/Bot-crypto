name: Lot 36 post-merge audit build controller

on:
  push:
    branches: [agent/lot36-post-merge-audit]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot36-post-merge-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Build governance-only Lot36 audit package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 87da195283797247505e4fc650214e33e759e21a HEAD
          git diff --quiet 87da195283797247505e4fc650214e33e759e21a...HEAD -- src/
          python - <<'PY'
          from __future__ import annotations

          import copy
          import json
          from pathlib import Path

          ROOT = Path('.')
          MERGED = '87da195283797247505e4fc650214e33e759e21a'
          IMPLEMENTATION = 'c21b8f242270bd87eebbf7279635ab8bb51b8666'
          EVIDENCE = 'b3680f5da0a3fd98fdedc31599c829dc60808290'
          EXACT_CI = '16f3454c6f912f3f00f79836950047b15687abce'

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + '\n', encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'REPLACE_COUNT_{path}_{count}: {old[:80]!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          previous = json.loads((ROOT / 'data/audit/roadmap_lifecycle_overlay_lot35.json').read_text())
          overlay = copy.deepcopy(previous)
          overlay['latest_implemented_lot'] = 36
          overlay['previous_overlay'] = 'data/audit/roadmap_lifecycle_overlay_lot35.json'
          overlay['lots']['36'] = {
              'acceptance_contract': 'docs/ACCEPTANCE_CRITERIA_LOT_36.md',
              'audit_artifact': 'data/audit/freshness_gap_outage_audit_and_v3_closure_audit_lot36.json',
              'closure_manifest': 'data/audit/closure_manifest_lot36.json',
              'config': 'config/data_governance/freshness_gap_outage_v3_closure_v1.json',
              'evidence_commit': EVIDENCE,
              'exact_ci_commit': EXACT_CI,
              'execution_allowed': False,
              'external_connectivity_allowed': False,
              'implementation_commit': IMPLEMENTATION,
              'implementation_contract': 'docs/LOT_36_FRESHNESS_GAP_OUTAGE_AUDIT_AND_V3_CLOSURE.md',
              'merged_commit': MERGED,
              'network_ingestion_allowed': False,
              'post_merge_audit': 'docs/LOT_36_POST_MERGE_AUDIT.md',
              'pull_request': 34,
              'quality_coverage_evidence': 'reports/lot36/coverage_summary.json',
              'quality_mutation_evidence': 'reports/lot36/mutation_summary.json',
              'raw_data_mutation_allowed': False,
              'replay_artifact': 'data/audit/replay_evidence_lot36.json',
              'report': 'reports/lot_36_freshness_gap_outage_audit_and_v3_closure_report.md',
              'runner': 'scripts/run_lot36_freshness_gap_outage_audit_and_v3_closure.py',
              'runtime_mode': 'DATA_GOVERNANCE_ONLY',
              'state_artifact': 'data/audit/freshness_gap_outage_audit_and_v3_closure_lot36.json',
              'status': 'IMPLEMENTED_VALIDATED_V3_CLOSURE_ONLY',
              'trade_allowed': False,
              'v3_closed': True,
              'validator': 'scripts/validate_lot36.py',
          }
          overlay['lots']['37'] = {'implementation_started': False, 'status': 'PLANNED_LOCKED'}
          write('data/audit/roadmap_lifecycle_overlay_lot36.json', json.dumps(overlay, indent=2, sort_keys=True))

          write('docs/LOT_36_POST_MERGE_AUDIT.md', f'''# Lot 36 — Independent Post-Merge Audit and V3 Closure

