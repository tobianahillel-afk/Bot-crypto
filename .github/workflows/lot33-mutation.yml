name: Lot 33 critical mutation assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/crypto_quant_bot/data_governance/timestamp_*.py'
      - 'tests/test_lot33_*.py'
      - 'config/data_governance/timestamp_clock_timezone_governance_v1.json'
      - '.github/workflows/lot33-mutation.yml'
      - 'requirements-dev.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Build isolated Lot 33 mutation workspace
        run: |
          rm -rf .tmp-lot33-mutants reports/lot33/mutation
          mkdir -p \
            .tmp-lot33-mutants/src/crypto_quant_bot/data_governance \
            .tmp-lot33-mutants/tests \
            .tmp-lot33-mutants/config/data_governance \
            .tmp-lot33-mutants/data/audit \
            .tmp-lot33-mutants/mutants/src/crypto_quant_bot/data_governance \
            .tmp-lot33-mutants/mutants/config/data_governance \
            .tmp-lot33-mutants/mutants/data/audit \
            reports/lot33/mutation
          cp src/crypto_quant_bot/__init__.py .tmp-lot33-mutants/src/crypto_quant_bot/
          cp src/crypto_quant_bot/data_governance/*.py .tmp-lot33-mutants/src/crypto_quant_bot/data_governance/
          cat > .tmp-lot33-mutants/src/crypto_quant_bot/data_governance/__init__.py <<'PY'
          """Minimal Lot 33 package used only by the isolated mutation campaign."""
          PY
          cp tests/test_lot33_timestamp_clock_and_timezone_governance.py .tmp-lot33-mutants/tests/
          cp tests/test_lot33_validation_boundaries.py .tmp-lot33-mutants/tests/
          cp tests/test_lot33_mutation_oracles.py .tmp-lot33-mutants/tests/
          cp config/data_governance/timestamp_clock_timezone_governance_v1.json \
            .tmp-lot33-mutants/config/data_governance/
          cp data/audit/lot33_v3_entry_gate.json .tmp-lot33-mutants/data/audit/
          cp data/audit/instrument_registry_lot32.json .tmp-lot33-mutants/data/audit/
          cp data/audit/instrument_symbol_and_contract_normalization_lot32.json \
            .tmp-lot33-mutants/data/audit/
          cp data/audit/instrument_symbol_and_contract_normalization_audit_lot32.json \
            .tmp-lot33-mutants/data/audit/
          cat > .tmp-lot33-mutants/pyproject.toml <<'TOML'
          [project]
          name = "crypto-quant-bot"
          version = "0.33.0.dev0"
          requires-python = "==3.11.*"
          dependencies = []

          [tool.pytest.ini_options]
          pythonpath = ["src", "."]
          addopts = ["--tb=short", "-p", "no:cacheprovider"]

          [tool.mutmut]
          paths_to_mutate = [
            "src/crypto_quant_bot/data_governance/timestamp_clock_and_timezone_governance.py",
            "src/crypto_quant_bot/data_governance/timestamp_clock_timezone_models.py",
            "src/crypto_quant_bot/data_governance/timestamp_clock_timezone_validation.py",
          ]
          tests_dir = ["tests/"]
          runner = "python -m pytest -q tests/test_lot33_timestamp_clock_and_timezone_governance.py tests/test_lot33_validation_boundaries.py tests/test_lot33_mutation_oracles.py"
          also_copy = [
            "src/crypto_quant_bot/__init__.py",
            "src/crypto_quant_bot/data_governance/__init__.py",
            "src/crypto_quant_bot/data_governance/source_registry_validation.py",
            "src/crypto_quant_bot/data_governance/source_registry_models.py",
            "src/crypto_quant_bot/data_governance/source_registry_state.py",
            "src/crypto_quant_bot/data_governance/market_data_governance_scope_and_source_registry.py",
            "src/crypto_quant_bot/data_governance/market_data_governance_scope_and_source_registry_models.py",
            "config/data_governance/timestamp_clock_timezone_governance_v1.json",
            "data/audit/lot33_v3_entry_gate.json",
            "data/audit/instrument_registry_lot32.json",
            "data/audit/instrument_symbol_and_contract_normalization_lot32.json",
            "data/audit/instrument_symbol_and_contract_normalization_audit_lot32.json",
          ]
          mutate_only_covered_lines = true
          timeout_factor = 8.0
          do_not_mutate_patterns = ['raise \\w+', 'logger\\.\\w+']
          TOML
      - name: Run mutation suite
        shell: bash
        run: |
          set -o pipefail
          cd .tmp-lot33-mutants
          mutmut run 2>&1 | tee ../reports/lot33/mutation/run.txt
          mutmut results 2>&1 | tee ../reports/lot33/mutation/results.txt || true
      - name: Enforce mutation score
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('reports/lot33/mutation/run.txt')
          if not path.is_file():
              raise SystemExit('LOT33_MUTATION_RUN_LOG_MISSING')
          text = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          text = text.replace('\r', '\n').replace('\ufe0f', '')
          counter_pattern = re.compile(r'(\d+)\s*/\s*(\d+)')
          summary_pattern = re.compile(
              r'🎉\s*(\d+)[\s\S]*?⏰\s*(\d+)[\s\S]*?🤔\s*(\d+)[\s\S]*?🙁\s*(\d+)'
          )
          parsed = None
          for counter in reversed(list(counter_pattern.finditer(text))):
              completed, total = map(int, counter.groups())
              if completed != total or total <= 0:
                  continue
              summary = summary_pattern.search(text, counter.end())
              if summary is None:
                  continue
              killed, timeout, suspicious, survived = map(int, summary.groups())
              if killed + timeout + suspicious + survived == total:
                  parsed = (completed, total, killed, timeout, suspicious, survived)
                  break
          if parsed is None:
              raise SystemExit('LOT33_MUTATION_SCORE_PARSE_ERROR')
          completed, total, killed, timeout, suspicious, survived = parsed
          evaluated = killed + timeout + suspicious + survived
          score = 100.0 * (killed + timeout) / evaluated
          payload = {
              'schema_version': 'lot33-critical-mutation-score-v1',
              'scope': 'timestamp_clock_timezone_governance',
              'killed': killed,
              'timeout': timeout,
              'survived': survived,
              'suspicious': suspicious,
              'evaluated': evaluated,
              'completed': completed,
              'total': total,
              'score_percent': round(score, 2),
              'minimum_score_percent': 80.0,
              'status': 'PASS' if score >= 80.0 else 'FAIL',
          }
          output = Path('reports/lot33/mutation/score.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          if score < 80.0:
              raise SystemExit('LOT33_MUTATION_BELOW_80_PERCENT')
          PY
      - name: Verify canonical source immutability
        run: |
          rm -rf .tmp-lot33-mutants
          git diff --exit-code -- src/crypto_quant_bot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot33-critical-mutation-evidence
          path: reports/lot33/mutation/
