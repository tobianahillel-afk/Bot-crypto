name: Lot 41 V4 implementation entry gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/audit/lot41_v4_entry_gate.json'
      - 'contracts/schemas/lot41_v4_entry_gate_v1.schema.json'
      - 'docs/LOT_41_V4_ENTRY_GATE.md'
      - 'reports/lot_41_v4_entry_gate_report.md'
      - 'scripts/validate_lot41_entry_gate.py'
      - 'tests/test_lot41_v4_entry_gate.py'
      - '.github/workflows/lot41-entry-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove immutable gate ancestry
        run: |
          set -euo pipefail
          GATE_MERGE=75822f8ea7c6f67f73649d2f43be6efba840ab67
          git merge-base --is-ancestor "$GATE_MERGE" HEAD
      - name: Replay exact merged entry gate
        run: |
          set -euo pipefail
          GATE_MERGE=75822f8ea7c6f67f73649d2f43be6efba840ab67
          git worktree add --detach /tmp/lot41-gate "$GATE_MERGE"
          (
            cd /tmp/lot41-gate
            python scripts/validate_lot41_entry_gate.py
            pytest -q tests/test_lot41_v4_entry_gate.py
          )
          git worktree remove /tmp/lot41-gate --force
      - name: Validate historical gate contract on current head
        run: |
          python -m compileall -q scripts tests
          python -m json.tool data/audit/lot41_v4_entry_gate.json >/dev/null
          python -m json.tool contracts/schemas/lot41_v4_entry_gate_v1.schema.json >/dev/null
          ruff check scripts/validate_lot41_entry_gate.py tests/test_lot41_v4_entry_gate.py
          pytest -q tests/test_lot41_v4_entry_gate.py
      - name: Architecture roadmap traceability engineering and security
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          bandit -q -r scripts/validate_lot41_entry_gate.py -ll
          pip-audit -r requirements-dev.lock
