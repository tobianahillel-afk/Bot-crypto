name: Security Dependencies

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements*.in"
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/security-dependencies.yml"
      - "config/governance/dependency_control_policy_v1.json"
      - "scripts/governance/validate_dependency_controls.py"
  push:
    branches:
      - main
      - engineering/bootstrap-development-engine
    paths:
      - "pyproject.toml"
      - "requirements*.in"
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/security-dependencies.yml"
      - "config/governance/dependency_control_policy_v1.json"
      - "scripts/governance/validate_dependency_controls.py"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-audit:
    name: Audit pinned Python lock
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install exact locked audit environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Audit exact dependency lock
        run: |
          pip-audit -r requirements-dev.lock --no-deps --disable-pip --strict --progress-spinner off

  dependency-review:
    name: Review introduced dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          warn-only: false
          show-openssf-scorecard: false
