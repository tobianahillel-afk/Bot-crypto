name: Certification Provenance

on:
  push:
    branches:
      - engineering/bootstrap-development-engine
    paths:
      - ".github/workflows/certification-provenance.yml"
      - "config/governance/certification_attestation_transport_v1.json"
      - "scripts/governance/validate_certification_attestation_transport.py"
      - "scripts/governance/selftest_certification_attestation_transport.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: certification-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport-probe:
    name: Native attestation transport probe
    if: github.ref == 'refs/heads/engineering/bootstrap-development-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Validate transport policy
        run: |
          python scripts/governance/validate_certification_attestation_transport.py --self-check
          python scripts/governance/selftest_certification_attestation_transport.py

      - name: Emit engineering-only canonical provenance probe
        id: probe
        run: |
          python scripts/governance/validate_certification_attestation_transport.py \
            --emit-probe "${RUNNER_TEMP}/certification-provenance-envelope.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Attest canonical provenance transport probe
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: certification-provenance-envelope.json
          subject-digest: sha256:${{ steps.probe.outputs.subject_sha256 }}
          predicate-type: https://github.com/tobianahillel-afk/Bot-crypto/attestations/certification-provenance/v1
          predicate-path: ${{ runner.temp }}/certification-provenance-envelope.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false

      - name: Verify native attestation outputs
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python scripts/governance/validate_certification_attestation_transport.py \
            --verify-action-outputs \
            --attestation-id "${ATTESTATION_ID}" \
            --attestation-url "${ATTESTATION_URL}" \
            --bundle-path "${BUNDLE_PATH}"
