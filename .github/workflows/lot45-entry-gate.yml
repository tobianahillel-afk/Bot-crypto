name: Lot 45 V4 implementation entry gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      BASE_COMMIT_SHA: 1fd85f26102f94d4c42a8f515b522c23028bac89
      LOT44_AUDIT_PR_HEAD: 0ddf2c3150b339b8573fead8c942c4b1efa4b300
      LOT44_POST_MERGE_CHECKSUM: b8b531b2fcb09a30728549cc480d54d9be71504356468704c102ff085c39ea9a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip

      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Locate exact immutable Lot 45 gate transition
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_COMMIT_SHA" HEAD
          cat > /tmp/lot45-gate-paths.txt <<'EOF'
          .github/workflows/lot44-entry-gate.yml
          .github/workflows/lot45-entry-gate.yml
          contracts/schemas/lot45_v4_entry_gate_v1.schema.json
          data/audit/lot45_v4_entry_gate.json
          docs/LOT_45_V4_ENTRY_GATE.md
          reports/lot_45_v4_entry_gate_report.md
          scripts/validate_lot45_entry_gate.py
          tests/test_lot45_v4_entry_gate.py
          EOF
          sort -o /tmp/lot45-gate-paths.txt /tmp/lot45-gate-paths.txt
          gate_commit=""
          while read -r candidate; do
            git diff --name-only "$BASE_COMMIT_SHA" "$candidate" | sort > /tmp/candidate-paths.txt
            if diff -q /tmp/lot45-gate-paths.txt /tmp/candidate-paths.txt >/dev/null; then
              gate_commit="$candidate"
              break
            fi
          done < <(git rev-list --first-parent "$BASE_COMMIT_SHA..HEAD")
          test -n "$gate_commit"
          echo "$gate_commit" | tee /tmp/lot45-gate-commit.txt
          while read -r path; do
            git diff --quiet "$gate_commit" HEAD -- "$path"
          done < /tmp/lot45-gate-paths.txt
          test "$(git show -s --format=%P "$BASE_COMMIT_SHA" | wc -w)" -eq 2
          git show -s --format=%P "$BASE_COMMIT_SHA" | grep -F 'e390b6e5d76c53d9dd6d74724f3246b92e628079'
          git show -s --format=%P "$BASE_COMMIT_SHA" | grep -F "$LOT44_AUDIT_PR_HEAD"

      - name: Replay certified Lot 44 post-merge GO
        run: |
          set -euo pipefail
          rm -rf /tmp/lot44-post-merge-certified
          git worktree add --detach /tmp/lot44-post-merge-certified "$LOT44_AUDIT_PR_HEAD"
          trap 'git worktree remove --force /tmp/lot44-post-merge-certified >/dev/null 2>&1 || true' EXIT
          (
            cd /tmp/lot44-post-merge-certified
            PYTHONPATH=src python scripts/validate_lot44_post_merge.py \
              | tee /tmp/lot44-post-merge-for-lot45.txt
          )
          grep -F '"status": "PASS"' /tmp/lot44-post-merge-for-lot45.txt
          grep -F '"verdict": "GO_LOT44_POST_MERGE"' /tmp/lot44-post-merge-for-lot45.txt
          grep -F "\"post_merge_checksum\": \"$LOT44_POST_MERGE_CHECKSUM\"" /tmp/lot44-post-merge-for-lot45.txt
          git worktree remove --force /tmp/lot44-post-merge-certified
          trap - EXIT

      - name: Replay gate at certified governance transition
        run: |
          set -euo pipefail
          gate_commit="$(cat /tmp/lot45-gate-commit.txt)"
          rm -rf /tmp/lot45-gate-certified
          git worktree add --detach /tmp/lot45-gate-certified "$gate_commit"
          trap 'git worktree remove --force /tmp/lot45-gate-certified >/dev/null 2>&1 || true' EXIT
          (
            cd /tmp/lot45-gate-certified
            python -m compileall -q scripts tests
            python -m json.tool data/audit/lot45_v4_entry_gate.json >/dev/null
            python -m json.tool contracts/schemas/lot45_v4_entry_gate_v1.schema.json >/dev/null
            ruff check scripts/validate_lot45_entry_gate.py tests/test_lot45_v4_entry_gate.py
            PYTHONPATH=src python scripts/validate_lot45_entry_gate.py \
              | tee /tmp/lot45-entry-gate.json
            grep -F '"status": "PASS"' /tmp/lot45-entry-gate.json
            grep -F '"verdict": "GO_LOT45_IMPLEMENTATION_ENTRY"' /tmp/lot45-entry-gate.json
            PYTHONPATH=src pytest -q tests/test_lot45_v4_entry_gate.py
            test ! -e src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine.py
            test ! -e src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine_models.py
            test ! -e src/crypto_quant_bot/microstructure/order_flow_delta_and_cvd_engine_validation.py
            test ! -e config/microstructure/order_flow_delta_and_cvd_engine_v1.json
            test ! -e scripts/run_lot45_order_flow_delta_and_cvd_engine.py
            test ! -e scripts/validate_lot45.py
            test ! -e tests/test_lot45_order_flow_delta_and_cvd_engine.py
            test ! -e contracts/schemas/order_flow_delta_cvd_engine_state_v1.schema.json
            test ! -e contracts/schemas/order_flow_delta_cvd_engine_audit_v1.schema.json
            test ! -e contracts/schemas/order_flow_state_v1.schema.json
            test ! -e contracts/schemas/cvd_series_v1.schema.json
            test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine.py
            test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine_models.py
          )
          git worktree remove --force /tmp/lot45-gate-certified
          trap - EXIT

      - name: Validate immutable gate contracts on current tree
        run: |
          set -euo pipefail
          python -m json.tool data/audit/lot45_v4_entry_gate.json >/dev/null
          python -m json.tool contracts/schemas/lot45_v4_entry_gate_v1.schema.json >/dev/null
          ruff check scripts/validate_lot45_entry_gate.py tests/test_lot45_v4_entry_gate.py
          python scripts/validate_lot45_entry_gate.py >/tmp/lot45-entry-gate-current.json
          grep -F '"verdict": "GO_LOT45_IMPLEMENTATION_ENTRY"' /tmp/lot45-entry-gate-current.json
          pytest -q tests/test_lot45_v4_entry_gate.py

      - name: Architecture roadmap traceability and engineering controls
        run: |
          set -euo pipefail
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py

      - name: Security dependency full regression and anti-flake
        run: |
          set -euo pipefail
          bandit -q -r scripts/validate_lot45_entry_gate.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do
            pytest -q tests/test_lot45_v4_entry_gate.py
          done

      - name: Re-prove Lot 46 downstream lock on current tree
        run: |
          set -euo pipefail
          test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine.py
          test ! -e src/crypto_quant_bot/microstructure/trade_classification_confidence_engine_models.py
          test ! -e scripts/run_lot46_trade_classification_confidence_engine.py
          test ! -e scripts/validate_lot46.py
          test ! -e tests/test_lot46_trade_classification_confidence_engine.py
          test ! -e data/audit/trade_classification_confidence_engine_lot46.json
          test ! -e reports/lot_46_trade_classification_confidence_engine_report.md
          test ! -e docs/LOT_46_TRADE_CLASSIFICATION_CONFIDENCE_ENGINE.md
          test ! -e docs/ACCEPTANCE_CRITERIA_LOT_46.md

      - name: Upload Lot 45 entry gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lot45-entry-gate-evidence
          path: |
            data/audit/lot45_v4_entry_gate.json
            reports/lot_45_v4_entry_gate_report.md
            /tmp/lot45-entry-gate.json
          if-no-files-found: error
