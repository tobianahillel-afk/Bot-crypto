name: Lot 38 V4 implementation entry gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/audit/lot38_v4_entry_gate.json'
      - 'contracts/schemas/lot38_v4_entry_gate_v1.schema.json'
      - 'docs/LOT_38_V4_ENTRY_GATE.md'
      - 'reports/lot_38_v4_entry_gate_report.md'
      - 'scripts/validate_lot38_entry_gate.py'
      - 'tests/test_lot38_v4_entry_gate.py'
      - '.github/workflows/lot38-entry-gate.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove immutable historical gate ancestry
        shell: bash
        run: |
          set -euo pipefail
          GATE_BASE=c7ff8eecafd5f34196e9383013e97548b1a0ba02
          GATE_MERGE=2120aab94d54fde6e9ad36022499b1f9f284c3f6
          git merge-base --is-ancestor "$GATE_BASE" "$GATE_MERGE"
          git merge-base --is-ancestor "$GATE_MERGE" HEAD
          git diff --quiet "$GATE_MERGE" HEAD -- \
            data/audit/lot38_v4_entry_gate.json \
            contracts/schemas/lot38_v4_entry_gate_v1.schema.json \
            docs/LOT_38_V4_ENTRY_GATE.md \
            reports/lot_38_v4_entry_gate_report.md \
            scripts/validate_lot38_entry_gate.py \
            tests/test_lot38_v4_entry_gate.py
      - name: Compile lint type schema and immutable gate
        run: |
          python -m compileall -q scripts tests
          python -m json.tool data/audit/lot38_v4_entry_gate.json >/dev/null
          python -m json.tool contracts/schemas/lot38_v4_entry_gate_v1.schema.json >/dev/null
          ruff check scripts/validate_lot38_entry_gate.py tests/test_lot38_v4_entry_gate.py
          mypy src/crypto_quant_bot
          python -m scripts.validate_lot38_entry_gate
      - name: Architecture roadmap traceability and engineering gates
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
      - name: Gate tests full regression and anti-flake
        run: |
          pytest -q tests/test_lot38_v4_entry_gate.py
          pytest -q
          pytest -q tests/test_lot38_v4_entry_gate.py
          pytest -q tests/test_lot38_v4_entry_gate.py
          pytest -q tests/test_lot38_v4_entry_gate.py
      - name: Security and final validator
        run: |
          bandit -q -r scripts/validate_lot38_entry_gate.py -ll
          pip-audit -r requirements-dev.lock
          python -m scripts.validate_lot38_entry_gate
