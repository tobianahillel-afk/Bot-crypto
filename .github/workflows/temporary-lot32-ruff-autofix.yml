name: Temporary scoped Lot 32 Ruff autofix

on:
  push:
    branches:
      - agent/lot33-ci-remediation
    paths:
      - '.github/workflows/temporary-lot32-ruff-autofix.yml'
      - 'src/crypto_quant_bot/data_governance/instrument_symbol_and_contract_normalization_models.py'
      - 'tests/test_lot32_instrument_symbol_and_contract_normalization.py'
      - 'tests/test_lot32_validation_boundaries.py'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lot33-ci-remediation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Apply only the reported Ruff fixes
        run: |
          python -m pip install ruff==0.12.0
          ruff check --fix \
            src/crypto_quant_bot/data_governance/instrument_symbol_and_contract_normalization_models.py \
            tests/test_lot32_instrument_symbol_and_contract_normalization.py \
            tests/test_lot32_validation_boundaries.py
      - name: Commit scoped fixes when present
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/crypto_quant_bot/data_governance/instrument_symbol_and_contract_normalization_models.py \
            tests/test_lot32_instrument_symbol_and_contract_normalization.py \
            tests/test_lot32_validation_boundaries.py
          git commit -m 'style(lot32): apply scoped Ruff autofixes'
          git push origin HEAD:agent/lot33-ci-remediation
