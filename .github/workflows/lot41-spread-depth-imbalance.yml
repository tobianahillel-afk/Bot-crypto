name: Lot 41 spread depth imbalance validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lot41:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
      GATE_MERGE_SHA: 75822f8ea7c6f67f73649d2f43be6efba840ab67
      SOURCE_HEAD_SHA: 14c0d8da1b02d076b3c43a07a34ac96c673018b0
      FINAL_PR_HEAD_SHA: 89ae244db77f16f31d226a7494d78b65b904dcd9
      IMPLEMENTATION_MERGE_SHA: a253ce35c97303e8b8c65707c07597e996b3a832
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install locked toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Prove exact gate source final-head and squash ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GATE_MERGE_SHA" "$SOURCE_HEAD_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" "$FINAL_PR_HEAD_SHA"
          git merge-base --is-ancestor "$IMPLEMENTATION_MERGE_SHA" HEAD
          git diff --quiet "$FINAL_PR_HEAD_SHA" "$IMPLEMENTATION_MERGE_SHA" -- .
      - name: Compile lint type schema and no-connectivity checks
        run: |
          set -euo pipefail
          mkdir -p reports/lot41
          python -m compileall -q src scripts tests
          for path in \
            config/microstructure/spread_depth_and_imbalance_engine_v1.json \
            contracts/schemas/book_feature_state_v1.schema.json \
            contracts/schemas/spread_depth_imbalance_engine_state_v1.schema.json \
            contracts/schemas/spread_depth_imbalance_engine_audit_v1.schema.json; do
            python -m json.tool "$path" >/dev/null
          done
          ruff check \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_models.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_validation.py \
            src/crypto_quant_bot/microstructure/__init__.py \
            scripts/run_lot41_spread_depth_and_imbalance_engine.py \
            scripts/validate_lot41.py scripts/validate_lot41_no_connectivity.py \
            tests/test_lot41*.py
          mypy src/crypto_quant_bot/microstructure
          python scripts/validate_lot41_no_connectivity.py
      - name: Targeted line and branch coverage
        run: |
          coverage erase
          pytest -q tests/test_lot41*.py \
            --cov=crypto_quant_bot.microstructure.spread_depth_and_imbalance_engine \
            --cov=crypto_quant_bot.microstructure.spread_depth_and_imbalance_engine_models \
            --cov=crypto_quant_bot.microstructure.spread_depth_and_imbalance_engine_validation \
            --cov-branch --cov-report=json:reports/lot41/coverage.json --cov-report=term-missing
          python - <<'PY'
          import json, os
          from pathlib import Path
          totals=json.loads(Path('reports/lot41/coverage.json').read_text())['totals']
          lines=float(totals['percent_statements_covered'])
          branches=float(totals['percent_branches_covered'])
          result={
              'schema_version':'lot41-coverage-summary-v1',
              'status':'PASS' if lines>=95 and branches>=90 else 'FAIL',
              'source_head_sha':os.environ['CANDIDATE_SHA'],
              'line_coverage_percent':round(lines,2),
              'branch_coverage_percent':round(branches,2),
              'line_coverage_min_percent':95.0,
              'branch_coverage_min_percent':90.0,
              'anti_flake_repetitions':3,
          }
          Path('reports/lot41/coverage_summary.json').write_text(
              json.dumps(result,indent=2,sort_keys=True)+'\n', encoding='utf-8'
          )
          print(json.dumps(result,sort_keys=True))
          if result['status']!='PASS':
              raise SystemExit('LOT41_CRITICAL_COVERAGE_BELOW_THRESHOLD')
          PY
      - name: Replay certified source generate validate and deterministic evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/lot41-source-certified /tmp/lot41-run1
          git worktree add --detach /tmp/lot41-source-certified "$SOURCE_HEAD_SHA"
          trap 'git worktree remove --force /tmp/lot41-source-certified >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/lot41-run1
          (
            cd /tmp/lot41-source-certified
            outputs=(
              data/audit/spread_depth_and_imbalance_engine_lot41.json
              data/audit/spread_depth_and_imbalance_engine_audit_lot41.json
              data/audit/book_feature_state_lot41.json
            )
            PYTHONPATH=src python scripts/run_lot41_spread_depth_and_imbalance_engine.py \
              --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot41.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            PYTHONPATH=src python scripts/validate_lot41_no_connectivity.py
            for path in "${outputs[@]}"; do
              cp "$path" "/tmp/lot41-run1/$(basename "$path")"
            done
            PYTHONPATH=src python scripts/run_lot41_spread_depth_and_imbalance_engine.py \
              --code-commit "$SOURCE_HEAD_SHA"
            PYTHONPATH=src python scripts/validate_lot41.py \
              --expected-code-commit "$SOURCE_HEAD_SHA" --require-persisted
            for path in "${outputs[@]}"; do
              cmp "/tmp/lot41-run1/$(basename "$path")" "$path"
            done
          )
          git worktree remove --force /tmp/lot41-source-certified
          trap - EXIT
      - name: Architecture roadmap traceability engineering and safety
        run: |
          python scripts/validate_roadmap_documentation.py
          python scripts/validate_architecture_boundaries.py
          python scripts/validate_domain_architecture.py
          python scripts/audit_roadmap_semantics.py
          python scripts/validate_traceability_contract.py
          python scripts/check_no_silent_numeric_coercion.py
          python scripts/quality_inventory.py
          python scripts/validate_engineering_deviations.py
          python scripts/validate_lot41_no_connectivity.py
          test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine.py
          test ! -e src/crypto_quant_bot/microstructure/book_resilience_and_replenishment_engine_models.py
          test ! -e scripts/run_lot43_book_resilience_and_replenishment_engine.py
          test ! -e scripts/validate_lot43.py
      - name: Security dependency regression and anti-flake
        run: |
          bandit -q -r \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_models.py \
            src/crypto_quant_bot/microstructure/spread_depth_and_imbalance_engine_validation.py \
            scripts/validate_lot41.py -ll
          pip-audit -r requirements-dev.lock
          pytest -q
          for repetition in 1 2 3; do pytest -q tests/test_lot41*.py; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot41-spread-depth-imbalance-evidence
          path: |
            reports/lot41/
            data/audit/spread_depth_and_imbalance_engine_lot41.json
            data/audit/spread_depth_and_imbalance_engine_audit_lot41.json
            data/audit/book_feature_state_lot41.json
